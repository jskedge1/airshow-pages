<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Widget | UK Airshow Guide</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>html{scrollbar-width:none}html::-webkit-scrollbar{display:none}body{margin:0;padding:4px;background:transparent;overflow-x:hidden}</style></head><body>
<!-- One widget on its own, for a Wix HTML box set to "Website address".
     embed.html?w=countdown&show=riat   (w is the widget name, show is optional) -->
<div id="w" class="ukag-widget"></div>
<script>
(function(){var p=new URLSearchParams(location.search),el=document.getElementById('w');
el.setAttribute('data-widget',(p.get('w')||'countdown').replace(/[^a-z]/g,''));
if(p.get('show'))el.setAttribute('data-show',p.get('show').replace(/[^a-z]/g,''));
function tell(){try{parent.postMessage({ukagWidgetHeight:document.documentElement.scrollHeight},'*');}catch(e){}}
window.addEventListener('load',function(){tell();if(window.ResizeObserver)new ResizeObserver(tell).observe(document.body);});})();
</script>
<script src="ukag-widgets.js"></script>
<!-- mobile-fit -->
<style>@media(max-width:340px){body{padding:0}}</style>
<!-- mobile-fit end -->
</body></html>
