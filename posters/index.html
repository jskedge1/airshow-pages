<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster set | The Big Guide to UK Airshows</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0}body{background:#0E2131;color:#fff;font-family:Barlow,Arial,sans-serif;padding:40px 24px 60px}
main{max-width:1280px;margin:0 auto}
h1{font:700 54px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em}
h2{font:700 30px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#32B4AF;margin:44px 0 16px}
p.lead{color:#D5E1E9;font-size:18px;margin-top:10px;max-width:760px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
a.card{display:block;color:inherit;text-decoration:none;background:#1C3850;border-radius:10px;overflow:hidden;border:1px solid #2A4256}
a.card:hover,a.card:focus-visible{border-color:#32B4AF;outline:none}
a.card img{display:block;width:100%;aspect-ratio:1200/1697;object-fit:cover}
a.card div{padding:12px 14px 14px}a.card b{display:block;font:700 22px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase}
a.card span{display:block;font-size:14px;color:#A8B7C2;margin-top:4px}
a.card small{display:inline-block;margin-top:10px;font-size:13px;color:#A9E3E0}
</style></head><body><main>
<h1>Poster set</h1>
<p class="lead">Twelve posters, made from the guide's own pages. Tap a poster for the full size image, or open the page version to print it at A3.</p>
<h2>Five mixed styles</h2><div class="grid" id="a"></div>
<h2>Five ways to get there</h2><div class="grid" id="b"></div>
<h2>More train route maps</h2><div class="grid" id="c"></div>
</main><script>
var P=[["01-season-at-a-glance","The 2027 season at a glance","Swiss typographic"],["02-first-airshow-blueprint","Your first airshow","Blueprint"],["03-riat-hud","RIAT is moving","Cockpit HUD"],["04-cosford-photo","RAF Cosford Air Show","Photo led"],["05-duxford-2027","Duxford 2027","Modern photo and type"],
["06-train-to-cosford-map","Train to Cosford","Rail route map"],["07-seaside-by-train-vintage","Take the train","Vintage railway poster"],["08-parking-road-signs","Parking on site","Road signs"],["09-check-before-you-travel-board","Check before you travel","Departure board"],["10-park-and-ride-bus","Park and ride","Bus stop bold"],
["11-train-to-clacton-map","Train to Clacton","Rail route map"],["12-train-to-duxford-map","Train to Duxford","Rail route map"]];
P.forEach(function(p,i){var a=document.createElement("a");a.className="card";a.href="png/"+p[0]+".png";
a.innerHTML='<img loading="lazy" src="png/'+p[0]+'.png" alt="'+p[1]+' poster, '+p[2]+' style"><div><b>'+p[1]+'</b><span>'+p[2]+'</span><small>Full size image</small></div>';
document.getElementById(i<5?"a":i<10?"b":"c").appendChild(a);
});
</script></body></html>
