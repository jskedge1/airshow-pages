<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><title>UK Airshow Guide: My Airshow Hub post, HUD edition (1080 x 1920)</title>
<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<meta name="hz:slide-selector" content=".slide"><meta name="hz:canvas-width" content="1080"><meta name="hz:canvas-height" content="1920">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--navy:#13293C;--deep:#0E2131;--teal:#32B4AF;--red:#D74949;--pur:#6950A1;
--body:"barlow","Barlow","Segoe UI",Helvetica,Arial,sans-serif;--display:"barlow-condensed","Barlow Condensed","Arial Narrow",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#5b6670}
body{font-family:var(--body);padding:24px 0;display:flex;flex-direction:column;align-items:center;gap:24px}
.slide{width:1080px;height:1920px;position:relative;overflow:hidden;flex:none;color:#fff}
.glyph{display:block}
.ph{position:absolute;left:0;top:0;width:1080px;height:1010px;display:block;z-index:0}
.tint{position:absolute;left:0;top:0;width:1080px;height:1012px;z-index:1}
.panel{position:absolute;left:0;top:890px;width:1080px;height:1030px;z-index:2;clip-path:polygon(0 120px,100% 0,100% 100%,0 100%)}
.dots{position:absolute;left:0;top:1490px;width:1080px;height:430px;z-index:3;background-image:radial-gradient(rgba(255,255,255,.16) 4px,transparent 4.6px);background-size:30px 30px}
.trail{position:absolute;left:-60px;width:1200px;height:16px;border-radius:8px;transform:rotate(-6.34deg);z-index:3}
.tr1{top:872px;background:var(--red)}
.tr2{top:898px;background:#fff}
.tr3{top:924px;background:var(--teal)}
.logo2{position:absolute;left:34px;top:126px;width:470px;height:237px;display:block;transform:rotate(-4deg);z-index:6;filter:drop-shadow(9px 9px 0 rgba(14,33,49,.42))}
.logo{position:absolute;left:54px;top:150px;width:392px;height:146px;background:#fff;border-radius:28px;transform:rotate(-4deg);z-index:6;display:flex;align-items:center;justify-content:center}
.logo img{width:336px;height:112px;display:block}
.badge{position:absolute;left:810px;top:140px;width:210px;height:210px;border-radius:30px;border:8px solid #fff;transform:rotate(9deg);z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center}
.badge-a{font-family:var(--display);font-weight:800;font-size:84px;line-height:72px;letter-spacing:-1px;color:#fff}
.badge-b{font-family:var(--display);font-weight:700;font-size:30px;line-height:32px;letter-spacing:4px;color:#fff}
.burst{position:absolute;left:806px;top:520px;width:236px;height:236px;transform:rotate(-12deg);z-index:6}
.burst svg{position:absolute;left:0;top:0;width:236px;height:236px;display:block}
.burst-t{position:absolute;left:0;top:0;width:236px;height:236px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.burst-t p{font-family:var(--display);font-weight:800;font-size:50px;line-height:46px;letter-spacing:0;text-transform:uppercase;white-space:nowrap}
.stack{position:absolute;left:60px;top:560px;width:850px;height:930px;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start}
.kick{border-radius:14px;height:66px;padding:0 22px;display:flex;align-items:center;transform:rotate(-3deg);margin:0 0 22px 6px}
.kick p{font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:2.5px;text-transform:uppercase;white-space:nowrap}
.hl{border-radius:20px;padding:0 26px;transform:rotate(-3deg);display:flex;align-items:center;margin-bottom:10px}
.hl p{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:-1px;white-space:nowrap}
.hl:nth-of-type(odd){margin-left:26px}
.b-white{background:#fff;color:var(--navy)}
.b-red{background:var(--red);color:#fff}
.b-teal{background:var(--teal);color:var(--deep)}
.b-navy{background:var(--navy);color:#fff}
.tips{width:850px;margin-top:30px;display:flex;flex-direction:column;gap:16px}
.tip{height:104px;background:#fff;border-radius:24px;display:flex;align-items:center;gap:20px;padding:0 22px 0 18px}
.tip:nth-child(1){width:770px}
.tip:nth-child(2){width:770px;margin-left:36px}
.tip:nth-child(3){width:770px;margin-left:72px}
.num{width:68px;height:68px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.num p{font-family:var(--display);font-weight:800;font-size:48px;line-height:48px;color:#fff}
.tip-c{flex:1;min-width:0}
.tip-t{font-family:var(--display);font-weight:800;font-size:56px;line-height:56px;text-transform:uppercase;letter-spacing:.3px;color:var(--navy);white-space:nowrap}
.tip-s{font-weight:600;font-size:30px;line-height:36px;color:#4A5A66;white-space:nowrap}
.cta{margin-top:28px;display:flex;align-items:center;gap:22px}
.pill{height:92px;border-radius:20px;padding:0 24px 0 30px;display:flex;align-items:center;gap:14px;transform:rotate(-2deg)}
.pill p{font-family:var(--display);font-weight:800;font-size:52px;line-height:52px;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap}
.pill .glyph{width:46px;height:46px}
.c-white{background:#fff;color:var(--red)}
.c-navy{background:var(--deep);color:#fff}
.c-red{background:var(--red);color:#fff}
.site{font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.5px;color:#fff;white-space:nowrap}
.low{position:absolute;left:60px;top:1560px;width:960px;z-index:5}
.low-a{font-family:var(--display);font-weight:800;font-size:46px;line-height:50px;letter-spacing:2px;text-transform:uppercase;color:#fff;white-space:nowrap}
.low-b{font-weight:600;font-size:30px;line-height:40px;color:rgba(255,255,255,.88);margin-top:6px;white-space:nowrap}
.bar{position:absolute;left:0;top:1860px;width:1080px;height:60px;z-index:5;display:flex}
.bar div{flex:1;height:60px}

.hud{position:absolute;left:0;top:0;width:1080px;height:1010px;z-index:0;background:#061019}
.hud-svg{position:absolute;left:0;top:0;width:1080px;height:1010px;display:block}
.hud-img{position:absolute;left:0;top:0;width:1080px;height:1010px;display:block;z-index:0}
.ph-b{position:absolute;left:404px;top:446px;width:304px;height:379px;transform:rotate(-7deg);z-index:1;display:block;filter:drop-shadow(0 0 26px rgba(95,227,220,.35))}
.ph-a{position:absolute;left:628px;top:150px;width:362px;height:756px;transform:rotate(6deg);z-index:1;display:block;filter:drop-shadow(0 0 34px rgba(95,227,220,.45))}
.mono{font-family:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.sys{position:absolute;left:66px;top:424px;z-index:4;display:flex;flex-direction:column;gap:10px}
.sys p{font-size:22px;line-height:28px;color:#5FE3DC}
.sys .dim{color:#A9BDCB}
.cmd{font-size:31px;line-height:40px;color:#5FE3DC;margin:0 0 20px 8px;text-shadow:0 0 14px rgba(6,16,25,.9)}
.tr3{background:#5FE3DC}
.htip{height:104px;width:770px;position:relative;background:rgba(6,16,25,.72);border:2.5px solid rgba(95,227,220,.6);border-radius:12px;display:flex;align-items:center;gap:22px;padding:0 22px 0 22px;box-shadow:0 0 26px rgba(95,227,220,.16)}
.htip:nth-child(2){margin-left:36px}
.htip:nth-child(3){margin-left:72px}
.hnum{font-size:40px;line-height:44px;color:#5FE3DC;flex:none;letter-spacing:1px}
.htip-t{font-family:var(--display);font-weight:800;font-size:56px;line-height:56px;text-transform:uppercase;letter-spacing:.3px;color:#fff;white-space:nowrap}
.cn{position:absolute;width:26px;height:26px;border:5px solid #5FE3DC}
.cn-a{left:-3px;top:-3px;border-right:none;border-bottom:none;border-radius:12px 0 0 0}
.cn-b{right:-3px;bottom:-3px;border-left:none;border-top:none;border-radius:0 0 12px 0}
</style></head><body>
