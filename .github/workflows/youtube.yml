name: YouTube videos
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - tools-youtube.py
      - .github/workflows/youtube.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools-youtube.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain youtube/videos.json)" ]; then
            git config user.name "airshow-pages bot"
            git config user.email "actions@users.noreply.github.com"
            git add youtube/videos.json
            git commit -m "YouTube: new videos from the channel"
            git push
          fi
