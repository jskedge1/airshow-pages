<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airshow Forum | The Big Guide to UK Airshows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#13293C;--navy-d:#0E2131;--teal:#32B4AF;--hud:#5FE3DC;--purple:#6950A1;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--navy-d);scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{font-family:'Barlow',sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;transition:opacity .45s var(--ease),transform .55s var(--ease)}
.stage iframe.off{opacity:0;transform:scale(.985);pointer-events:none;visibility:hidden}
.stage iframe.going{visibility:visible}

/* Look switch */
.look{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;align-items:center;gap:4px;padding:6px;background:rgba(14,33,49,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 16px 40px rgba(0,0,0,.38);border-top:3px solid var(--teal);transition:border-color .45s var(--ease)}
.look.hud{border-top-color:var(--hud)}
.look .lbl{font-weight:600;font-size:14px;color:#9FD8D5;padding:0 8px 0 6px;white-space:nowrap}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.06)}
.seg .pill{position:absolute;top:0;bottom:0;left:0;width:50%;background:var(--teal);transition:transform .45s var(--ease),background .45s var(--ease)}
.look.hud .seg .pill{transform:translateX(100%);background:var(--hud)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;gap:8px;border:0;background:none;color:#fff;font-weight:700;font-size:14.5px;padding:10px 14px;cursor:pointer;white-space:nowrap;transition:color .35s}
.look.hud .seg button[data-look=hud]{color:var(--navy-d)}
.seg button svg{width:16px;height:16px;flex:none}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.look .info{border:0;background:none;color:#9FD8D5;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;transition:color .3s}
.look .info:hover{color:#fff}

/* First visit hint */
.hint{position:fixed;right:18px;bottom:84px;z-index:21;width:min(320px,calc(100% - 36px));background:#fff;color:var(--navy);padding:16px 18px 14px;border-left:5px solid var(--purple);box-shadow:0 18px 44px rgba(0,0,0,.3);animation:rise .5s var(--ease)}
.hint h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;font-size:21px;line-height:1}
.hint p{margin-top:6px;font-size:14.5px;line-height:1.5;color:#26343E}
.hint button{margin-top:10px;border:0;background:var(--navy);color:#fff;font-weight:600;font-size:14px;padding:8px 14px;cursor:pointer}
.hint::after{content:"";position:absolute;right:40px;bottom:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:520px){
  .look{left:12px;right:12px;bottom:12px;justify-content:space-between}
  .look .lbl{display:none}
  .seg{flex:1}
  .seg button{justify-content:center;padding:11px 8px}
  .hint{right:12px;left:12px;width:auto;bottom:76px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stage">
  <iframe id="f-clean" src="forum-clean.html" title="Airshow forum, clean look"></iframe>
  <iframe id="f-hud" class="off" title="Airshow forum, HUD look" loading="lazy" data-src="forum-hud.html"></iframe>
</div>

<div class="look" id="look" role="group" aria-label="Choose how the forum looks">
  <span class="lbl">Forum look</span>
  <div class="seg">
    <span class="pill" aria-hidden="true"></span>
    <button type="button" data-look="clean" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="4" width="18" height="16"/><path d="M3 9h18M8 13h8M8 16h5"/></svg>Clean</button>
    <button type="button" data-look="hud" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-5"/></svg>HUD</button>
  </div>
  <button type="button" class="info" id="infoBtn" aria-label="What is this?"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg></button>
</div>

<div class="hint" id="hint" hidden role="dialog" aria-labelledby="hintT">
  <h2 id="hintT">Pick your look</h2>
  <p>Same forum, two styles. Clean is easy to read and matches the rest of the site. HUD is the darker cockpit style from My Airshow Hub. Switch whenever you like and I will remember your choice.</p>
  <button type="button" id="hintOk">Got it</button>
</div>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const F={clean:$('#f-clean'),hud:$('#f-hud')};
  const SECS=['feed','groups','corner','buddy','live','rarity','kit','how','admin'];
  const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  let cur='clean';

  function doc(f){try{return f.contentDocument}catch(e){return null}}
  function where(f){
    const d=doc(f);if(!d)return null;
    const id=SECS.find(x=>{const el=d.getElementById(x);return el&&!el.hasAttribute('data-off')});
    return {id:id||'feed',y:f.contentWindow.scrollY};
  }
  function goTo(f,pos){
    const d=doc(f);if(!d||!pos)return;
    let id=pos.id;if(!d.getElementById(id))id='feed';
    const a=d.createElement('a');a.href='#'+id;a.hidden=true;d.body.appendChild(a);a.click();a.remove();
    const bar=d.querySelector('.jump'),w=f.contentWindow;
    if(pos.y<200)w.scrollTo(0,0);else if(bar)w.scrollTo(0,bar.getBoundingClientRect().top+w.scrollY);
  }
  function ready(f,cb){
    if(!f.src&&f.dataset.src){f.addEventListener('load',()=>cb(),{once:true});f.src=f.dataset.src;return}
    const d=doc(f);
    if(d&&d.readyState==='complete'&&d.body&&d.body.children.length)cb();
    else f.addEventListener('load',()=>cb(),{once:true});
  }
  function set(look,save){
    if(look===cur&&save!==false&&!F[look].classList.contains('off'))return;
    const from=F[cur],to=F[look],pos=where(from);
    ready(to,()=>{
      goTo(to,pos);
      to.classList.remove('off');
      from.classList.add('off');
      cur=look;
      $('#look').classList.toggle('hud',look==='hud');
      document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.look===look));
      
    });
    if(save!==false)store.set('forumLook',look);
  }
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{set(b.dataset.look);hideHint()}));

  /* warm the second look once the first has loaded, so switching is instant */
  F.clean.addEventListener('load',()=>{setTimeout(()=>{if(!F.hud.src)F.hud.src=F.hud.dataset.src},1200)},{once:true});

  const saved=store.get('forumLook');
  if(saved==='hud'){cur='clean';set('hud',false)}

  function hideHint(){$('#hint').hidden=true;store.set('forumLookHint','1')}
  $('#hintOk').addEventListener('click',hideHint);
  $('#infoBtn').addEventListener('click',()=>{const h=$('#hint');h.hidden=!h.hidden});
  if(!store.get('forumLookHint'))setTimeout(()=>{$('#hint').hidden=false},1400);
})();
</script>
</body>
</html>
