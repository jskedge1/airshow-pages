      <section class="panel ps-panel" id="photoShare">
        <header class="t"><h3>Share A Photo</h3><small>Camera settings read from the file</small></header>
        <div class="pbody">
          <p class="ps-intro">Add a photo and I read the shutter speed, aperture, ISO and lens straight from the file, so nobody has to ask what you used. It goes into Photographers' Corner and shows here under My Posts.</p>
          <form class="ps-form" id="psForm">
            <label class="ps-drop" id="psDrop">
              <input type="file" id="psFile" accept="image/jpeg,image/png,image/webp,image/heic" hidden>
              <img id="psPrev" alt="" hidden>
              <span id="psDropText"><b>Add A Photo</b>JPG straight from the camera works best</span>
            </label>
            <div class="ps-exif" id="psExif" hidden>
              <p class="ps-read" id="psRead">Reading camera settings</p>
              <div class="ps-grid">
                <label class="f">Shutter<input class="input" id="psShutter" maxlength="20"></label>
                <label class="f">Aperture<input class="input" id="psAperture" maxlength="20"></label>
                <label class="f">ISO<input class="input" id="psIso" maxlength="12"></label>
                <label class="f">Focal length<input class="input" id="psFocal" maxlength="20"></label>
                <label class="f">Camera<input class="input" id="psCamera" maxlength="60"></label>
                <label class="f">Lens<input class="input" id="psLens" maxlength="80"></label>
              </div>
              <div class="ps-grid">
                <label class="f ps-wide">Title<input class="input" id="psTitle" maxlength="90" placeholder="Typhoon slow pan at RIAT" required></label>
                <label class="f">Aircraft<input class="input" id="psAircraft" maxlength="80" placeholder="Eurofighter Typhoon"></label>
                <label class="f">Show<select class="input" id="psShowSel"></select></label>
                <label class="f">Category<select class="input" id="psCat"></select></label>
              </div>
              <label class="check ps-own"><input type="checkbox" id="psOwn"> This is my own photo</label>
              <div class="ov-go"><button class="btn" type="submit" id="psGo">Post My Photo</button><button class="btn small outline" type="button" id="psReset">Pick Another</button></div>
            </div>
          </form>
        </div>
      </section>
