<style id="camping-layout">
:root{--cond:"Barlow Condensed","Barlow",Arial Narrow,sans-serif;--pale:#E9EEF5;--deep:#0E2131;--purple:#6950A1;--red:#D74949}
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
body{background:#fff}

/* titles: capital at the start of each word, big ones condensed */
body :is(h1,h2,h3,h4,h5,h6,legend,summary,.panel-head h2 *){text-transform:capitalize!important}

/* header: full photo, centred condensed title, byline, glass bar over the bottom edge */
.cg-hero{position:relative;isolation:isolate;overflow:hidden;background:#13293C;color:#fff;min-height:clamp(560px,82vh,780px);display:flex;flex-direction:column;justify-content:flex-end}
.cg-bg{position:absolute!important;inset:0;z-index:0;height:auto!important}
.cg-bg img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:55% 45%;animation:cgDrift 26s ease-in-out infinite alternate}
.cg-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,41,60,.15) 0%,rgba(19,41,60,.6) 45%,rgba(19,41,60,.95) 100%)}
@media(max-width:700px){.cg-bg::after{background:linear-gradient(180deg,rgba(19,41,60,.3) 0%,rgba(19,41,60,.82) 30%,rgba(19,41,60,.96) 100%)}}
@keyframes cgDrift{from{transform:scale(1.03)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
.cg-in{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:120px;padding-bottom:34px}
.cg-in>*{animation:cgUp .8s cubic-bezier(.2,.7,.2,1) both}
.cg-in>*:nth-child(2){animation-delay:.08s}.cg-in>*:nth-child(3){animation-delay:.16s}.cg-in>*:nth-child(4){animation-delay:.24s}.cg-in>*:nth-child(5){animation-delay:.32s}.cg-in>*:nth-child(6){animation-delay:.4s}
@keyframes cgUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cg-crumb{font:500 16px/22px "Barlow",sans-serif;color:#DCE6EE;margin-bottom:16px}
.cg-crumb a{color:#fff;font-weight:600;text-underline-offset:4px}
.cg-crumb span{margin:0 8px;color:var(--teal)}
.cg-tag{display:inline-block;background:var(--purple);color:#fff;font:600 16px/1.3 "Barlow",sans-serif;padding:6px 14px}
body .cg-title{font:800 clamp(52px,9vw,118px)/.9 var(--cond);letter-spacing:.005em;margin-top:16px;text-shadow:0 4px 30px rgba(0,0,0,.35);text-transform:capitalize!important}
.cg-red{color:#D74949;text-shadow:0 2px 14px rgba(0,0,0,.35);font:700 clamp(19px,2.2vw,25px)/1.25 "Barlow",sans-serif;margin-top:14px}
.cg-sub{max-width:58ch;margin-top:14px;font-size:clamp(17px,1.8vw,19px);line-height:1.6;color:#E6EEF4}
.byline{display:flex;align-items:center;gap:12px;margin-top:22px;text-align:left;font:600 17px/1.25 "Barlow",sans-serif}
.byline small{display:block;color:#8FDCD8;font-weight:500;font-size:15px;margin-top:2px}
.byline .av{width:46px;height:46px;border-radius:50%;background:var(--purple);display:grid;place-items:center;font-weight:800;border:2px solid #fff}
.cg-planbar{position:relative;z-index:3;width:100%;padding-bottom:34px}
.cg-glass{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto auto;background:rgba(14,33,49,.9);border-top:4px solid var(--teal);box-shadow:0 18px 44px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:cgUp .9s .45s cubic-bezier(.2,.7,.2,1) both}
.cg-glass>div{display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-right:1px solid rgba(255,255,255,.1);text-align:left;min-width:0}
.cg-glass>div span{color:#8FDCD8;font:600 15px/1.2 "Barlow",sans-serif}
.cg-glass>div b{font:700 17px/1.3 "Barlow",sans-serif;color:#fff}
.cg-glass>div.hl{background:rgba(215,73,73,.92)}.cg-glass>div.hl span{color:#fff}
.cg-go{font:700 17px/1.2 "Barlow",sans-serif;border:0;background:var(--red);color:#fff;padding:0 24px;cursor:pointer;transition:background .3s}
.cg-go:hover{background:#B83C3C}.cg-go.alt{background:var(--teal)}.cg-go.alt:hover{background:#26928E}
.cg-go:focus-visible{outline:3px solid #fff;outline-offset:-4px}
@media(max-width:980px){.cg-glass{grid-template-columns:1fr 1fr}.cg-glass>div{border-bottom:1px solid rgba(255,255,255,.1)}.cg-go{padding:16px}}
@media(max-width:520px){.cg-in{padding-top:90px}.cg-glass>div{padding:12px 14px}.cg-glass>div b{font-size:16px}}
@media(prefers-reduced-motion:reduce){.cg-bg img.photo,.cg-in>*,.cg-glass{animation:none!important}}

/* notice strip under the header */
.notice.purple{background:var(--purple)}

/* chapter bar: deep navy, sticky, teal when hovered or in view, red reading line */
body .tabbar{position:sticky!important;top:0;z-index:40;background:var(--deep)!important;box-shadow:0 6px 18px rgba(0,0,0,.18);border:0}
body .tabbar .tablist{gap:0}
body .tabbar .tab{color:#fff!important;background:transparent;border:0!important;font:600 15px/1 "Barlow",sans-serif!important;letter-spacing:0!important;padding:19px 13px!important;transition:padding .4s ease,background .3s ease}
body .tabbar .tab:hover,body .tabbar .tab:focus-visible,body .tabbar .tab.on{background:var(--teal)!important;color:#fff!important;padding-left:22px!important;padding-right:22px!important}
.cg-read{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--red);z-index:2;transition:width .1s linear}
