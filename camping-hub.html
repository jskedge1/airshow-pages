 for(var d=0;d<days;d++){if(d>0)tot+=B[(d-1)%B.length].c;tot+=L[d%L.length].c;if(d<days-1)tot+=D[d%D.length].c;tot+=SNACK}return tot*p}

/* ---------- meal planner ---------- */
function mealPlanner(){return '<div class="calc"><div class="calc-in"><label>People eating<select id="ma">'+opts(1,12,2)+'</select></label><label>Nights<select id="mn">'+opts(1,9,2)+'</select></label></div><div id="mplan"></div></div>'}
function renderMeals(){var M=$('ma');if(!M)return;var p=+M.value,n=+$('mn').value,days=n+1,h='<div class="table-wrap"><table class="rt meal"><thead><tr><th>Day</th><th>Breakfast</th><th>Show day lunch</th><th>Evening meal</th><th>Cost for '+p+'</th></tr></thead><tbody>';
 var B=MEALS.filter(function(m){return m.s==='b'}),L=MEALS.filter(function(m){return m.s==='l'}),D=MEALS.filter(function(m){return m.s==='d'});
 for(var d=0;d<days;d++){var first=d===0,last=d===days-1,b=first?null:B[(d-1)%B.length],l=L[d%L.length],e=last?null:D[d%D.length];
  var day=((b?b.c:0)+l.c+(e?e.c:0)+SNACK)*p;
  h+='<tr><td>Day '+(d+1)+(first?'<br><small>Arrive</small>':last?'<br><small>Go home</small>':'')+'</td><td>'+(b?b.n:'Eat before you set off')+'</td><td>'+l.n+'</td><td>'+(e?e.n:'Home time')+'</td><td class="pr">£'+day.toFixed(2)+'</td></tr>'}
 var tot=mealTotal(p,n);
 h+='</tbody></table></div><div class="calc-out"><div><b>Food for the whole trip</b><span class="big">£'+tot.toFixed(2)+'</span><small>about £'+(tot/p/days).toFixed(2)+' per person per day</small></div><div><b>Shopping plan</b><span>'+(n>=4?'Shop for the first three days before you arrive, then top up at a local shop on day 3 or 4.':'One shop before you leave home is enough.')+'</span></div><div><b>What is included</b><span>Every meal in the table, 2 litres of bottled water and a bag of crisps per person per day. Add tea, coffee, butter, sauces and treats from your cupboard.</span></div></div>';
 $('mplan').innerHTML=h}

P.food=function(){return [
 {id:'simple',t:'Keep it simple',lvl:['b','Basics'],h:'<p class="pp">My biggest bit of advice for camp food is keep it simple. After a day walking the showground, the last thing you want is to come back and start a complicated meal.</p><p class="pp">You don’t need a different dinner every night either. Burgers one evening, pasta the next and chilli another is more than enough, and nobody has ever complained about a bacon roll.</p>'+photo('food')},
 {id:'co',t:'Never cook in a tent',lvl:['b','Basics'],h:'<div class="warnbox"><b>Carbon monoxide kills</b>Never light, use or bring a barbecue into a tent, awning or campervan, even when it has finished and looks cold. Don’t use gas stoves or heaters inside either. Carbon monoxide has no smell and can build up to deadly levels quickly. Headaches, dizziness, sickness and drowsiness are the warning signs. Get into fresh air and call NHS 111, or 999 in an emergency.</div>'},
 {id:'plan',t:'Plan your meals and what they cost',lvl:['b','Basics'],h:'<p class="pp">Before you leave home, I would roughly plan what you are eating each day. You don’t need every sausage accounted for, but a plan saves money and stops you buying far too much. Pick how many of you there are and how many nights, and this builds a plan with real supermarket prices.</p>'+mealPlanner()+'<p class="src">Costs use Tesco online prices checked on 18 October 2026 through Trolley.co.uk. Prices in store and at other supermarkets will differ a little.</p>'},
 {id:'meals',t:'Camp meals that work',lvl:['b','Basics'],h:'<p class="pp">These are the meals I keep coming back to. They are quick, filling and don’t create a mountain of washing up. The price is per person, worked out from real pack prices.</p><div class="meals">'+MEALS.map(function(m){return '<div class="mealc"><span class="mslot">'+{b:'Breakfast',l:'Show day lunch',d:'Evening meal'}[m.s]+'</span><b>'+m.n+'</b><span class="mprice">£'+m.c.toFixed(2)+' each</span><p>'+m.w+'</p></div>'}).join('')+'</div><details class="kitrows"><summary>See the supermarket prices behind these meals</summary><div class="table-wrap"><table class="rt"><tbody>'+FOODP.map(function(f){return '<tr><td>'+f[0]+'</td><td class="pr">£'+f[1].toFixed(2)+'</td></tr>'}).join('')+'</tbody></table></div></details>'+photo('food','camping-setup')},
 {id:'groups',t:'Cooking for 2, 4 or a big group',lvl:['c','Comfort'],h:'<div class="cols"><div class="col"><b>Two of you</b><p>A single burner stove, one frying pan, one saucepan and a small cool box covers everything on the menu above.</p></div><div class="col"><b>Four of you</b><p>Two burners save a lot of waiting. Use one cool box for food and one for drinks, because drinks fill a box fast.</p></div><div class="col"><b>Eight or more</b><p>This is where a shelter kitchen comes in: tables for prep, a sink unit, more than one stove and someone in charge of each meal. Take it in turns so nobody misses the evening flying.</p></div></div>'+seeAlso('lux','My shelter kitchen setup is in')},
 {id:'shop',t:'Where and when to shop',lvl:['b','Basics'],h:'<p class="pp">I do my main food shop before arriving, so I can set up the pitch and not head straight back out. For a long stay, don’t buy a week of fresh food in one go. Take enough for the first few days and top up locally.</p><p class="pp">Some campsites run small shops, food trucks or bars. Official RIAT Camping has food trucks every morning and evening. I would treat these as handy extras rather than relying on them for every meal.</p><div class="tip"><b>Show days.</b> I make sandwiches or wraps the night before and take snacks and drinks in with me. Then buying something at the show is a treat, not a necessity, and it saves a lot if you are going as a family for more than one day.</div>'},
 {id:'rules',t:'Check the show’s cooking rules',lvl:['b','Basics'],h:'<div class="cols"><div class="col"><b>RIAT</b><p>Single burner butane stoves raised off the grass. No charcoal barbecues or fire pits.</p></div><div class="col"><b>Shuttleworth</b><p>Charcoal barbecues raised at least 1ft, not until the flying ends on show days, and out by 22:00.</p></div><div class="col"><b>Headcorn and Sywell</b><p>Gas barbecues only, raised off the ground. Headcorn asks for a fire extinguisher.</p></div><div class="col"><b>Midlands Air Festival</b><p>No barbecues or campfires at all.</p></div></div>'},
 {id:'cool',t:'Your cool box',lvl:['b','Basics'],h:'<p class="pp">If you are bringing meat, milk or cheese, a decent cool box becomes one of the most useful things at camp. The Food Standards Agency says chilled food should stay between 0 and 5°C, and food should not be left out for more than 2 hours in warm weather. A cool box is not a fridge, so:</p>'+check([['Freeze water bottles','Ice packs you can drink later.'],['Freeze your first dinner','A frozen chilli keeps the box cold for the first day.'],['Keep it in the shade','Under the table or in the porch, never in a hot tent.'],['Open it less','One box for food, one for drinks.'],['Raw meat at the bottom','Sealed, away from ready to eat food.']])+'<p class="pp">Some campsites have a freezer for campers’ ice packs, so ask when you check in.</p>'+photo('food','freezer')},
 {id:'bbq',t:'Barbecue safety',lvl:['c','Comfort'],h:steps([['Cook it through','Meat should reach 75°C at the thickest part, with juices running clear. Don’t rush burgers and sausages.'],['Separate kit','Different tongs, boards and plates for raw and cooked food.'],['Wash hands','Every time you touch raw meat.'],['Cool down safely','Let ashes go cold before you bin them, and keep children well away.']])},
 {id:'drink',t:'Drinks and staying hydrated',lvl:['b','Basics'],h:'<p class="pp">The NHS advises 6 to 8 glasses of fluid a day, and more in hot weather. On a hot airfield with little shade, I would suggest a refillable bottle each and drinking before you feel thirsty. Bottled water is cheap: 6 two litre bottles cost £2.25 at Tesco when I checked.</p>'},
 {id:'gas',t:'Gas bottle safety',lvl:['c','Comfort'],h:'<p class="pp">Calor advises keeping gas bottles upright, outside, in a well ventilated place away from heat and doorways. Turn the valve off when you are not cooking, and never store gas inside the tent.</p>'+seeAlso('hygiene','My washing up kit list is in')},
 {id:'src',t:'Sources',lvl:null,h:'<p class="src">Food prices from <a target="_blank" rel="noopener" href="https://www.trolley.co.uk">Trolley.co.uk</a> (Tesco online, 18 October 2026). <a target="_blank" rel="noopener" href="https://nidirect.gov.uk/news/carbon-monoxide-dangers-if-camping-caravanning-or-boating">nidirect on carbon monoxide when camping</a>. <a target="_blank" rel="noopener" href="https://www.gov.uk/government/news/it-looks-done-common-bbq-blunders-and-how-to-avoid-them">Food Standards Agency barbecue advice</a>. <a target="_blank" rel="noopener" href="https://www.gov.uk/government/publications/how-to-chill-freeze-and-defrost-food-safely/how-to-chill-freeze-and-defrost-food-safely">How to chill food safely</a>. <a target="_blank" rel="noopener" href="https://www.nhs.uk/live-well/eat-well/food-guidelines-and-food-labels/water-drinks-nutrition/">NHS water and drinks</a>. <a target="_blank" rel="noopener" href="https://www.calor.co.uk/gas-bottles/advice/storing">Calor gas bottle storage</a>. <a target="_blank" rel="noopener" href="https://www.airtattoo.com/camping/camping/official-riat-camping/">Official RIAT Camping</a>.</p>'}
]};

function kitCost(level,a,c){if(level==='own')return {t:0,rows:[]};var p=a+c,tier=level==='used'?1:{b:1,m:2,p:3}[level],mult=level==='used'?0.5:1,rows=[];
 function add(name,key,qty){var it=KIT[key];if(!it||qty<1)return;var v=it[tier][1]*qty*mult;rows.push([name+(qty>1?' x'+qty:''),v])}
 if(p<=2)add('Tent','tent2',1);else if(p<=4)add('Tent','tent4',1);else if(p<=6)add('Tent','tent6',1);else if(p<=8)add('Tents','tent4',2);else add('Tents','tent6',2);
 add('Sleeping bags','bag',p);add('Beds','mat',p);add('Chairs','chair',p);add('Table','table',1);
 if(p>2)add('Gazebo or shelter','shelter',p>6?2:1);if(p>2)add('Windbreaks','windbreak',Math.ceil(p/4));
 add('Stove','stove',p>4?2:1);add('Gas','gas',1);add('Kettle','kettle',1);add('Pots, plates and cutlery','cookset',Math.ceil(p/2));
 add('Cool box','coolbox',p>4?2:1);add('Water carrier','water',1);add('Washing up bowl','bowl',1);
 add('Head torches','torch',p);add('Lantern','lantern',1);add('Mallet and pegs','mallet',1);add('First aid kit','firstaid',1);
 var t=0;rows.forEach(function(r){t+=r[1]});return {t:t,rows:rows}}

 '<label>Your kit<select id="ck"><option value="own">I already have it, or can borrow it</option><option value="used">Second hand, about half the budget price</option><option value="b" selected>Budget, bought new</option><option value="m">Mid range, bought new</option><option value="p">Premium, bought new</option></select></label>'+
 '<label>Trips you will use the kit for<select id="ct"><option value="1">Just this one</option><option value="2">2 trips</option><option value="3">3 trips</option><option value="5" selected>5 trips</option><option value="10">10 trips</option></select></label>'+

 '<label>Hotel room per night £<input id="ch" type="number" min="0" step="1" value="100"></label>'+
 '<label>People per hotel room<select id="cr"><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label>'+
 '<label>Eating out, per person per day £<input id="ce" type="number" min="0" step="1" value="25"></label>'+

function renderCalc(){var A=$('ca');if(!A)return;var a=+A.value,c=+$('cc').value,n=+$('cn').value,lvl=$('ck').value,trips=+$('ct').value,pitch=Math.max(0,+$('cp').value||0),hotel=Math.max(0,+$('ch').value||0),per=+$('cr').value,eat=Math.max(0,+$('ce').value||0),p=a+c;
 var kit=kitCost(lvl,a,c),kitShare=kit.t/trips,pitchT=pitch*n,food=mealTotal(p,n),camp=kitShare+pitchT+food;
 var rooms=Math.ceil(p/per),roomT=rooms*hotel*n,eatT=eat*p*(n+1),hotelT=roomT+eatT,diff=hotelT-camp,maxv=Math.max(camp,hotelT,1);
 function bar(lbl,parts,tot){var h='<div class="cbar"><b>'+lbl+'<span>'+money(tot)+'</span></b><div class="track">';parts.forEach(function(x){if(x[1]>0)h+='<i class="'+x[2]+'" style="width:'+(x[1]/maxv*100)+'%"></i>'});return h+'</div><div class="keys">'+parts.map(function(x){return '<span><i class="'+x[2]+'"></i>'+x[0]+' '+money(x[1])+'</span>'}).join('')+'</div></div>'}
 var verdict=diff>=0?'Camping saves you about <b>'+money(diff)+'</b> on this trip'+(lvl!=='own'&&trips>1?', with the kit cost shared over '+trips+' trips.':'.'):'On these numbers a hotel is about <b>'+money(-diff)+'</b> cheaper for this trip. Try borrowing kit, buying second hand, or sharing the cost over more trips.';

 h+='<div class="calc-out"><div><b>Money you need for the first trip</b><span class="big">'+money(kit.t+pitchT+food)+'</span><small>kit '+money(kit.t)+', pitch '+money(pitchT)+', food '+money(food)+'</small></div><div><b>Each trip after that</b><span class="big">'+money(pitchT+food)+'</span><small>once the kit is paid for</small></div><div><b>Hotel rooms needed</b><span class="big">'+rooms+'</span><small>'+n+(n>1?' nights':' night')+' at '+money(hotel)+' a room</small></div></div>';

P.save=function(){return [
 {id:'calc',t:'Is camping worth it for you?',lvl:['b','Basics'],h:'<p class="pp">Let’s face it, airshows can be expensive once you add tickets, travel and kit. If you have never camped before, it is fair to ask whether buying a tent is worth it, or whether a hotel makes more sense.</p><p class="pp">This calculator uses the real kit prices from my kit guide and the meal costs from my food guide. The trick is the kit: you pay for it once, then every trip after that only costs the pitch and the food.</p>'+calcUI()},
 {id:'used',t:'My best bargain',lvl:['b','Basics'],h:'<p class="pp">A few years ago I set myself a challenge: keep costs down by buying second hand. eBay, Vinted, Gumtree and Facebook Marketplace have been game changers. Camping kit is often used a handful of times and then sold.</p><div class="tip"><b>The £20 fridge.</b> In 2024 I was browsing a little shop called The Tool Shed at Battlesbridge antiques centre, and found a three way gas fridge, exactly the kind I had planned to buy new for around £300. It cost me £20, and it still works perfectly.</div><p class="pp">Check every pole and peg is there, look for mould on the fabric, and put a second hand tent up in the garden before the trip.</p>'+photo('save')},
 {id:'spend',t:'Where to spend and where to save',lvl:['b','Basics'],h:'<div class="cols"><div class="col"><b>Spend a bit more</b><p>Your tent, your bed and your sleeping bag. A leaking tent or a cold night ruins a weekend. A good airbed is still only £19.99, and a 3 to 4 season sleeping bag £29.74 at Decathlon when I checked.</p></div><div class="col"><b>Save here</b><p>Chairs, tables, lanterns and cookware. A folding chair with armrests is £12.99 and a full cook set for two is £19.99. They don’t need to be fancy.</p></div><div class="col"><b>Buy later</b><p>Event shelters, power stations and gas fridges. Wait until you know you love it, then add them one at a time.</p></div></div>'+seeAlso('kit','Every price, from budget to premium, is in')},
 {id:'pitch',t:'Pay less for your pitch',lvl:['b','Basics'],h:check([['Book early','Early bird prices, like Headcorn’s, are the cheapest.'],['Compare packages','Some include show entry, which can work out cheaper.'],['Join a club','Camping and Caravanning Club sites start from £10 a night.'],['Share with friends','Check the pitch rules on people and cars first.'],['Stay a little further out','A short drive can save a lot.']])+'<div class="tip"><b>Club membership.</b> The Camping and Caravanning Club costs £56.95 a year online and the Caravan and Motorhome Club £69 by Direct Debit. It pays for itself if you camp more than a few nights a year.</div>'},

 {id:'fuel',t:'Travel costs',lvl:['c','Comfort'],h:'<p class="pp">Share the car, and once you are pitched, leave it there. Seaside shows often charge £10 or more to park for the day, so a campsite you can walk or bus from saves money every day.</p>'},
 {id:'src',t:'Sources',lvl:null,h:'<p class="src">Kit prices from <a target="_blank" rel="noopener" href="https://www.decathlon.co.uk/shop-in-shop/summer-camping">Decathlon UK</a>, 18 October 2026. Food prices from <a target="_blank" rel="noopener" href="https://www.trolley.co.uk">Trolley.co.uk</a>. <a target="_blank" rel="noopener" href="https://www.campingandcaravanningclub.co.uk/membership/">Camping and Caravanning Club membership</a>. <a target="_blank" rel="noopener" href="https://www.caravanclub.co.uk/Membership/">Caravan and Motorhome Club membership</a>.</p>'}

function guideView(k){
 var t=T[idx(k)],secs=P[k](),br=brandBlock(k);
 if(br){var si=-1;secs.forEach(function(x,i){if(x.id==='src')si=i});if(si>-1)secs.splice(si,0,br);else secs.push(br)}
 var h='<div class="hero" style="background-image:url(https://jskedge1.github.io/airshow-pages/camping-hub-img/'+(IMG[k]||'hero-flyby')+'.jpg);background-position:'+(POS[k]||'50% 70%')+'"></div>'+
 band('<div class="crumb"><button data-go="hub">Back to the camping hub</button></div><h1 style="margin-top:14px">'+t.n+'</h1><div class="red-sub">'+t.s+'</div><p class="lead">'+t.b+'</p><div class="byline"><span class="av" aria-hidden="true">JS</span><span>Written by Jack Skedge<br><small>Camping at airshows since 2014</small></span></div>','<div class="glass"><h3>'+t.n+' at a glance</h3>'+rows(t)+'</div>');
 var words=secs.map(function(x){return x.h}).join(' ').replace(/<[^>]+>/g,' ').split(/\s+/).length,mins=Math.max(2,Math.round(words/220));
 h=h.replace('<small>Camping at airshows since 2014</small>','<small>Camping at airshows since 2014</small><span class="rt-time">About '+mins+' minutes to read</span>');
 h+='<div class="chap"><span class="readbar" id="readbar"></span><div class="in"><button class="chap-hub" data-go="hub">All guides</button>'+secs.filter(function(x){return x.id!=='src'}).map(function(x){return '<button data-sec="s-'+x.id+'">'+x.t+'</button>'}).join('')+'</div></div>';
 var flip=0;secs.forEach(function(x){var tool=/class="calc"|id="flist"|id="ptbody"/.test(x.h),src=x.id==='src';
  var cls='ch'+(src?' ch-src':tool?' ch-tool':(flip++%2?' ch-alt':''));
  h+='<section class="'+cls+'" id="s-'+x.id+'"><div class="in ch-grid"><header class="ch-head">'+(x.lvl?'<span class="lv lv-'+x.lvl[0]+'">'+x.lvl[1]+'</span>':'')+'<h2>'+x.t+'</h2></header><div class="ch-body">'+x.h+'</div></div></section>'});
 var i=idx(k),pv=T[(i+T.length-1)%T.length],nx=T[(i+1)%T.length];
 h+='<div class="nextup"><div class="in"><h2 class="nu-t">Keep reading</h2><div class="nu-grid"><button class="tile" data-go="'+pv.k+'">'+ph(pv.k)+'<div class="tx"><span class="sub">Previous guide</span><b>'+pv.n+'</b></div></button><button class="tile" data-go="'+nx.k+'">'+ph(nx.k)+'<div class="tx"><span class="sub">Next guide</span><b>'+nx.n+'</b></div></button><button class="tile hubtile" data-go="hub"><div class="tx"><span class="sub">See all ten</span><b>Back to the camping hub</b></div></button></div><nav class="allg" aria-label="All camping guides"><h3>All camping guides</h3>'+T.map(function(g){return '<button data-go="'+g.k+'"'+(g.k===k?' class="cur" aria-current="page"':'')+'>'+g.n+'</button>'}).join('')+'</nav></div></div>';
 return h}
var spy=null;
function watch(){if(spy)spy.disconnect();if(!('IntersectionObserver' in window))return;var bar=document.querySelector('.chap');if(!bar)return;
 spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var id=e.target.id;[].forEach.call(bar.querySelectorAll('[data-sec]'),function(b){var on=b.getAttribute('data-sec')===id;b.classList.toggle('on',on);if(on&&b.scrollIntoView&&bar.scrollWidth>bar.clientWidth){var r=b.parentNode;r.scrollTo({left:b.offsetLeft-40,behavior:'smooth'})}})}})},{rootMargin:'-30% 0px -60% 0px'});
 [].forEach.call(document.querySelectorAll('section.ch'),function(s){spy.observe(s)})}
function reveal(){if(!('IntersectionObserver' in window))return;[].forEach.call(document.querySelectorAll('.stairs:not(.grow)'),function(s){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;s.classList.add('wait');var o=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){s.classList.remove('wait');s.classList.add('grow');o.disconnect()}})},{rootMargin:'0px 0px -10% 0px'});o.observe(s)});var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px'});[].forEach.call(document.querySelectorAll('.ch-head,.print,.tip,.facts,.cols'),function(el){el.classList.add('reveal');io.observe(el)})}
window.addEventListener('scroll',function(){var b=$('readbar'),y=window.scrollY,h=document.documentElement.scrollHeight-window.innerHeight;if(b)b.style.width=(h>0?Math.min(100,y/h*100):0)+'%';var t=$('totop');if(t)t.classList.toggle('show',y>900)},{passive:true});
function go(k){$('app').innerHTML=(k==='hub'?hubView():guideView(k));renderShows();renderPlanner();renderPrices();renderMeals();renderCalc();watch();reveal();window.scrollTo(0,0)}
document.addEventListener('input',function(e){if(/^c[phe]$/.test(e.target.id))renderCalc()});
document.addEventListener('change',function(e){var id=e.target.id;if(id==='freg')renderShows();if(id==='pa'||id==='pc'||id==='pn')renderPlanner();if(id==='ma'||id==='mn')renderMeals();if(/^c[acnktpre]$/.test(id))renderCalc();
 var k=e.target.getAttribute('data-pk');if(k){var d={};try{d=JSON.parse(store('packdone')||'{}')}catch(x){}d[k]=e.target.checked;store('packdone',JSON.stringify(d))}});
document.addEventListener('click',function(e){var f=e.target.closest('[data-ft]');if(f){[].forEach.call(document.querySelectorAll('.fbtn'),function(x){x.classList.toggle('on',x===f);x.setAttribute('aria-pressed',x===f)});renderShows();return}
 var b=e.target.closest('[data-go]');if(b){go(b.getAttribute('data-go'));return}
 var sw=e.target.closest('.pstep.swap');if(sw){sw.classList.toggle('flip')}
 var pt=e.target.closest('[data-tier]');if(pt){[].forEach.call(document.querySelectorAll('.ptab'),function(x){x.classList.toggle('on',x===pt)});renderPrices();return}
 var pg=e.target.closest('[data-plan]');if(pg){planGo(pg.getAttribute('data-plan'));return}
 var s=e.target.closest('[data-sec]');if(s){var el=document.getElementById(s.getAttribute('data-sec'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return;
  [].forEach.call(document.querySelectorAll('.rail .lk'),function(x){x.classList.toggle('on',x===s)})}});
go('hub');
</script>
