<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UK Airshow Camping Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout concept: full width photo fading into navy, glass box rising over its lower edge, one shared tab bar, a bento tile hub, and guide pages with a sticky contents rail. */
:root{
  --navy:#13293C; --deep:#0E2131; --teal:#32B4AF; --tealink:#0E5F5B; --purple:#6950A1; --red:#D74949;
  --paper:#F4F6F8; --white:#FFFFFF; --ink:#0B1722; --line:#CBD5DD; --mute:#33475A;
  --font:'Barlow','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--font);padding:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--deep);z-index:30}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
.in{max-width:1240px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.hidden{display:none!important}
button{font-family:var(--font)}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}

/* hero */
.hero{position:relative;height:clamp(270px,46vh,470px);background:var(--navy) center 70%/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,41,60,.1) 0%,rgba(19,41,60,.3) 50%,var(--navy) 100%)}
.band{background:var(--navy);position:relative;z-index:2;margin-top:-120px;padding-bottom:36px;color:#fff}
.band-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:end}
.tag{display:inline-block;background:var(--purple);color:#fff;font-weight:600;font-size:16px;padding:5px 12px}
.band h1{font-size:clamp(34px,6.2vw,78px);font-weight:800;text-transform:capitalize;line-height:.95;letter-spacing:.005em;margin-top:16px}
.band h1 em{font-style:normal;color:var(--teal)}
.red-sub{color:var(--red);font-weight:700;font-size:clamp(18px,2.2vw,24px);margin-top:14px}
.band .lead{color:#DCE6EE;max-width:52ch;margin-top:12px}
.crumb button{all:unset;cursor:pointer;color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:4px;display:inline-block;padding:2px 0}
.crumb button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{font:600 17px/1 var(--font);padding:15px 22px;border:2px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;transition:transform .3s,background .3s,color .3s;text-decoration:none;display:inline-block}
.btn:hover{transform:translateY(-2px)}
.btn.line{background:transparent;border-color:#fff}.btn.line:hover{background:#fff;color:var(--navy)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.navy{background:var(--navy);border-color:var(--navy)}
.glass{background:rgba(14,33,49,.92);border-top:4px solid var(--teal);box-shadow:0 16px 44px rgba(0,0,0,.4);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);padding:22px;color:#fff}
.glass h3{color:var(--teal);text-transform:capitalize;font-weight:800;font-size:21px}
.rows{margin-top:12px}.rows div{display:flex;justify-content:space-between;gap:16px;padding:10px 12px;background:rgba(255,255,255,.06);margin-top:4px}
.rows div span:first-child{color:#8FDCD8;font-weight:500}.rows div span:last-child{font-weight:700;text-align:right}
.rows div.hot{background:var(--red)}.rows div.hot span:first-child{color:#fff}
.band .glass{margin-bottom:-4px}

/* shared tab bar */
.nav{background:var(--deep);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.nav .in{display:flex;overflow-x:auto;scrollbar-width:none}
.nav .in::-webkit-scrollbar{display:none}
.nav button{flex:none;font:600 16px/1 var(--font);color:#fff;background:transparent;border:0;padding:19px 15px;cursor:pointer;white-space:nowrap;transition:padding .4s ease,background .4s ease}
.nav button:hover,.nav button:focus-visible{padding-left:26px;padding-right:26px;background:var(--teal)}
.nav button[aria-current="page"]{background:var(--teal)}

/* section headings */
.stitle{font-size:clamp(26px,3.2vw,40px);font-weight:800;text-transform:capitalize;color:var(--red);line-height:1;margin:0 0 8px}
.sintro{color:var(--mute);max-width:64ch}
.block{padding-top:54px}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:22px}
.tile{position:relative;display:block;text-align:left;background:#fff;border:1px solid var(--line);overflow:hidden;cursor:pointer;padding:0;color:inherit;font:inherit;min-height:250px;transition:transform .35s ease,box-shadow .35s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);box-shadow:0 12px 28px rgba(19,41,60,.2)}
.tile::before{content:"";position:absolute;left:0;top:0;height:4px;width:0;background:var(--teal);transition:width .45s;z-index:3}
.tile:hover::before,.tile:focus-visible::before{width:100%}
.tile .ph{position:absolute;left:0;right:0;top:0;height:66%;background-size:cover;background-position:center;transition:transform .8s ease,filter .5s;-webkit-mask-image:linear-gradient(#000 52%,transparent);mask-image:linear-gradient(#000 52%,transparent)}
.tile:hover .ph{transform:scale(1.05);filter:brightness(1.08)}
.tile .tx{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 16px}
.tile b{display:block;color:var(--navy);text-transform:capitalize;font-weight:800;font-size:21px;line-height:1.05}
.tile .sub{display:block;color:var(--mute);margin-top:3px;font-size:16px}
.tile .go{display:inline-block;margin-top:6px;color:var(--red);font-weight:700}
.tile .go::after{content:" \2192";transition:margin .3s}
.tile:hover .go::after{margin-left:6px}
.s7{grid-column:span 7;grid-row:span 2;min-height:520px}.s5{grid-column:span 5}.s4{grid-column:span 4}.s12{grid-column:span 12}
.s7 b{font-size:clamp(28px,3.4vw,44px)}.s7 .tx{padding:20px 24px 24px}
.tile.wide{min-height:230px;background:var(--purple);border-color:var(--purple)}
.tile.wide .ph{left:42%;top:0;right:0;bottom:0;height:auto;-webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%)}
.tile.wide .tx{right:40%;top:0;display:flex;flex-direction:column;justify-content:center}
.tile.wide b,.tile.wide .sub{color:#fff}.tile.wide .go{color:#fff}
.ph.none{display:grid;place-items:center;background:linear-gradient(180deg,var(--c1),var(--c2))}
.ph.none svg{width:42%;max-width:130px;opacity:.9}

/* levels staircase */
.stairs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;align-items:end;margin-top:26px}
.stair{padding:22px;color:#fff;position:relative;transition:min-height .55s cubic-bezier(.22,1,.36,1),clip-path 1s cubic-bezier(.22,1,.36,1),box-shadow .45s ease}
.stairs.wait .stair{clip-path:inset(100% 0 0 0)}
.stairs.grow .stair{clip-path:inset(0 0 0 0)}
.stairs.grow .stair.b{transition-delay:0s,.18s,0s}
.stairs.grow .stair.c{transition-delay:0s,.36s,0s}
.stair.a:hover,.stair.a:active{min-height:215px}
.stair.b:hover,.stair.b:active{min-height:285px}
.stair.c:hover,.stair.c:active{min-height:355px}
.stair:hover,.stair:active{box-shadow:0 -10px 24px -14px rgba(19,41,60,.45);z-index:2}
.stair .tg{transition:background .3s ease}
.stair:hover .tg{background:rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){.stair{transition:none}.stairs.wait .stair{clip-path:none}}
.stair b{display:block;font-size:26px;font-weight:800;text-transform:capitalize;line-height:1}
.stair p{margin-top:8px;color:#EAF1F6}
.stair.a{background:var(--teal);min-height:170px}.stair.b{background:var(--purple);min-height:240px}.stair.c{background:var(--navy);min-height:310px}
.stair.c b{color:var(--teal)}
.stair .tg{display:inline-block;background:rgba(0,0,0,.25);padding:3px 9px;font-weight:600;font-size:15px;margin-bottom:10px}

/* shops */
.shopband{background:var(--navy);color:#fff;padding:34px 0;margin-top:60px}
.shopband h2{color:var(--red);font-size:clamp(26px,3vw,38px);font-weight:800;text-transform:capitalize;line-height:1}
.shopband p{color:#DCE6EE;max-width:68ch;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-block;font:600 16px/1 var(--font);padding:12px 16px;background:var(--navy);color:#fff;text-decoration:none;border-top:3px solid var(--teal);transition:background .3s,padding .3s;border-left:1px solid rgba(255,255,255,.18);border-right:1px solid rgba(255,255,255,.18);border-bottom:1px solid rgba(255,255,255,.18)}
.chip:hover,.chip:focus-visible{background:var(--teal);padding-left:22px;padding-right:22px}
.chip.shop{background:transparent;border-top-color:var(--purple)}
.chip.dk{background:var(--navy);border-color:var(--navy);border-top-color:var(--teal)}
.chip.lt{background:#fff;color:var(--navy);border:1px solid #B9C4CD;border-top:3px solid var(--purple)}
.chip.lt:hover{background:var(--purple);color:#fff}
.foot{padding:30px 0 60px;color:var(--mute);font-size:16px}

/* guide page */
.tp{display:grid;grid-template-columns:230px minmax(0,1fr);gap:30px;align-items:start;padding-top:38px;padding-bottom:30px}
.tp>div{min-width:0}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:6px}
.rail .back{margin-bottom:10px;text-align:left}
.rail button.lk{text-align:left;font:600 16px/1.25 var(--font);background:#fff;border:1px solid var(--line);border-left:5px solid transparent;padding:12px 14px;cursor:pointer;color:var(--navy);transition:padding .3s,border-color .3s,background .3s}
.rail button.lk:hover{padding-left:22px;border-left-color:var(--teal)}
.rail button.lk.on{background:var(--navy);color:#fff;border-left-color:var(--teal)}
.sec{background:#fff;border:1px solid var(--line);padding:28px;margin-bottom:20px;scroll-margin-top:84px}
.sec h3.st{font-size:clamp(24px,2.8vw,34px);font-weight:800;text-transform:capitalize;color:var(--red);line-height:1.02}
.sec p.pp{margin-top:10px;max-width:68ch}
.sec .lvl{display:inline-block;color:#fff;font-weight:600;font-size:15px;padding:4px 10px;margin-bottom:12px}
.lvl.b{background:var(--teal)}.lvl.c{background:var(--purple)}.lvl.l{background:var(--navy)}
@media(min-width:900px){.sec.off{margin-left:34px}}
.tip{background:var(--paper);border-left:5px solid var(--purple);padding:14px 18px;margin-top:16px;max-width:70ch}
.tip b{color:var(--navy)}
.steps{position:relative;margin-top:18px;display:grid;gap:14px}
.steps::before{content:"";position:absolute;left:23px;top:20px;bottom:20px;width:3px;background:#D8E0E6}
.step{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:16px}
.step .n{width:48px;height:48px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;position:relative;z-index:1}
.step b{display:block;color:var(--navy);text-transform:capitalize;font-weight:800;font-size:19px;line-height:1.1;margin-top:2px}
.step span{display:block;margin-top:3px;max-width:62ch}
.fig{background:var(--navy);color:#fff;margin:18px 0 0;padding:16px}
.fig svg{display:block;width:100%;height:auto;max-width:720px;margin:0 auto}
.fig.flatlay svg{max-width:980px}
.fig figcaption{margin-top:10px;color:#DCE6EE}
.photo{margin:18px 0 0;overflow:hidden;position:relative;aspect-ratio:16/8;background:var(--navy) center/cover;pointer-events:none}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(19,41,60,.55))}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px}
.facts div{background:var(--navy);color:#fff;padding:14px 16px;border-top:4px solid var(--teal)}
.facts div:nth-child(3n){border-top-color:var(--purple)}
.facts b{display:block;color:var(--teal);font-weight:600}
.show{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr) minmax(0,.7fr);gap:16px;align-items:start;padding:16px 18px;background:var(--paper);margin-top:8px;border-left:5px solid var(--teal)}
.show p{margin:0;font-size:16px}.show .when{display:block;margin-top:6px;font-weight:600;color:var(--navy);font-size:16px}
.show.dim{border-left-color:#7d8d9b}.badge.dim{background:#5b6b79}
.show .badge{margin-top:8px}.slinks{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.slinks .chip{font-size:15px;padding:10px 12px}
.chip.pu{background:var(--purple);border:1px solid var(--purple);border-top:3px solid var(--teal);color:#fff}.chip.pu:hover{background:var(--teal)}
.ffilter{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}.fbtn{font:600 16px/1 var(--font);padding:11px 14px;background:#fff;border:1px solid var(--line);color:var(--navy);cursor:pointer;transition:background .3s,padding .3s}.fbtn:hover{padding-left:20px;padding-right:20px}.fbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.fsel{display:inline-flex;align-items:center;gap:10px;margin-top:10px;font-weight:600;color:var(--navy)}.fsel select{font:500 16px var(--font);padding:9px 10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.fcount{margin-top:10px;font-size:16px;color:var(--mute)}
.show.warn{border-left-color:var(--red)}.show.alt{border-left-color:var(--purple)}
.show b{display:block;color:var(--navy);font-size:19px;line-height:1.15}
@media(max-width:900px){.show{grid-template-columns:1fr}.slinks{flex-direction:row;flex-wrap:wrap}}
.show small{display:block;color:var(--mute);font-size:16px}
.badge{display:inline-block;color:#fff;font-weight:600;font-size:15px;padding:3px 9px;background:var(--teal)}
.badge.alt{background:var(--purple)}.badge.warn{background:var(--red)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
.col{background:var(--paper);padding:16px 18px;border-top:4px solid var(--purple)}
.col b{display:block;color:var(--navy);text-transform:capitalize;font-weight:800;font-size:18px}
.col p{margin-top:6px}
.brandsec h4{margin:16px 0 6px;font-size:18px;font-weight:700;color:var(--navy)}
.src{font-size:16px;color:var(--mute)}.src a{color:var(--tealink);font-weight:600}
.check{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.check li{position:relative;background:var(--paper);padding:12px 14px 12px 44px;min-width:0}
.check li::before{content:"";position:absolute;left:14px;top:15px;width:18px;height:18px;border:2px solid var(--teal);background:#fff}
.check li::after{content:"";position:absolute;left:19px;top:17px;width:6px;height:11px;border:solid var(--teal);border-width:0 3px 3px 0;transform:rotate(45deg)}
.check b{display:block;color:var(--navy);font-weight:700}
.check span{display:block;font-size:16px;color:var(--mute)}
.inlink{all:unset;cursor:pointer;color:var(--tealink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.inlink:focus-visible{outline:3px solid var(--purple)}
.seealso{background:var(--paper);padding:12px 16px;border-left:5px solid var(--teal)}
.warnbox{background:var(--red);color:#fff;padding:16px 18px;margin-top:16px;max-width:70ch}
.warnbox b{display:block;font-size:19px;text-transform:capitalize;font-weight:800}
.table-wrap{overflow-x:auto;margin-top:16px}
table.rt{border-collapse:collapse;width:100%;min-width:620px;font-size:16px}
.rt th{background:var(--navy);color:#fff;text-align:left;padding:11px 12px;font-weight:600}
.rt td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.rt tr:nth-child(even) td{background:var(--paper)}
.rt td:first-child{font-weight:700;color:var(--navy)}
.calc{background:var(--navy);color:#fff;padding:18px;margin-top:16px;border-top:4px solid var(--teal)}
.calc-in{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.calc-in label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:16px;color:#8FDCD8}
.calc-in select,.calc-in input{font:600 17px var(--font);padding:10px;border:0;background:#fff;color:var(--ink);width:100%}
.calc-note{margin-top:12px;color:#DCE6EE;max-width:70ch}
#plist{columns:3 250px;column-gap:12px;margin-top:14px}
.pgroup{background:#fff;color:var(--ink);padding:14px;break-inside:avoid;margin-bottom:12px}
.pgroup h4{color:var(--red);text-transform:capitalize;font-weight:800;font-size:18px;margin-bottom:4px}
.check.tick{grid-template-columns:1fr;margin-top:6px;gap:4px}
.check.tick li{padding:0;background:transparent}.check.tick li::before,.check.tick li::after{display:none}
.check.tick label{display:block;position:relative;padding:8px 8px 8px 36px;background:var(--paper);cursor:pointer}
.check.tick input{position:absolute;left:10px;top:11px;width:18px;height:18px;accent-color:#32B4AF}
.check.tick input:checked~b{text-decoration:line-through;color:var(--mute)}
.pn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;padding:6px 0 30px}
.pn button{position:relative;overflow:hidden;text-align:left;cursor:pointer;border:1px solid var(--line);background:#fff;padding:20px 22px;min-height:120px;font:inherit;color:inherit;transition:transform .3s,box-shadow .3s}
.pn button:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(19,41,60,.18)}
.pn button.nx{background:var(--navy);color:#fff;border-color:var(--navy)}
.pn small{display:block;font-weight:600;color:var(--red);font-size:16px}
.pn button.nx small{color:var(--teal)}
.pn b{display:block;text-transform:capitalize;font-weight:800;font-size:24px;line-height:1.05;margin-top:4px}


/* ---------- guide pages: campsite notebook look ---------- */
.byline{display:flex;align-items:center;gap:12px;margin-top:22px;color:#fff;font-weight:600;line-height:1.25}
.byline small{color:#8FDCD8;font-weight:500;font-size:16px}
.av{width:46px;height:46px;border-radius:50%;background:var(--purple);display:grid;place-items:center;font-weight:800;letter-spacing:.02em;border:2px solid #fff}
.chap{background:var(--deep);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.chap .in{display:flex;overflow-x:auto;scrollbar-width:none}.chap .in::-webkit-scrollbar{display:none}
.chap button{flex:none;font:600 15px/1 var(--font);color:#fff;background:transparent;border:0;padding:18px 13px;cursor:pointer;white-space:nowrap;transition:padding .4s ease,background .4s ease}
.chap button:hover,.chap button:focus-visible,.chap button.on{background:var(--teal);padding-left:22px;padding-right:22px}
.chap .chap-hub{background:var(--purple)}
.ch{padding-top:64px;padding-bottom:64px;scroll-margin-top:56px;background:#fff;overflow-x:clip}
.ch-alt{background:#EAF5F4}
.ch-tool{background:var(--navy);color:#fff}
.ch-src{padding-top:28px;padding-bottom:28px;background:#fff;border-top:1px solid var(--line)}
.ch-grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:48px;align-items:start}
.ch-head{position:sticky;top:90px}
.ch-head h2{font-size:clamp(30px,3.4vw,46px);font-weight:800;text-transform:capitalize;line-height:.98;color:var(--navy);letter-spacing:.005em}
.ch-tool .ch-head h2{color:#fff}
.ch-src .ch-head h2{font-size:22px;color:var(--mute)}
.lv{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:16px;margin-bottom:12px;color:var(--navy)}
.lv::before{content:"";width:14px;height:14px;background:var(--teal)}
.lv-c::before{background:var(--purple)}.lv-l::before{background:var(--red)}
.ch-tool .lv{color:#8FDCD8}
.ch-body{min-width:0;font-size:18px;line-height:1.65}
.ch-body .pp{max-width:62ch;margin-top:0;margin-bottom:16px}
.ch-tool .pp{color:#E6EEF4}
.ch-tool .calc{background:var(--deep);margin-top:8px}
.ch-tool .show{color:var(--ink)}.ch-tool .fsel{color:#fff}.ch-tool .fcount{color:#B9C9D6}
.ch-tool .fbtn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}.ch-tool .fbtn.on{background:var(--teal);border-color:var(--teal)}
/* Jack's notes */
.ch-body .tip{position:relative;background:#FFFFFF;border:0;border-left:0;padding:26px 24px 20px;margin:26px 0;max-width:60ch;box-shadow:0 10px 26px rgba(19,41,60,.14);transform:rotate(-.6deg)}
.ch-alt .tip{background:#fff}
.ch-body .tip::before{content:"";position:absolute;top:-10px;left:28px;width:92px;height:22px;background:rgba(105,80,161,.75);transform:rotate(-3deg)}
.ch-body .tip b{display:block;font-family:'Caveat',cursive;font-size:30px;line-height:1;color:var(--purple);margin-bottom:6px;font-weight:700}
.ch-body .tip:nth-of-type(even){transform:rotate(.5deg)}
/* photo prints */
.print{margin:30px 0;background:#fff;padding:12px 12px 8px;box-shadow:0 14px 34px rgba(19,41,60,.2);transform:rotate(.8deg);max-width:640px;pointer-events:none}
.ch-body .print:nth-of-type(even){transform:rotate(-1deg);margin-left:auto}
.pimg{aspect-ratio:3/2;background:var(--navy) center/cover;max-width:100%}
.print figcaption{font-family:'Caveat',cursive;font-size:24px;line-height:1.15;color:var(--navy);padding:8px 4px 2px;font-weight:600}
@media(min-width:1100px){.ch-body .print{margin-left:-60px}.ch-body .print:nth-of-type(even){margin-right:-40px;margin-left:auto}}
/* columns: open text, no boxes */
.ch-body .cols{gap:26px 30px;margin-top:20px}
.ch-body .col{background:transparent;border-top:0;padding:0 0 0 18px;border-left:4px solid var(--purple)}
.ch-body .col:nth-child(3n+2){border-left-color:var(--teal)}.ch-body .col:nth-child(3n){border-left-color:var(--red)}
.ch-body .col b{font-size:19px}
.ch-body .col p{font-size:17px}
/* checklists: ruled notebook lines */
.ch-body .check:not(.tick){grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 28px}
.ch-body .check:not(.tick) li{background:transparent;border-bottom:1px dashed #B9C9D3;padding:12px 6px 12px 40px}
.ch-body .check:not(.tick) li::before{left:4px;top:15px;border-radius:50%;background:transparent}
.ch-body .check:not(.tick) li::after{left:10px;top:18px}
/* steps */
.ch-body .steps::before{background:repeating-linear-gradient(var(--teal) 0 8px,transparent 8px 14px);width:3px}
.ch-body .step .n{background:var(--navy);border:3px solid var(--teal)}
.ch-body .step b{font-size:20px}
/* facts as glass tickets */
.ch-body .facts div{background:rgba(14,33,49,.94);box-shadow:0 8px 20px rgba(19,41,60,.18)}
/* see also and figures */
.ch-body .seealso{background:transparent;border-left:0;padding:14px 0 0;border-top:2px solid var(--teal);max-width:62ch;margin-top:24px;font-weight:500}
.ch-body .fig{margin-top:22px}
.bh{margin:18px 0 6px;font-size:19px;font-weight:700;color:var(--navy)}
.ch-src .src{font-size:15px}
/* keep reading */
.nextup{background:var(--navy);padding:54px 0 70px}
.nu-t{color:#fff;font-size:clamp(28px,3vw,40px);font-weight:800;text-transform:capitalize;margin-bottom:20px}
.nu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.nu-grid .tile{min-height:240px}
.nu-grid .tile .sub{color:var(--red);font-weight:700}
.hubtile{background:var(--purple)!important;border-color:var(--purple)!important}
.hubtile .tx{top:0;display:flex;flex-direction:column;justify-content:flex-end}
.hubtile b,.hubtile .sub{color:#fff!important}

/* ---------- mixed look: white notebook with RIAT 2023 touches ---------- */
.ch{background:#fff;color:var(--ink)}
.ch-alt{background:#E9EEF5}
.ch-tool{background:#fff}
.ch-src{background:#fff;border-top:1px solid var(--line)}
.ch-head{border-left:4px solid var(--red);padding-left:18px}
.ch-head h2,.ch-tool .ch-head h2{color:var(--red);text-transform:capitalize}
.ch-src .ch-head h2{color:var(--mute)}
.ch-tool .lv{color:var(--navy)}
.ch-tool .pp{color:var(--ink)}
.ch-tool .calc{background:var(--navy);border-radius:0;box-shadow:0 18px 40px rgba(19,41,60,.22)}
.ch-tool .fsel{color:var(--navy)}.ch-tool .fcount{color:var(--mute)}
.ch-tool .fbtn{background:#fff;color:var(--navy);border-color:var(--line)}.ch-tool .fbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.ch-tool .pgroup{padding:0 0 10px;background:#fff}
.ch-tool .pgroup h4{background:var(--teal);color:#fff;padding:12px 14px;margin-bottom:6px;font-size:19px;text-transform:capitalize}
.ch-tool .pgroup ul{padding:0 10px}
.ch-body .facts div{background:var(--teal);color:#0B1520;border-top:0;box-shadow:0 8px 20px rgba(19,41,60,.12);transition:transform .3s}
.ch-body .facts div:hover{transform:translateY(-3px)}
.ch-body .facts div:nth-child(3n){background:var(--purple);color:#fff}
.ch-body .facts b{color:#fff;font-weight:800;text-transform:capitalize}
.ch-body .rt th{background:var(--teal);color:#fff}
.ch-body .rt td:first-child{color:var(--navy)}
.ch-body .col b{text-transform:capitalize}
.ch-body .check:not(.tick) b,.ch-body .step b{text-transform:capitalize}
.ch-body .seealso{border-top-color:var(--red)}
.nextup{background:#E9EEF5}
.nu-t{color:var(--red);text-transform:capitalize}
.allg{margin-top:34px;border-left:4px solid var(--red);padding-left:22px;max-width:760px}
.allg h3{color:var(--red);font-size:clamp(24px,2.6vw,32px);font-weight:800;margin-bottom:8px}
.allg button{display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--navy);font:600 18px var(--font);padding:13px 0;cursor:pointer;transition:padding .3s,color .3s}
.allg button:hover,.allg button:focus-visible{padding-left:10px;color:var(--tealink)}
.allg button.cur{color:var(--red)}

/* ---------- outdoor touches: condensed titles, contour map, overlap cards ---------- */
:root{--forest:#1E3A34;--cond:'Barlow Condensed','Barlow',Arial Narrow,sans-serif}
.band h1,.ch-head h2,.stitle,.nu-t,.allg h3,.shopband h2{font-family:var(--cond);letter-spacing:.01em}
.ch-head h2{font-size:clamp(36px,4vw,56px);line-height:.95}
.stitle{font-size:clamp(32px,4vw,52px)}
.phero{position:relative;min-height:clamp(520px,78vh,760px);background:var(--navy) center 60%/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;color:#fff}
.phero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,41,60,.15) 0%,rgba(19,41,60,.45) 45%,rgba(19,41,60,.92) 100%)}
.phero-in{position:relative;text-align:center;padding-bottom:40px;display:flex;flex-direction:column;align-items:center}
.ptitle{font-family:var(--cond);font-weight:800;font-size:clamp(48px,8.5vw,112px);line-height:.9;margin-top:16px;text-shadow:0 4px 30px rgba(0,0,0,.35);max-width:14ch}
.psub{max-width:56ch;margin-top:16px;font-size:clamp(17px,1.8vw,20px);color:#E6EEF4}
.planbar{position:relative;margin-bottom:0;padding-bottom:34px;z-index:3;width:100%}
.pb-glass{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(2,minmax(0,.8fr)) auto auto;gap:0;background:rgba(14,33,49,.94);border-top:4px solid var(--teal);box-shadow:0 18px 44px rgba(0,0,0,.35);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.pb-glass label{display:flex;flex-direction:column;gap:6px;padding:16px 18px;color:#8FDCD8;font-weight:600;font-size:15px;border-right:1px solid rgba(255,255,255,.1);min-width:0}
.pb-glass select{font:600 17px var(--font);color:#fff;background:transparent;border:0;border-bottom:2px solid var(--teal);padding:6px 0;width:100%}
.pb-glass select option{color:var(--ink)}
.pb-go{font:700 18px var(--font);border:0;background:var(--red);color:#fff;padding:0 26px;cursor:pointer;transition:background .3s}
.pb-go:hover{background:#b93838}.pb-go.alt{background:var(--teal)}.pb-go.alt:hover{background:#26928e}

.topo:first-of-type{padding-top:40px}
.newcamp{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:center;padding:30px 0 60px}
.nc-photo{grid-column:5/13;grid-row:1;aspect-ratio:16/10;background:var(--navy) center/cover;max-width:100%}
.nc-card{grid-column:1/7;grid-row:1;position:relative;background:#fff;padding:40px 36px 30px;box-shadow:0 22px 50px rgba(19,41,60,.18);z-index:2}
.nc-badge{position:absolute;top:-26px;left:-22px;width:58px;height:58px;border-radius:50%;background:var(--purple);border:3px solid #fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.nc-badge svg{width:30px;height:30px}
.nc-card h2{font-family:var(--cond);font-weight:800;font-size:clamp(32px,3.6vw,48px);line-height:.95;color:var(--navy)}
.nc-card p{margin-top:14px;max-width:52ch}
.nc-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn.line.dk{color:var(--navy);border-color:var(--navy)}.btn.line.dk:hover{background:var(--navy);color:#fff}
.nc-sign{font-family:'Caveat',cursive;font-size:30px;color:var(--purple);margin-top:12px}
.howto{position:relative;background:linear-gradient(180deg,#fff 0,#fff 240px,var(--forest) 240px,var(--forest) 100%);padding:40px 0 60px}
.howto-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:40px;align-items:start}
.htcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.htcard{display:block;padding:0;border:0;background:var(--forest);cursor:pointer;text-align:left;box-shadow:0 18px 40px rgba(0,0,0,.3);transition:transform .35s}
.htcard:hover{transform:translateY(-5px)}
.ht-img{aspect-ratio:4/5;background:center/cover}
.ht-cap{padding:18px;background:var(--forest);color:#fff;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

 g('Shelter',[['Tent',tentFor(a,c,n)],['Groundsheet or footprint',''],['Mallet',Math.max(1,Math.ceil(p/4))+(p>4?' mallets, so more than one person can peg':'')],['Spare pegs','at least 10'],shelters(p,n)?['Gazebo or shelter',shelters(p,n)]:null,(p>2||!short)?['Windbreak panels',windbreaks(p)+' panels']:null]);
 g('Sleeping',[['Sleeping bags',p+(p>1?' sleeping bags':' sleeping bag')],[long?'Raised camp beds':'Sleeping mats or airbeds',p+(long?' camp beds, off the cold ground':' in total, plus a pump for airbeds')],['Pillows',p+' pillows'],['Extra blanket','one each, nights get cold'],['Ear plugs','jets start early'],long?['Rug or carpet for the tent','']:null]);
 g('Kitchen',[['Stove',p>4?'two burner stove, or two single burners':'single burner stove, the type most shows allow'],['Gas',(n<=2?'1 to 2':n<=4?'2 to 4':'4 or more')+' cartridges, more if you boil lots of water'],['Lighter and matches','two of each'],['Kettle',''],['Frying pan and saucepan',''],['Plates, bowls, mugs and cutlery',p+' sets'],['Sharp knife and chopping board',''],['Spatula, tongs and a big spoon',''],['Tin opener','easy to forget'],['Cool box and ice packs',p>4||long?'two: one for food, one for drinks':'one'],['Water carrier',p<=2?'one 10 litre carrier':p<=4?'two 10 litre carriers, or one rolling 23 litre':'one rolling 40 litre carrier, or several 10 litre'],['Folding table',p>4?'two':'one'],['Foil, food bags and tubs',''],long?['Kitchen storage unit','keeps food off the ground']:null]);
 g('Washing up',[['Washing up bowl','collapsible packs flat'],['Washing up liquid and sponges',''],['Tea towels',n<=2?'two':'three or four'],['Kitchen roll',''],['Bin bags','one roll at least'],['Hand gel and wipes','']]);
 g('Clothes, per person',[['T shirts or tops',(n+1)+' each'],['Underwear and socks',(n+1)+' each, socks get wet'],['Warm jumper or fleece','one each'],['Waterproof jacket and trousers','one each'],['Wellies or boots','one pair each'],['Trainers or sliders','for dry days'],['Hat for sun and a warm hat',''],['Pyjamas or warm night clothes','']]);
 g('Wash bag and health',[['Toothbrush and toothpaste',''],['Towels',long?'one each plus a spare':'one each, quick dry is best'],['Flip flops for showers',''],['Toilet roll','two rolls at least'],['Sun cream','SPF 30 or more'],['First aid kit','plus any medicines you take'],['Insect repellent','']]);
 g('Light and power',[['Head torch',p+(p>1?' head torches':' head torch')],['Lantern',p>4?'two':'one'],['Spare batteries',''],['Power bank','for phones and e tickets'],long?['Portable power station','or solar lights for the windbreaks']:null]);
 g('Airshow extras',[['Show tickets','printed or on your phone'],['Binoculars',''],['Camping chairs',p+' chairs'],['Small backpack','for the walk in'],['Refillable water bottles','one each'],['Packed lunch box',''],c>0?['Ear defenders',c+(c>1?' pairs for the children':' pair for the child')]:null,['Flag or light pole','so you can find your pitch at night']]);
 g('Tools and spares',[['Duct tape',''],['Cable ties',''],['Spare guy lines',''],['Tent repair patches',''],['Pocket knife or multitool',''],['Pegs for a washing line','and the line']]);
 if(c>0)g('For the children',[['Spotting sheet or colouring',''],['Their own torch',''],['Potty or bucket with a lid','for night time'],['Wristband with your number',''],['Favourite cuddly toy','helps them settle']]);
 return L}
function planner(){return '<div class="calc"><div class="calc-in"><label>Adults<select id="pa">'+opts(1,12,2)+'</select></label><label>Children<select id="pc">'+opts(0,8,0)+'</select></label><label>Nights<select id="pn">'+opts(1,9,2)+'</select></label></div><p class="calc-note" id="pnote"></p><div id="plist"></div></div>'}
function opts(a,b,d){var h='';for(var i=a;i<=b;i++)h+='<option value="'+i+'"'+(i===d?' selected':'')+'>'+i+'</option>';return h}
function renderPlanner(){var A=$('pa');if(!A)return;var a=+A.value,c=+$('pc').value,n=+$('pn').value,p=a+c;
 var note=n<=2?'One or two nights: travel light. You can skip the shelter and most of the kitchen if your campsite has food, and come back to the luxuries another time.':n<=4?'Three or four nights: this is where a gazebo and a proper kitchen start to earn their space in the car.':'Five nights or more, like a full RIAT week: the list grows. Plan a top up shop part way through rather than packing a week of fresh food.';
 $('pnote').textContent=note;var L=packList(a,c,n),h='',done={};try{done=JSON.parse(store('packdone')||'{}')}catch(e){}
 L.forEach(function(g){h+='<div class="pgroup"><h4>'+g[0]+'</h4><ul class="check tick">';g[1].forEach(function(it){var id=(g[0]+it[0]).replace(/\W/g,'');h+='<li><label><input type="checkbox" data-pk="'+id+'"'+(done[id]?' checked':'')+'><b>'+it[0]+'</b>'+(it[1]?'<span>'+it[1]+'</span>':'')+'</label></li>'});h+='</ul></div>'});
 $('plist').innerHTML=h}

/* ---------- guides written in Jack's voice ---------- */
P.pitch=function(){return [
 {id:'spot',t:'Pick the right spot',lvl:['b','Basics'],h:'<p class="pp">Before you unload a single bag, have a walk around your pitch. Five minutes here can save you a miserable week.</p>'+check([['Is it flat?','A tiny slope is fine. Put your head at the top end, or you will spend the night slowly sliding down the bed.'],['Any holes, stones or dips?','Feel the ground with your feet. Dips turn into puddles.'],['Are you under a big tree?','Move. More on that below.'],['Are you at the bottom of a slope?','Rain runs downhill and finds its way under your groundsheet.'],['Too close to the toilets or bins?','Close enough to walk at night is good. Right next to them is not.'],['Where will the car go?','Mark it out now, or the pitch slowly swallows the space.']])+'<div class="tip"><b>Why I always check for trees.</b> In 2023 a storm hit the campsites around RAF Fairford on the Friday. A large tree in the Rainbow Field at Townsend Farm came down and missed a tent by a few metres. Nobody was hurt, but I have never pitched under a big tree since.</div>'+photo('pitch','pitch-spot')},
 {id:'view',t:'Think about the view',lvl:['b','Basics'],h:'<p class="pp">This is the bit that makes airshow camping different. Before the first peg goes in, work out where the aircraft will be. Face your door, or your gazebo, towards the runway or the display line.</p><p class="pp">Honestly, there is nothing better than sitting in the doorway with a coffee while the aircraft arrive overhead. Some people even turn the tent sideways so the seating area gets the view. Both work.</p>'},
 {id:'size',t:'Know your pitch size before you go',lvl:['b','Basics'],h:'<p class="pp">This one catches people out every year. Some campsites give you a set pitch, others let you spread out. You don’t want to turn up with a setup like mine, all windbreaks, shelters and flags, and find you have been given a small allocation with your car squeezed in beside the tent.</p>'+photo('pitch','group-basecamp')+'<p class="pp">If your pitch is fixed, measure your tent, gazebo and car at home and check it all fits, including the guy lines. They take up far more room than you think.</p><p class="pp">I have gathered every campsite pitch size I could find below. Tap a campsite to open it. Most campsites don’t publish a size, so where it says not published, I would advise messaging them with your tent and shelter sizes before you book.</p>'+pitchList()+''+photo('pitch','car-pitches')+'<div class="tip"><b>Big group at RIAT?</b> For me, Fairford Airshow Camping is the perfect place to stay at RIAT if you are going with a large family or group and want to camp together. There are no set pitch sizes, so you can build a proper base camp like ours. I have stayed there for the past decade. Please see the campsite’s rules before you go, as they can change each year.</div><div class="chips"><a class="chip pu" target="_blank" rel="noopener" href="https://www.fairfordairshowcamping.net/">Fairford Airshow Camping</a><a class="chip lt" target="_blank" rel="noopener" href="https://www.thebigguidetoriat.co.uk/fairfordairshowcamping">My guide to Fairford Airshow Camping</a></div>'},
 {id:'steps',t:'Putting the tent up, step by step',lvl:['b','Basics'],h:'<p class="pp">If this is your first time, do a practice run in the garden or a park before the show. You do not want to be reading the instructions for the first time in the rain with a queue of cars behind you.</p>'+photoSteps([['Lay it out flat','Spread the tent where you want it and stand back. Check which way the door faces, where the bedrooms go and where the guy lines will reach. It is much easier to turn it now than once it is up.','step-1'],['Put the poles in or pump it up','Follow your tent’s instructions. With a pole tent, lay the poles out first so you can see which goes where. With an air tent, make sure it is in the right place before you start pumping.','step-2'],['One person in charge','If a few of you are helping, let one person lead. Four people pulling in four directions never ends well.','step-3'],['Peg the corners','Push pegs in at 45 degrees, leaning away from the tent. Peg it properly even if it is calm, because the weather at airshows changes fast.','step-4'],['Use every guy line','I know they are annoying to walk around, but they hold the tent up when the wind picks up. Peg them out in line with the seams.','step-5'],['Check it again','Tighten everything after an hour, and again before bed, because the fabric stretches as it settles.','step-6']])+'<p class="src">The six step photos are AI generated examples, made to show each step clearly.</p><figure class="fig">'+SVGWIND+'<figcaption>Face the narrow end into the wind and keep the doors on the sheltered sides.</figcaption></figure><figure class="fig">'+SVGPEG+'<figcaption>Angle every peg away from the tent for the best grip.</figcaption></figure>'},
 {id:'order',t:'What order to set up camp',lvl:['b','Basics'],h:'<p class="pp">After a long drive it is tempting to unload everything at once. Don’t. Get somewhere dry first, so if the weather turns, you have a place to throw everything.</p>'+photoSteps([['Tent up and pegged','Your tent is the anchor for everything else.','tent-and-kit'],['Gazebo or awning','Your dry space outside.','shelter-day'],['Windbreaks','Mark the edge of your pitch and your parking space.','pitch-windbreaks'],['Beds','Get them sorted before you are tired.','order-beds'],['Kitchen and seating','Cool box in the shade, stove on a stable table.',['kitchen-shelter','event-shelter-night']],['Everything else','The small bits can wait until you have had a brew.','order-brew']])+'<p class="src">Steps 1, 2 and 3 and the night time kitchen in step 5 are my own photos from RIAT. Steps 4 and 6 are AI generated examples.</p>'},
 {id:'base',t:'Build a base camp',lvl:['c','Comfort'],h:'<p class="pp">If you are staying more than a couple of nights, I would split your pitch into areas. It sounds a bit over organised, but otherwise everything ends up in one giant pile in the middle of the tent.</p>'+pitchMap()+'<h4 class="bh" style="margin-top:30px">Fitting it on a 10m by 10m pitch</h4><p class="pp">Shuttleworth gives you 10m by 10m, with your car on the pitch. This is how I would fit a family setup into that space. It is drawn to scale, and every square is 1 metre.</p><figure class="fig plan10">'+SVGPLAN10+'<figcaption>A 4 berth tunnel tent, a 3m by 3m gazebo, a car and a seating area on a 10m by 10m pitch. Measure your own kit, as tents vary a lot.</figcaption></figure>'+check([['Tent at the back left','A 3m by 5m tent with 1m all round for guy lines, door facing the seating area.'],['Gazebo at the back right','3m by 3m, with the kitchen along the back and the cool box in the shade.'],['Car down the right side','Parked beside the gazebo, nose out, so you can leave without moving anything.'],['Seating in front of the tent','Chairs and a table where you can see the flying.'],['Windbreaks on two sides only','Along the front and the left. The back and the car side do not need them, which saves space and money.'],['A walkway down the middle','About 1m between the tent and the gazebo, so you can get round in the dark.']])+'<div class="tip"><b>Pitch smaller than this?</b> On a 10m by 8m pitch, like Official RIAT Camping, I would drop the seating area into the gazebo and park the car across the front instead of down the side. Please see your campsite’s rules before you go, as some ask for the car to stay at the front.</div><div class="cols"><div class="col"><b>Windbreaks</b><p>My favourite cheap upgrade. They block the wind, give you privacy and make a little driveway for the car.</p></div><div class="col"><b>Car space</b><p>Section it off early. I learned the hard way that if you don’t, you get boxed in by neighbours.</p></div><div class="col"><b>Gazebo security</b><p>Never trust the frame’s weight to hold it down. Peg it and guy it, and drop the canopy if strong wind is forecast.</p></div></div>'+'<p class="pp" style="margin-top:26px">Here are a few base camps from my trips, so you can see how other campers set up. Take the bits that would work for you.</p>'+gallery([['base-row','Our group base camp, with the barbecue going'],['base-storm','Cars on the outside, windbreaks between us and the track'],['base-IMG_8731','A tidy blue base camp tucked in by the hedge'],['base-IMG_8730','A smaller pitch, windbreak up and the car beside it'],['base-IMG_8729','Caravans and awnings make their own little streets']])+seeAlso('kit','How much kit to bring for 2, 4, 6 or more people is in')},
 {id:'lux',t:'Making it your own',lvl:['l','Luxury'],h:'<p class="pp">Once the basics are done, add a bit of character. Solar lights along the windbreaks, a flag on a pole with a light at the top, or a festival kite all make your pitch easy to find when you walk back in the dark. They are cheap, and they make the campsite feel like a little village.</p>'+photo('pitch','lit-pitches')+seeAlso('lux','Event shelters, power and lighting are covered in')}
]};

P.where=function(){return [
 {id:'types',t:'Three ways to camp',lvl:['b','Basics'],h:'<p class="pp">Not every airshow lets you camp. Before you book anything, find out which of these three your show is, because it changes everything else in this guide.</p><div class="cols"><div class="col"><b>At the show</b><p>RIAT, Shuttleworth, Headcorn, the Midlands Air Festival and Sywell all run a campsite on or right next to the airfield. You wake up with the aircraft and walk in.</p></div><div class="col"><b>Nearby campsites</b><p>Duxford, Cosford and most seaside shows are day events. You stay at a normal campsite and drive, cycle or catch the park and ride.</p></div><div class="col"><b>Rules and bans</b><p>Many seaside towns stop people sleeping in vans on the seafront, and Clacton bans camping in parts of the town during show week.</p></div></div>'+photo('where')},
 {id:'finder',t:'Show finder',lvl:['b','Basics'],h:'<p class="pp">I checked every show here against its own website or the local council in October 2026. Pick how you want to camp, or your region, and the list narrows down. Then tap through to the official page to book. Dates and rules change every year, so please check again before you travel.</p>'+finder()},
 {id:'riat',t:'Camping at RIAT',lvl:['c','Comfort'],h:'<p class="pp">RIAT is where my camping story started, back in 2014, and it is still the biggest airshow camping event in the UK. As well as the official campsite, farms in the villages around RAF Fairford open fields for show week. I stay at Townsend Farm, also known as Fairford Airshow Camping, from the Monday to the following Monday.</p><p class="pp">I have a whole guide on my RIAT site, so here are just the points that help you compare it with other shows.</p><div class="facts"><div><b>Official pitch</b>10m by 8m, one vehicle on it</div><div><b>Cooking</b>Single burner butane stoves raised off the grass, no charcoal</div><div><b>Dogs</b>Not allowed on the official site</div><div><b>Show entry</b>Not included, buy a ticket as well</div><div><b>Power</b>6 amp hook up for £100 per plot</div><div><b>2027</b>16 to 18 July</div></div>'+photo('where','kempsford-camping')+'<div class="chips"><a class="chip pu" target="_blank" rel="noopener" href="'+RIATG+'">Read my full RIAT camping guide</a><a class="chip lt" target="_blank" rel="noopener" href="https://www.airtattoo.com/camping/camping/faqs">Official RIAT camping FAQs</a></div>'},
 {id:'compare',t:'How I compare campsites',lvl:['c','Comfort'],h:'<div class="cols"><div class="col"><b>How far is the gate?</b><p>A short walk or a shuttle bus matters more than anything else on show day.</p></div><div class="col"><b>What are the toilets like?</b><p>Farm fields usually hire in portable toilets and showers. Official sites often have flushing toilets. Neither is a Premier Inn.</p></div><div class="col"><b>How noisy is it?</b><p>Aircraft arrivals and practice can start early. Pack ear plugs if you like a lie in.</p></div><div class="col"><b>What are the rules?</b><p>Cars per pitch, dogs, generators, barbecues and quiet hours are different at every show.</p></div></div>'},
 {id:'wild',t:'Can I just wild camp near a show?',lvl:['b','Basics'],h:'<p class="pp">Short answer: in most of the UK, no.</p><div class="cols"><div class="col"><b>Scotland</b><p>The Scottish Outdoor Access Code allows lightweight wild camping for two or three nights, away from roads, buildings and fields with crops or animals. A town seafront like Ayr is not the place for it.</p></div><div class="col"><b>England and Wales</b><p>Not without the landowner’s permission, even in National Parks. The one exception is the Dartmoor commons, confirmed by the Supreme Court in May 2025.</p></div><div class="col"><b>Northern Ireland</b><p>Only with the landowner’s permission. There is no general right to camp.</p></div></div>'},
 {id:'src',t:'Sources',lvl:null,h:'<p class="src">Official show websites linked in the finder. <a target="_blank" rel="noopener" href="https://www.airtattoo.com/camping/camping/official-riat-camping/">Official RIAT Camping</a>, <a target="_blank" rel="noopener" href="https://www.airtattoo.com/campsite-registration-form/">RIAT campsite registration form</a>. <a target="_blank" rel="noopener" href="https://www.outdooraccess-scotland.scot/practical-guide-all/camping">Scottish Outdoor Access Code</a>. <a target="_blank" rel="noopener" href="https://osmaps.com/discover/guides/is-wild-camping-legal-in-england-wales/">OS guide to wild camping law</a>. Checked 18 October 2026.</p>'}
]};

P.book=function(){return [
 {id:'look',t:'Where to look',lvl:['b','Basics'],h:'<p class="pp">Always start with the show’s own website. If the show runs a campsite, that is as close as you can get, and the show finder links straight to each one. For day shows, these are the sites I would compare.</p><div class="cols"><div class="col"><b>Pitchup</b><p>A big campsite directory with a map, handy for finding fields close to an airfield.</p></div><div class="col"><b>Campsites.co.uk</b><p>Search by area, with sites near attractions.</p></div><div class="col"><b>UKcampsite.co.uk</b><p>Reviews from real campers. Good for honest views on mud and noise.</p></div><div class="col"><b>Club sites</b><p>The Camping and Caravanning Club and the Caravan and Motorhome Club both run small, quiet members only sites.</p></div></div><div class="chips"><a class="chip lt" target="_blank" rel="noopener" href="https://www.pitchup.com">Pitchup</a><a class="chip lt" target="_blank" rel="noopener" href="https://campsites.co.uk">Campsites.co.uk</a><a class="chip lt" target="_blank" rel="noopener" href="https://www.ukcampsite.co.uk">UKcampsite</a></div>'+photo('book')},
 {id:'links',t:'Every campsite booking link in one place',lvl:['b','Basics'],h:'<p class="pp">To make booking easier, here is every campsite link I have, in one place. Tap through, check the dates and rules, and book direct. When I last checked in October 2026, some were already taking 2027 bookings and others said they would open soon.</p><h4 class="bh">Camping near RAF Fairford for RIAT</h4>'+RIATCAMPS.map(function(c){return '<div class="show"><div><b>'+c[0]+'</b><small>'+c[1]+'</small></div><div><p>'+c[2]+'</p></div><div class="slinks">'+c[3].map(function(l){return '<a class="chip '+(/thebigguidetoriat/.test(l[1])?'lt':'dk')+'" target="_blank" rel="noopener" href="'+l[1]+'">'+l[0]+'</a>'}).join('')+'</div></div>'}).join('')+'<h4 class="bh">Airshows with their own campsite</h4>'+SHOWS.filter(function(x){return x.t==='on'&&x.n.indexOf('RIAT')<0}).map(function(x){return '<div class="show"><div><b>'+x.n+'</b><small>'+x.p+'</small></div><div><p>'+x.d+'</p></div><div class="slinks"><a class="chip dk" target="_blank" rel="noopener" href="'+x.l[0][1]+'">Book or find out more</a></div></div>'}).join('')+'<h4 class="bh">Day shows: campsites nearby</h4><div class="chips">'+SHOWS.filter(function(x){return x.t==='near'&&x.l.length}).map(function(x){var l=x.l[x.l.length-1];return '<a class="chip lt" target="_blank" rel="noopener" href="'+l[1]+'">'+x.n+'</a>'}).join('')+'</div><p class="src">Please see each campsite’s rules before you go. I am not paid by any of these campsites.</p>'},
 {id:'timing',t:'When to book',lvl:['b','Basics'],h:'<p class="pp">As soon as the show announces its dates. From what I have seen over the years, on site camping always sells out first. Headcorn only sells camping in advance, never on the gate, and RIAT camping for 2027 goes on sale later in the year.</p><div class="tip"><b>My tip.</b> Sign up to the show’s newsletter and follow its social media, so you hear the moment camping opens. And have a second campsite in mind, so if your first choice is full you can book the backup the same evening.</div>'},
 {id:'check',t:'Questions to ask before you pay',lvl:['b','Basics'],h:check([['Is show entry included?','Headcorn and Weston Park include it. RIAT camping does not, so you need a ticket as well.'],['What time can I arrive and leave?','Shuttleworth takes arrivals 10:00 to 20:00. RIAT has no arrivals or departures on the Saturday.'],['How big is the pitch?','And does the car go on it?'],['Can I bring the dog?','The Midlands Air Festival and the official RIAT campsite say no.'],['Can I use a barbecue or generator?','Every show is different. The food and drink guide lists the main ones.'],['Is there electric hook up?','Most airshow campsites have none.'],['Showers, flushing toilets, water?','Ask, rather than assume.']])},
 {id:'cost',t:'What it costs',lvl:['b','Basics'],h:'<div class="facts"><div><b>Club certificated sites</b>From £10 per night</div><div><b>Shuttleworth</b>£25 per pitch per night</div><div><b>Headcorn 2027</b>£149 for 2 people, show entry included</div><div><b>Weston Park 2027</b>£150 for 2 people, show entry included</div><div><b>RIAT power</b>£100 per plot for a 6 amp hook up</div></div><p class="pp">When comparing, add up the whole stay including show tickets. A package with entry can work out cheaper than a cheap field plus tickets.</p>'+seeAlso('save','Work out the full cost of your trip with the calculator in')},
 {id:'src',t:'Sources',lvl:null,h:'<p class="src"><a target="_blank" rel="noopener" href="https://headcornairshow.com/camping">Headcorn camping</a>, <a target="_blank" rel="noopener" href="https://airshowinternational.co.uk/index.php/camping">Weston Park camping</a>, <a target="_blank" rel="noopener" href="https://www.shuttleworth.org/camping">Shuttleworth camping</a>, <a target="_blank" rel="noopener" href="https://www.airtattoo.com/campsite-registration-form/">RIAT campsite registration</a>, <a target="_blank" rel="noopener" href="https://www.campingandcaravanningclub.co.uk/campsites/member-only/certificated-sites/">Camping and Caravanning Club certificated sites</a>. Checked 18 October 2026.</p>'}
]};

P.kids=function(){return [
 {id:'lost',t:'Make a lost child plan',lvl:['b','Basics'],h:'<p class="pp">Airshows draw huge crowds, and on a busy crowd line a child can vanish in seconds while everyone is looking up. Sort this out at the tent, before you walk to the show.</p>'+steps([['Pick a meeting point','Something big and easy to find, like the main entrance or a named hangar. Walk past it together when you arrive.'],['Show them who to ask','Point out stewards, police and the information point.'],['Put your number on them','A wristband with your mobile number, or written on their arm in pen.'],['Dress them brightly','A bright hat or top is much easier to spot in a crowd.'],['Take a photo that morning','If you do need help, you can show exactly what they are wearing.']])+'<div class="tip"><b>Ask at the gate.</b> At the 2022 Blackpool Air Show, police and the coastguard handed out wristbands for children. Ask whether your show does something similar.</div>'},
 {id:'noise',t:'Noise, sun and heat',lvl:['b','Basics'],h:'<p class="pp">Fast jets are loud, really loud. I would advise ear defenders for young children, and a quiet spot back at the tent for when it all gets a bit much.</p><p class="pp">Airfields have very little shade. The NHS advises sun cream of at least SPF 30 with 4 stars, put on 30 minutes before going out and again every 2 hours. Keep babies under 6 months out of direct strong sun, and stay in the shade between 11am and 3pm when you can.</p>'+photo('kids')},
 {id:'sleep',t:'Sleep and night time',lvl:['c','Comfort'],h:'<div class="cols"><div class="col"><b>Keep them warm</b><p>A warm afternoon can turn into a cold night. A sleeping bag that fits, a hat and a blanket underneath make a big difference.</p></div><div class="col"><b>Night time toilet trips</b><p>A potty or bucket with a lid saves a walk across a dark field. Keep a head torch by the door.</p></div><div class="col"><b>Guy lines</b><p>Children run between tents. Glow guy lines or bright covers stop trips, especially after dark.</p></div><div class="col"><b>Early mornings</b><p>Pack quiet things for dawn: books, colouring and a spotter’s guide, before the flying starts.</p></div></div>'},
 {id:'fun',t:'Keeping them busy',lvl:['c','Comfort'],h:check([['Aircraft spotting sheet','Tick them off as they fly over.'],['Their own camera','Even a cheap one makes them feel part of it.'],['A ball or frisbee','For the space at the back of the field.'],['The static display','Children can often sit in cockpits.'],['Meet the pilots','Many are happy to sign a programme.']])+'<div class="tip"><b>Check first.</b> Many shows ban drones and some ban kites near the airfield. Read the rules before you pack them.</div>'+photo('kids','pitching-tent')},
 {id:'safe',t:'Safety around the pitch',lvl:['b','Basics'],h:'<p class="pp">Keep stoves and barbecues well away from where the children play, and use windbreaks to give them a safe little area inside your pitch.</p>'+seeAlso('food','Carbon monoxide and cooking safety are covered in')},
 {id:'src',t:'Sources',lvl:null,h:'<p class="src"><a target="_blank" rel="noopener" href="https://www.nhs.uk/live-well/seasonal-health/sunscreen-and-sun-safety/">NHS sunscreen and sun safety</a>. <a target="_blank" rel="noopener" href="https://www.lep.co.uk/news/green-wristband-scheme-to-help-missing-children-locate-parents-at-crowded-blackpool-air-show-3805185">Blackpool Air Show wristband scheme</a>.</p>'}
]};

P.hygiene=function(){return [
 {id:'expect',t:'What to expect',lvl:['b','Basics'],h:'<p class="pp">Let’s be honest, it is not your local Premier Inn. Most airshow campsites are working farms for the rest of the year, so they hire in portable toilets and shower units. Official sites like RIAT and the Midlands Air Festival have flushing toilets and showers. In my experience they are cleaned regularly, but queues build at busy times.</p>'+photo('hygiene')},
 {id:'toilets',t:'Toilet tips',lvl:['b','Basics'],h:'<div class="tip"><b>My advice.</b> Go before the flying display starts. If you are not waiting for a particular display, use it as your toilet break, because the queues disappear while everyone is watching.</div>'+check([['Your own toilet roll','They do run out.'],['Hand gel','In every bag.'],['Head torch','For the night time walk.'],['A bucket or potty with a lid','For little ones at night.']])},
 {id:'showers',t:'Showers',lvl:['b','Basics'],h:'<p class="pp">Showers are limited at a lot of airshow campsites. Shuttleworth only has them at Festival of Flight and Flying Proms. The quietest times are early morning before the gates open, or during the flying.</p>'+check([['Flip flops','Shower floors on a field get muddy.'],['Quick dry towel',''],['Wash bag with a hook','There is rarely a shelf.'],['Coins or a card','Some showers are paid.']])+photo('hygiene','shower-block')},
 {id:'wash',t:'Washing up kit',lvl:['b','Basics'],h:'<p class="pp">The boring bit, but it makes a big difference. Wash up soon after eating, so food does not attract wasps and you are ready for breakfast.</p>'+check([['Washing up bowl','Collapsible ones pack flat.'],['Washing up liquid',''],['Sponges and a scourer',''],['Two tea towels','One will be wet by day two.'],['Kitchen roll',''],['A kettle for hot water','Cold water and grease do not mix.'],['Bin bags','One for rubbish, one for recycling.'],['Hand soap and gel','Wash hands before cooking and after touching raw meat.']])+'<div class="tip"><b>A sink unit is worth it for a few days.</b> If you are camping for three nights or more, I would suggest a folding camping sink unit. These are great: a bowl at a good height, a shelf for drying, and space underneath for your washing up liquid, sponges and tea towels. It keeps all your equipment organised and off the grass, and saves your back too. For one or two nights, a collapsible bowl on the table is fine.</div>'+photo('hygiene','sink-unit')+photo('hygiene','wash-trough')},
 {id:'chem',t:'Chemical toilets and Elsan points',lvl:['c','Comfort'],h:'<p class="pp">If you bring a portable toilet, empty it only at the Elsan or chemical disposal point. Shuttleworth, Headcorn and the Midlands Air Festival all have one. Never use the normal toilets or a drain.</p>'},
 {id:'litter',t:'Leave it as you found it',lvl:['b','Basics'],h:'<p class="pp">The Countryside Code says take your litter home, and leaving rubbish behind is a criminal offence. Keep a rubbish bag by the kitchen so wrappers do not wander round the pitch.</p>'},
 {id:'src',t:'Sources',lvl:null,h:'<p class="src"><a target="_blank" rel="noopener" href="https://www.gov.uk/government/publications/the-countryside-code/the-countryside-code-advice-for-countryside-visitors">The Countryside Code</a>. Official show camping pages linked in the show finder.</p>'}
]};

P.weather=function(){return [
 {id:'big',t:'The big picture',lvl:['b','Basics'],h:'<p class="pp">Over the years we have been fairly lucky, but British summer weather can change in an afternoon. The Met Office describes a clear pattern: the east and south are drier, warmer and less windy than the west and north. That is why the same weekend can feel very different at Ayr and at Eastbourne.</p>'+climTable()+'<p class="src">Met Office regional climate summaries, 1981 to 2010 averages.</p>'+photo('weather')},
 {id:'regions',t:'From Scotland to the Cotswolds',lvl:['b','Basics'],h:'<div class="cols"><div class="col"><b>Scotland</b><p>Cooler nights and more wind, especially on the west coast. A strong tent and full waterproofs are a must at Ayr in September.</p></div><div class="col"><b>Wales and the North West</b><p>Swansea, Blackpool and Southport face the Atlantic weather, so plan for showers blowing through.</p></div><div class="col"><b>The Midlands</b><p>Mixed. Plan for sun and a downpour on the same day at Cosford or Ragley Hall.</p></div><div class="col"><b>The Cotswolds and the south</b><p>Usually warmer and drier, but airfields like Fairford are wide open, so wind and summer storms still catch campers out.</p></div><div class="col"><b>East of England</b><p>One of the driest and sunniest parts of the UK. Plan for heat, strong sun and dust at Duxford and Shuttleworth.</p></div></div>'},
 {id:'mud',t:'When it rains',lvl:['b','Basics'],h:'<p class="pp">The photo at the top of this page shows what a few hours of heavy rain does to a busy camping field. On the Friday of RIAT 2023, downpours like this caused carnage in the campsites around RAF Fairford.</p>'+check([['Wellies or walking boots','Even if the forecast is sunny.'],['Full waterproofs','Jacket and trousers.'],['A door mat','Keeps the mud out of the tent.'],['Bin bags','For wet and muddy kit.'],['Spare dry clothes','In a sealed bag.']])+'<p class="pp">Pitch on higher ground if rain is forecast, and park facing the exit. Also re proof an older tent before the season. In 2023 ours leaked because the waterproofing had worn off.</p>'+seeAlso('kit','Waterproof ratings for tents are explained in')},
 {id:'heat',t:'When it’s hot',lvl:['b','Basics'],h:'<p class="pp">In England, the UK Health Security Agency and the Met Office issue heat health alerts from 1 June to 30 September, coloured green, yellow, amber and red. If an amber or red alert covers your show, plan shade, plenty of water and quiet time in the hottest hours.</p>'+seeAlso('kids','Sun advice for families is in')},
 {id:'wind',t:'When it’s windy',lvl:['c','Comfort'],h:'<p class="pp">Pitch the narrow end into the wind, use every guy line and take gazebo canopies down if strong wind is forecast. And keep away from tall trees.</p>'+photo('weather','storm-sky')+seeAlso('pitch','Step by step pegging is in')},
 {id:'pack',t:'Pack for every weather',lvl:['b','Basics'],h:'<p class="pp">My group always packs a mix: waterproofs and boots, plus shorts, sliders and T shirts. There have been days when we needed all of it, sometimes in the same afternoon.</p>'},
 {id:'src',t:'Sources',lvl:null,h:'<p class="src"><a target="_blank" rel="noopener" href="https://www.metoffice.gov.uk/research/climate/maps-and-data/regional-climates/index">Met Office regional climates</a>. <a target="_blank" rel="noopener" href="https://www.gov.uk/government/news/ukhsa-launches-new-alerting-system-in-collaboration-with-the-met-office">UKHSA heat health alerts</a>. Check the forecast for your show a few days before you travel.</p>'}
]};

P.lux=function(){return [
 {id:'start',t:'When to add the luxuries',lvl:['l','Luxury'],h:'<p class="pp">For one or two nights, I would not bother with most of this. Pack light and enjoy the show. But if you are staying four nights or more, have room in the car and the budget, a few of these things turn a tent into a proper home for the week.</p>'+seeAlso('kit','Plan what you need for your number of nights in')+photo('lux','campsite-evening')},
 {id:'shelter',t:'An event shelter kitchen',lvl:['l','Luxury'],h:'<p class="pp">Buying an event shelter was one of the biggest changes we ever made. We now use it as our kitchen and social area, and it has made camping so much easier. It gives you room for tables, food and cooking kit, and somewhere dry for everyone when the weather turns.</p>'+steps([['Anchor it properly','Peg and guy every leg. Never rely on its weight.'],['Add side walls','Close the side facing the wind and open the side facing the display line.'],['Lower it in strong wind','Take the canopy down overnight if strong wind is forecast. It takes five minutes and can save your shelter.']])+'<p class="pp" style="margin-top:22px">Here is how a shelter kitchen can come together. Cooking down one side, food and storage down the other, and a clear walkway through the middle.</p>'+gallery([['kitchen-844e3f44','Inside the shelter: cooking on the left, storage on the right and the tent at the back'],['kitchen-93dce173','Kitchen units, a prep table and a solar panel to keep things charged'],['event-shelter-night','Our Coleman event shelter kitchen, lit up for the evening']])},
 {id:'power',t:'Power and lighting',lvl:['l','Luxury'],h:'<p class="pp">Camping fields get very dark at night, and if you have a camera, phones and lights to charge, power soon matters. Few airshow campsites offer hook up. RIAT sells a 6 amp hook up per plot and the Midlands Air Festival has powered pitches, but Shuttleworth and Headcorn have none.</p><p class="pp">A portable power station with a solar panel is quiet and keeps lights, phones and a fan going all week. These are the sizes I would look at, with prices from Decathlon UK on 18 October 2026.</p>'+photo('lux','jackery-solar')+'<p class="pp">This is our Jackery solar generator: the power station, a folding solar panel and the carry bag. Lay the panel facing the sun in the morning and it tops the power station up while you are at the show, so you come back to charged phones, camera batteries and lights. Keep the power station itself in the shade, as they don’t like getting hot.</p><div class="table-wrap"><table class="rt"><thead><tr><th>Power station</th><th>Good for</th><th>Price</th></tr></thead><tbody>'+POWER.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td class="pr">£'+x[2].toFixed(2)+'</td></tr>'}).join('')+'</tbody></table></div><div class="cols"><div class="col"><b>Generators</b><p>Shuttleworth allows them 10:00 to 19:00 at the back of the site. Headcorn allows quiet ones with an extinguisher. Sywell bans petrol ones.</p></div><div class="col"><b>Lighting</b><p>Festoon lights around the shelter and solar lights on the windbreaks look great and help everyone find their way back.</p></div></div>'+photo('lux')},
 {id:'sleep',t:'Sleep like you are at home',lvl:['l','Luxury'],h:check([['Raised camp bed','Off the cold ground, easier to get out of, and storage underneath.'],['Proper duvet and pillows',''],['Carpet or rug for the tent',''],['Electric blanket','Only with hook up.'],['Blackout bedroom','Sunrise is before 5am in summer.']])},
 {id:'fridge',t:'Fridges and camp kitchens',lvl:['l','Luxury'],h:'<p class="pp">A 3 way fridge runs on gas, mains or 12V, so it keeps working without hook up. Pair it with a folding kitchen unit, a sink unit and a two burner stove, where the show’s rules allow it. Mine was a second hand bargain, and the story is in the saving money guide.</p>'+seeAlso('food','Check each show’s cooking rules in')},
 {id:'glamp',t:'Glamping and bell tents',lvl:['l','Luxury'],h:'<p class="pp">If you would rather not pitch at all, glamping is worth a look. Bell tents arrive already up, with proper beds inside, and all you bring is your bag. I see more of them at the shows every year. This may work for you if you are travelling a long way, have never camped before or just want an easy weekend.</p>'+photo('lux','bell-tents')+'<div class="cols"><div class="col"><b>Fairford Airshow Camping</b><p>Offers fully managed glamping at RIAT, when I last checked in October 2026.</p></div><div class="col"><b>Official RIAT Camping</b><p>Lists glamping alongside tents and motorhomes on the official campsite.</p></div><div class="col"><b>Other shows</b><p>Search Pitchup or Campsites.co.uk for bell tents and pods near your show. They sell out early.</p></div></div>'+photo('lux','bell-tent')+'<div class="chips"><a class="chip pu" target="_blank" rel="noopener" href="https://www.fairfordairshowcamping.net/">Fairford Airshow Camping</a><a class="chip lt" target="_blank" rel="noopener" href="https://www.airtattoo.com/camping/camping/official-riat-camping/">Official RIAT Camping</a></div>'},
 {id:'src',t:'Sources',lvl:null,h:'<p class="src">Official camping pages for <a target="_blank" rel="noopener" href="https://www.airtattoo.com/camping/camping/official-riat-camping/">RIAT</a>, <a target="_blank" rel="noopener" href="https://www.shuttleworth.org/visit/help-faqs/camping">Shuttleworth</a>, <a target="_blank" rel="noopener" href="https://headcornairshow.com/camping">Headcorn</a>, <a target="_blank" rel="noopener" href="https://www.midlandsairfestival.com/camping.html">Midlands Air Festival</a> and <a target="_blank" rel="noopener" href="https://www.sywellclassic.co.uk/faqs/">Sywell</a>.</p>'}
]};

 {id:'starter',t:'A starter kit, laid out',lvl:['b','Basics'],h:'<p class="pp">If you have never camped before, this is roughly what I would lay out on the lawn before your first trip. It is everything you need to set up camp, sleep well, cook and keep clean for a couple of nights. Nothing fancy, and you can add the comfort bits later once you know you enjoy it.</p><p class="pp">I always lay it all out like this at home and check it off before it goes in the car. It is much easier to spot what is missing on the grass than in the boot.</p>'+photo('kit','starter-kit-flatlay')+'<p class="pp">Not sure what something is? Here is the same kit again, grouped and labelled.</p><figure class="fig flatlay">'+SVGKIT+'<figcaption>A first timer kit for two people for one or two nights. Your own list will change with how many of you there are and how long you stay, so use the packing list below to build yours.</figcaption></figure>'},
 
 {id:'plan',t:'Your packing list, built for your trip',lvl:['b','Basics'],h:'<p class="pp">The biggest mistake I made on my first camping trip was not planning. I forgot things, I packed things I never used, and I learned a lot the hard way. Now I keep a list every year: what I used, what I didn’t, and what I wish I’d brought.</p><p class="pp">This is that list. Tell it how many of you are going and for how many nights, and it changes to suit you. Tick things off as you pack.</p>'+planner()},
 {id:'length',t:'One night or a whole week?',lvl:['b','Basics'],h:'<div class="cols"><div class="col"><b>One or two nights</b><p>Pack light. A tent, beds, a small stove, chairs and warm clothes is plenty. You don’t need a full kitchen for two breakfasts.</p></div><div class="col"><b>Three or four nights</b><p>This is where a gazebo starts to earn its space. Somewhere dry to sit outside the tent changes everything when it rains.</p></div><div class="col"><b>Five nights or more</b><p>Like a full RIAT week. Your list gets longer, and that’s fine if you have the car space and budget. A shelter kitchen, raised beds and a power station all make sense now.</p></div></div>'},
 {id:'groups',t:'How much kit for your group',lvl:['c','Comfort'],h:'<p class="pp">These are the setups I would suggest, based on the groups I’ve camped with. Use them as a starting point, not a rule.</p><div class="table-wrap"><table class="rt"><thead><tr><th>Group</th><th>Tent</th><th>Shelter</th><th>Windbreaks</th><th>Good to know</th></tr></thead><tbody><tr><td>2 people</td><td>4 berth, or 6 berth for 5 nights or more</td><td>Small gazebo or porch awning</td><td>4 to 6 panels</td><td>A “4 berth” fills up fast once two beds, bags and boots are in.</td></tr><tr><td>4 people</td><td>6 to 8 berth</td><td>One gazebo or event shelter</td><td>6 to 8 panels</td><td>Bring at least two torches. Phone torches are not enough.</td></tr><tr><td>6 people</td><td>One 8 berth, or two 4 to 6 berth</td><td>Two: kitchen and seating</td><td>8 to 10 panels</td><td>Two tents means you are not waking six people every toilet trip.</td></tr><tr><td>8 people</td><td>Two family tents</td><td>Two or three</td><td>10 to 12 panels</td><td>A third shelter is great for storage and wet days.</td></tr><tr><td>10 to 12</td><td>Several tents</td><td>Two shelters plus a cooking area</td><td>12 or more</td><td>Bring several mallets. Watching ten people wait while one person hammers 40 pegs is not how you want to start.</td></tr></tbody></table></div>'+photo('kit','group-pitch')+seeAlso('pitch','How to lay all this out on your pitch is in')},
 {id:'prices',t:'What kit costs, budget to premium',lvl:['c','Comfort'],h:'<p class="pp">This is what I would look at at each level, with the real price when I checked. Budget gets you camping safely. Mid range lasts longer and is more comfortable. Premium is for when you know you love it. Tap a product to see it in the shop.</p>'+priceTable()},
 {id:'sleep',t:'Don’t skimp on sleep',lvl:['b','Basics'],h:'<p class="pp">You can build the best looking camp at the show, but if you sleep badly every night, you won’t enjoy it. I would spend more attention on your bed than you think you need.</p><div class="cols"><div class="col"><b>Raised camp bed</b><p>My favourite. Warmer than lying on the ground, easier to get out of after a day walking the showground, and storage underneath.</p></div><div class="col"><b>Airbed</b><p>Comfy, but cold underneath. Put a blanket on top of it, under you.</p></div><div class="col"><b>Self inflating mat</b><p>Packs small. Great for one or two nights.</p></div><div class="col"><b>Sleeping bag</b><p>Even in July, bring a proper one. Check the comfort temperature, not the extreme one.</p></div></div>'},
 {id:'hh',t:'Waterproof ratings explained',lvl:['b','Basics'],h:'<p class="pp">The number on a tent, like 3000mm, is its hydrostatic head: how much water the fabric holds back. Around 1200mm to 2000mm is a typical three season tent, and 2000mm to 2500mm copes with heavy rain and wind. Groundsheets need more, at least 3000mm, because you kneel and sleep on them.</p><p class="pp">For airshow camping, I look for 3000mm or more on the flysheet, and 4000mm to 5000mm is even better.</p><div class="tip"><b>Learn from me.</b> In 2023 our tent leaked because the waterproofing had worn off. Which? found most leaks come through seams and zips anyway, so re proof an older tent before the season and check the seams.</div>'},
 {id:'pack',t:'Packing the car',lvl:['b','Basics'],h:'<p class="pp">Pack in reverse. Whatever you need first goes in last, so it comes out first.</p>'+steps([['Tent and mallet last in','So you can pitch straight away, even if it is raining.'],['Shelter and windbreaks next','Your dry space and your boundary.'],['Beds and bedding','In vacuum bags to save space.'],['Kitchen box','Stove, gas, pans, mugs, cutlery and washing up kit, all in one box.'],['Cool box last of all','Packed at home, straight from the fridge.'],['A car bag on the front seat','Tickets, keys, chargers, sun cream and snacks for the drive.']])+'<div class="tip"><b>Label your boxes.</b> Clear stackable boxes with lids, labelled on the end, mean you can find the tin opener without unpacking the whole car.</div>'},
 {id:'store',t:'Storage at camp',lvl:['c','Comfort'],h:'<p class="pp">Once you are set up, keep storage off the ground in case of rain. A hanging organiser in the tent roof is great for torches, phones and glasses. Under raised beds is perfect for bags. Lock valuables and camera kit in the car.</p>'+photo('kit','tent-storage')+'<p class="pp">I also keep a little spares box somewhere easy to reach: spare pegs, guy lines, duct tape, repair patches, cable ties, a torch and batteries. None of it is exciting, but duct tape and cable ties have rescued more camping trips than some expensive bits of kit.</p>'},
 {id:'forget',t:'Small things first timers forget',lvl:['b','Basics'],h:check([['Tin opener',''],['A lighter that works','and a spare'],['Tea towels','more than you think'],['Bin bags',''],['Toilet roll',''],['Door mat','keeps the mud out'],['Washing line and pegs','for wet towels'],['Phone charger and power bank',''],['Cash','some campsite showers and stalls'],['Ear plugs','jets start early'],['Spare car key','kept somewhere separate'],['Medication','enough for the whole trip']])},
 {id:'src',t:'Sources',lvl:null,h:'<p class="src"><a target="_blank" rel="noopener" href="https://www.advnture.com/features/what-is-hydrostatic-head">Advnture guide to hydrostatic head</a>. <a target="_blank" rel="noopener" href="https://www.which.co.uk/news/article/why-you-shouldnt-trust-the-waterproof-rating-on-your-tent-aKyzZ3f14uMo">Which? on tent waterproof ratings</a>. Group setups from my own trips.</p>'}
]};
