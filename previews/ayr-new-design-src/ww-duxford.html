<!-- Where to watch styles and tabs, copied from the Duxford page (previews/duxford-new-design-src/live-source.html) so the Ayr spots use the same layout -->
<style id="ww-css">
/* where to watch: one transport tab per viewing spot, each with its own Google map */
.ww{margin:8px 0 56px}
.ww-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 40px;margin-bottom:22px}
.ww-head h3{font-size:clamp(30px,4vw,42px);color:var(--navy)}
.ww-head h3 em{font-style:normal;color:var(--teal)}
.ww-head p{max-width:56ch}
.ww-tabs{--c:#13293C}
.ww-tabs .ww-in{--c:#32B4AF}
.ww-tabs .ww-out{--c:#6950A1}
.ww-tabs .xd-tt-tabs{border-bottom-color:#13293C}
.ww-tabs .xd-tt-ic svg circle{fill:var(--c)}
.ww-panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:start;background:#fff;border:1px solid #DCE5EB;border-top:0;padding:22px 22px 24px;box-shadow:0 8px 22px rgba(19,41,60,.08)}
.ww-panel[hidden]{display:none}
.ww-txt h4{margin:0 0 4px;font:700 24px/1.15 "Barlow",sans-serif;color:#13293C;text-transform:none;letter-spacing:0}
.ww-where{margin:0 0 12px;font:500 16px/1.4 "Barlow",sans-serif;color:#0E5F5B}
.ww-out .ww-where{color:#6950A1}
.ww-txt > p{margin:0 0 10px;color:#3E4045;font-size:16px;line-height:1.55}
.ww-facts{display:grid;gap:6px;margin:14px 0 16px;padding:0;list-style:none}
.ww-facts li{background:#fff;border:1px solid #DCE5EB;border-left:5px solid var(--c);border-radius:4px;padding:10px 14px;color:#3E4045;font-size:15px;line-height:1.45;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s cubic-bezier(.2,.7,.2,1)}
.ww-facts li:hover{transform:translateX(3px);box-shadow:0 6px 16px rgba(19,41,60,.08)}
.ww-facts b{display:block;color:#13293C;font:600 15px/1.3 "Barlow",sans-serif}
.ww-go{display:inline-flex;align-items:stretch;max-width:100%;background:#13293C;color:#fff!important;text-decoration:none!important;font:600 15px/20px "Barlow",sans-serif;transition:transform .3s cubic-bezier(.22,.61,.36,1),filter .3s}
.ww-go:hover,.ww-go:focus-visible{transform:translateY(-2px);filter:brightness(1.18)}
.ww-go:focus-visible{outline:3px solid #00A6E2;outline-offset:2px}
.ww-go .xd-tt-ic{border-radius:0;width:44px;height:auto;min-height:40px}
.ww-go span:not(.xd-tt-ic){display:flex;align-items:center;padding:10px 14px}
.ww-go i{font-style:normal;display:flex;align-items:center;padding:0 12px 0 2px;border-bottom:4px solid var(--c);transition:transform .3s}
.ww-go:hover i{transform:translateX(3px)}
.ww-map{position:relative;background:#E2E9D0;border:1px solid #DCE5EB}
.ww-map iframe{display:block;border:0;width:100%;aspect-ratio:16/10}
.ww-note{margin-top:14px;background:#fff;border-left:4px solid #6950A1;padding:12px 14px;font-size:15px;line-height:22px;color:#3E4045}
.ww-note b{color:#13293C}
@media(max-width:900px){
  .ww-tabs .xd-tt-tabs{flex-wrap:wrap;padding-bottom:8px}
  .ww-tabs .xd-tt-tabs button[type]{flex:1 1 calc(33.333% - 4px);border-bottom:2px solid #C9D6DF;border-radius:8px}
  .ww-tabs .xd-tt-tabs button[aria-selected="true"]{margin-bottom:0;border-bottom:2px solid var(--c);transform:none;box-shadow:0 4px 12px rgba(19,41,60,.1)}
  .ww-tabs .xd-tt-tabs button[aria-selected="true"]:after{display:none}
  .ww-tabs .xd-tt-tabs button[type]:hover{transform:none}
  .ww-panel{grid-template-columns:minmax(0,1fr);border-top:1px solid #DCE5EB;margin-top:10px}
  .ww-map{order:-1}
}
@media(max-width:640px){
  .ww-tabs .xd-tt-tabs button[type]{flex-basis:calc(50% - 3px);padding:12px 10px 10px;font-size:15px}
  .ww-panel{padding:14px 12px 16px;gap:16px}
  .ww-txt h4{font-size:21px}
}
@media(prefers-reduced-motion:reduce){.ww-facts li,.ww-go,.ww-go i{transition:none}}
</style>
<script>
(function(){
  function show(box, i){
    box.querySelectorAll('[role="tab"]').forEach(function(b, k){ var on = k === i; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
    box.querySelectorAll('.ww-panel').forEach(function(p, k){ p.hidden = k !== i; });
  }
  document.addEventListener('click', function(e){
    var t = e.target.closest && e.target.closest('.ww-tabs [role="tab"]');
    if (!t) return;
    var box = t.closest('.ww-tabs');
    show(box, [].indexOf.call(box.querySelectorAll('[role="tab"]'), t));
  });
  document.addEventListener('keydown', function(e){
    var t = e.target.closest && e.target.closest('.ww-tabs [role="tab"]');
    if (!t || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
    e.preventDefault();
    var box = t.closest('.ww-tabs'), tabs = box.querySelectorAll('[role="tab"]');
    var i = ([].indexOf.call(tabs, t) + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    show(box, i); tabs[i].focus();
  });
})();
</script>
