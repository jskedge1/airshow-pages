<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Profile | The Big Guide to UK Airshows</title>
<meta name="description" content="Your profile on The Big Guide to UK Airshows. One account for My Airshow Hub, the Airshow Forum, the Volunteer Hub and the Trader Hub, with a tab for each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --navy:#13293C;--navy2:#0E2131;--teal:#32B4AF;--tealtext:#0E5F5B;--red:#D74949;--purple:#6950A1;--blue:#1D63B7;--green:#2BA84A;--coach:#C2255C;
  --ink:#0B1722;--soft:#41586B;--line:#DCE3E8;--pale:#F2F4F5;
  --c:"Barlow Condensed","Barlow",Arial,sans-serif;--b:"Barlow","Segoe UI",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{font:400 17px/1.6 var(--b);color:var(--ink);background:var(--pale)}
img{max-width:100%;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
a{color:inherit}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.in{max-width:1200px;margin:0 auto;padding:0 28px}
[hidden]{display:none !important}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:700 17px var(--b);padding:13px 20px;background:var(--teal);color:#fff;border:2px solid var(--teal);transition:transform .3s var(--ease),background .3s,border-color .3s,color .3s}
.btn:hover{transform:translateY(-2px);background:var(--blue);border-color:var(--blue)}
.btn.ol{background:transparent;border-color:#fff;color:#fff}
.btn.ol:hover{background:#fff;color:var(--navy)}
.btn.line{background:#fff;color:var(--navy);border-color:var(--navy)}
.btn.line:hover{background:var(--navy);color:#fff}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.red:hover{background:var(--blue);border-color:var(--blue)}
.btn.sm{font-size:15px;padding:9px 14px}
.btn .ar{transition:transform .3s var(--ease)}
.btn:hover .ar{transform:translateX(4px)}
.demo{background:#FFF4D6;color:#5A4300;font:500 15px var(--b);padding:8px 0}
.demo .in{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo button{background:#fff;border:1px solid #D9C27A;padding:3px 10px;font:600 14px var(--b);color:#5A4300}

svg .pl{fill:#fff;stroke:none}
.tb .ring svg .pl{fill:var(--lc);transition:fill .3s}
.tb:hover .ring svg .pl,.tb[aria-selected=true] .ring svg .pl{fill:#fff}
.area-hd .ai svg .pl{fill:var(--ac)}
/* ===== logged out ===== */
.out-hd{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.out-hd .ph{position:absolute;inset:0;background:url(https://jskedge1.github.io/airshow-pages/join-img/hero-a400m.webp) 70% 45%/cover no-repeat;animation:drift 22s var(--ease) both}
.out-hd .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#13293C 0%,rgba(19,41,60,.95) 38%,rgba(19,41,60,.5) 70%,rgba(19,41,60,.15) 100%),linear-gradient(0deg,#13293C 0%,rgba(19,41,60,0) 45%)}
@keyframes drift{from{transform:scale(1.08)}to{transform:scale(1)}}
.out-hd .in{position:relative;padding-top:96px;padding-bottom:54px}
.tag{display:inline-block;background:var(--purple);color:#fff;font:600 15px var(--b);padding:6px 12px;margin-bottom:16px}
.out-hd h1{font:800 clamp(48px,7vw,88px)/.9 var(--c);text-transform:uppercase;margin:0 0 14px;max-width:12ch}
.out-hd h1 span{color:var(--teal)}
.out-hd .sub{font:700 clamp(17px,1.8vw,20px)/1.25 var(--b);color:var(--teal);text-transform:uppercase;letter-spacing:.02em;margin:0 0 16px}
.out-hd p.intro{max-width:54ch;color:#DCE6EE;margin:0 0 22px}
.out-hd .acts{display:flex;flex-wrap:wrap;gap:10px}
.out-body{padding:46px 0 60px}
.st{font:800 clamp(30px,3.8vw,44px)/1 var(--c);color:var(--red);text-transform:uppercase;margin:0 0 8px;padding-left:16px;border-left:6px solid var(--red)}
.st-p{color:var(--soft);max-width:60ch;margin:0 0 24px 22px}
.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.area{background:#fff;border:1px solid var(--line);border-top:5px solid var(--ac);padding:20px 18px 18px;transition:transform .35s var(--ease),box-shadow .35s}
.area:nth-child(2),.area:nth-child(4){margin-top:22px}
.area:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(19,41,60,.12)}
.area .ai{width:46px;height:46px;border-radius:50%;background:var(--ac);display:grid;place-items:center;margin-bottom:12px}
.area .ai svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.area b{display:block;font:800 24px/1 var(--c);text-transform:uppercase;color:var(--navy);margin-bottom:6px}
.area p{margin:0;font-size:16px;color:#33424F}
.area .who{display:inline-block;margin-top:12px;background:var(--pale);color:var(--navy);font:500 14px var(--b);padding:2px 9px}

/* ===== logged in: cover and profile card ===== */
.cover{position:relative;height:250px;background:var(--navy) url(https://jskedge1.github.io/airshow-pages/join-img/hero-wildcat.webp) 60% 40%/cover no-repeat}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(19,41,60,.85) 0%,rgba(19,41,60,.15) 60%)}
.card{position:relative;z-index:2;margin-top:-92px;background:#fff;box-shadow:0 20px 44px -26px rgba(19,41,60,.6);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:end;padding:0 26px 22px}
.av{position:relative;width:168px;height:168px;margin-top:-56px;border:6px solid #fff;border-radius:50%;background:var(--ac,#32B4AF);display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 26px rgba(19,41,60,.25)}
.av img{width:100%;height:100%;object-fit:cover}
.av span{font:800 64px/1 var(--c);color:#fff}
.av-btn{position:absolute;left:128px;bottom:24px;width:40px;height:40px;border-radius:50%;background:var(--navy);border:3px solid #fff;display:grid;place-items:center;color:#fff;transition:background .3s}
.av-btn:hover{background:var(--teal)}
.av-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who-n{padding-top:18px}
.who-n h1{font:800 clamp(34px,4vw,48px)/1 var(--c);text-transform:uppercase;color:var(--navy);margin:0 0 6px}
.who-n .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--soft);font-size:16px}
.who-n .meta b{color:var(--navy);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--pale);color:var(--navy);font:500 14px var(--b);padding:3px 10px}
.chip.t{background:#E3F5F4;color:var(--tealtext)}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--navy);color:#fff}
.stat{padding:14px 18px;border-right:1px solid rgba(255,255,255,.08)}
.stat:last-child{border-right:0}
.stat b{display:block;font:800 32px/1 var(--c);color:var(--teal)}
.stat span{font-size:15px;color:#B9C9D6}

/* ===== tabs: transport tabs op1 ===== */
.tabs{display:flex;flex-wrap:wrap;gap:6px;overflow-x:auto;scrollbar-width:none;background:#E6EBEE;padding:10px 10px 0;border-bottom:3px solid var(--tc,var(--navy));margin-top:22px;transition:border-color .4s}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #D5DDE3;border-bottom:0;border-radius:12px 12px 0 0;padding:9px 16px 9px 9px;font:700 16px var(--b);color:var(--navy);transition:background .3s,color .3s,box-shadow .3s}
.tb .ring{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--lc);display:grid;place-items:center;transition:background .3s}
.tb .ring svg{width:14px;height:14px;stroke:var(--lc);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.tb .dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:2px}
.tb .dot.off{background:#B9C5CE}
.tb .dot.wait{background:#E0A100}
.tb:hover{box-shadow:0 0 0 4px rgba(50,180,175,.18)}
.tb:hover .ring{background:var(--lc)}
.tb:hover .ring svg{stroke:#fff}
.tb[aria-selected=true]{background:var(--lc);color:#fff;border-color:var(--lc)}
.tb[aria-selected=true] .ring{border-color:#fff;background:transparent}
.tb[aria-selected=true] .ring svg{stroke:#fff}
.panel{background:#fff;padding:28px 26px 30px;min-height:420px;animation:pin .45s var(--ease)}
@keyframes pin{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph-t{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.ph-t h2{font:800 clamp(28px,3vw,38px)/1 var(--c);text-transform:uppercase;color:var(--red);margin:0;padding-left:14px;border-left:6px solid var(--red)}
.ph-t p{margin:6px 0 0 20px;color:var(--soft);max-width:60ch}

/* my log ins board */
.logins{display:grid;gap:10px}
.lg{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-left:6px solid var(--ac);padding:14px 16px;transition:transform .3s var(--ease),box-shadow .3s}
.lg:hover{transform:translateX(4px);box-shadow:0 10px 24px rgba(19,41,60,.1)}
.lg .ai{width:44px;height:44px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.lg .ai svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lg b{display:block;font:800 23px/1.05 var(--c);text-transform:uppercase;color:var(--navy)}
.lg small{display:block;color:var(--soft);font-size:15px}
.pill{font:600 14px var(--b);padding:4px 11px;white-space:nowrap}
.pill.on{background:#E2F4E6;color:#1C7332}
.pill.off{background:var(--pale);color:var(--soft)}
.pill.wait{background:#FFF1CC;color:#7A5600}
.lg-n{margin:14px 0 0;border-left:4px solid var(--purple);background:#F6F4FA;padding:12px 16px;font-size:16px;color:#26394A}

/* overview */
.ov{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px}
.box{background:#fff;border:1px solid var(--line);padding:18px 18px 16px}
.box h3{font:800 24px/1 var(--c);text-transform:uppercase;color:var(--navy);margin:0 0 12px}
.box p{margin:0 0 10px;color:#33424F;font-size:16px}
.info{display:grid;gap:4px}
.info div{display:flex;justify-content:space-between;gap:14px;background:var(--navy2);color:#fff;padding:10px 12px;font-size:16px}
.info span{color:#8FDCD8;font-weight:500}
.info b{font-weight:700;text-align:right}
.next{background:var(--navy);color:#fff;border-top:4px solid var(--teal);padding:20px 20px 18px}
.next h3{font:800 24px/1 var(--c);text-transform:uppercase;color:var(--teal);margin:0 0 12px}
.next .sh{font:800 34px/1 var(--c);text-transform:uppercase;margin:0 0 6px}
.next .cd{display:flex;gap:8px;margin:12px 0 14px}
.next .cd div{background:rgba(255,255,255,.08);padding:8px 12px;min-width:74px;text-align:center}
.next .cd b{display:block;font:800 30px/1 var(--c);color:#fff}
.next .cd span{font-size:14px;color:#B9C9D6}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.list li:last-child{border-bottom:0}
.list li b{color:var(--navy);font-weight:600}
.list li span{color:var(--soft);white-space:nowrap}
.empty{background:var(--pale);padding:16px 18px;color:var(--soft);font-size:16px}
.empty b{display:block;color:var(--navy);font-weight:700;margin-bottom:2px}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gal div{aspect-ratio:4/3;background:var(--pale) center/cover no-repeat}
.area-hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--ac);color:#fff;padding:18px 20px;border-bottom:5px solid rgba(0,0,0,.18);margin-bottom:18px}
.area-hd .ai{width:54px;height:54px;background:#fff;display:grid;place-items:center}
.area-hd .ai svg{width:26px;height:26px;stroke:var(--ac);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.area-hd h2{font:800 clamp(28px,3vw,38px)/1 var(--c);text-transform:uppercase;margin:0}
.area-hd p{margin:4px 0 0;color:rgba(255,255,255,.92);font-size:16px}
.area-hd .btn{background:#fff;color:var(--navy);border-color:#fff}
.area-hd .btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.num{background:var(--pale);padding:14px 16px;border-top:4px solid var(--ac)}
.num b{display:block;font:800 32px/1 var(--c);color:var(--navy)}
.num span{font-size:15px;color:var(--soft)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.join-box{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;border:2px dashed #C9D3DA;padding:22px 22px}
.join-box b{display:block;font:800 26px/1 var(--c);text-transform:uppercase;color:var(--navy);margin-bottom:6px}
.join-box p{margin:0;color:#33424F}
.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.err{background:#FBE9E9;color:#8A2222;padding:12px 16px;margin:16px 0;font-weight:500}
.load{padding:120px 0;text-align:center;color:var(--soft)}
.load i{display:inline-block;width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* edit dialog */
.dlg{position:fixed;inset:0;z-index:80;background:rgba(11,23,34,.6);display:grid;place-items:start center;padding:40px 16px;overflow:auto}
.dlg form{background:#fff;width:min(640px,100%);border-top:5px solid var(--teal);padding:26px 26px 22px;animation:pin .4s var(--ease)}
.dlg h2{font:800 32px/1 var(--c);text-transform:uppercase;color:var(--navy);margin:0 0 4px}
.dlg>form>p{margin:0 0 18px;color:var(--soft)}
.fld{margin-bottom:16px}
.fld label,.fld .fl{display:block;font:700 16px var(--b);color:var(--navy);margin-bottom:6px}
.fld small{font-weight:500;color:var(--soft)}
.fld input,.fld textarea{width:100%;font:400 17px/1.5 var(--b);color:var(--ink);background:#F7F9FA;border:0;border-bottom:2px solid #B9C5CE;padding:10px 12px;transition:border-color .3s,background .3s}
.fld input:focus,.fld textarea:focus{outline:0;border-bottom-color:var(--teal);background:#fff}
.fld textarea{min-height:100px;resize:vertical}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{position:relative;margin:0;font-weight:500}
.pick input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pick span{display:inline-block;border:1px solid #C9D3DA;background:#fff;color:var(--navy);font:500 15px var(--b);padding:6px 12px;transition:background .3s,color .3s,border-color .3s}
.pick input:checked+span{background:var(--teal);border-color:var(--teal);color:#fff}
.pick input:focus-visible+span{outline:3px solid var(--purple);outline-offset:2px}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-left:5px solid var(--teal);z-index:90;font-weight:500;box-shadow:0 14px 30px rgba(0,0,0,.25)}


/* ===== look switch (same as the forum) ===== */
.look{display:inline-flex;align-items:center;gap:4px;padding:5px;background:var(--navy2);border-top:3px solid var(--teal);transition:border-color .45s var(--ease)}
.look .lbl{font:600 14px var(--b);color:#9FD8D5;padding:0 8px 0 6px;white-space:nowrap}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.06)}
.seg .pill{position:absolute;top:0;bottom:0;left:0;width:50%;background:var(--teal);transition:transform .45s var(--ease),background .45s var(--ease)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;border:0;background:none;color:#fff;font:700 14px var(--b);padding:8px 12px;white-space:nowrap;transition:color .35s}
.seg button svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
html.hud .look{border-top-color:#5FE3DC;background:rgba(6,16,25,.8)}
html.hud .seg .pill{transform:translateX(100%);background:#5FE3DC}
html.hud .seg button[data-look=hud]{color:#061019}
.out-hd .look{margin-top:22px}
.card .look{margin-right:4px}

/* ===== HUD look: the cockpit style from My Airshow Hub and the forum ===== */
html.hud{--hbg:#061019;--hfg:#E8F1F6;--hmut:#A9BDCB;--cy:#5FE3DC;--glass:rgba(22,52,74,.55);--glass2:rgba(6,16,25,.62);--hl:rgba(95,227,220,.22);--hl2:rgba(95,227,220,.1);--m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html.hud body{background-color:var(--hbg);color:var(--hfg);background-image:radial-gradient(1200px 700px at 80% -10%,rgba(50,180,175,.16),transparent 60%),radial-gradient(900px 600px at -10% 60%,rgba(105,80,161,.14),transparent 60%),linear-gradient(var(--hl2) 1px,transparent 1px),linear-gradient(90deg,var(--hl2) 1px,transparent 1px);background-size:auto,auto,48px 48px,48px 48px}
html.hud .cover::after{background:linear-gradient(0deg,#061019 0%,rgba(6,16,25,.35) 70%),repeating-linear-gradient(0deg,rgba(95,227,220,.05) 0 1px,transparent 1px 4px)}
html.hud .card{background:var(--glass);border:1px solid var(--hl);box-shadow:0 0 0 1px rgba(0,0,0,.2),0 24px 50px -24px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
html.hud .card::before,html.hud .card::after,html.hud .panel::before,html.hud .panel::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--cy);pointer-events:none}
html.hud .card::before,html.hud .panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
html.hud .card::after,html.hud .panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
html.hud .av{border-color:#0B1C29;box-shadow:0 0 0 2px var(--cy),0 0 30px rgba(95,227,220,.35)}
html.hud .av-btn{background:#061019;border-color:var(--cy);color:var(--cy)}
html.hud .who-n h1{color:#fff;text-shadow:0 0 24px rgba(95,227,220,.25)}
html.hud .who-n .meta{color:var(--hmut);font-family:var(--m);font-size:14px}
html.hud .who-n .meta b{color:var(--cy);font-weight:500}
html.hud .chip,html.hud .chip.t{background:rgba(95,227,220,.1);color:var(--cy);border:1px solid var(--hl);font-family:var(--m);font-size:13px}
html.hud .stats{background:var(--glass2);border:1px solid var(--hl);border-top:0}
html.hud .stat{border-right-color:var(--hl2)}
html.hud .stat b{font-family:var(--m);font-weight:500;font-size:30px;color:var(--cy);text-shadow:0 0 16px rgba(95,227,220,.45)}
html.hud .stat span{font-family:var(--m);font-size:13px;color:var(--hmut)}
html.hud .tabs{background:transparent;border-bottom:1px solid var(--hl);padding:10px 0 0;gap:4px}
html.hud .tb{position:relative;background:transparent;border:1px solid transparent;border-radius:0;color:var(--hmut);font:500 14px var(--m);padding:9px 14px 9px 9px;letter-spacing:.02em}
html.hud .tb::before,html.hud .tb::after{content:"";position:absolute;top:0;bottom:0;width:8px;border:2px solid var(--cy);opacity:0;transition:opacity .3s,width .35s var(--ease)}
html.hud .tb::before{left:0;border-right:0}
html.hud .tb::after{right:0;border-left:0}
html.hud .tb:hover{box-shadow:none;color:#fff}
html.hud .tb:hover::before,html.hud .tb:hover::after{opacity:.6}

(function(){

    var p=document.getElementById('panel');p.setAttribute('aria-labelledby','tab-'+k);
    p.style.animation='none';void p.offsetWidth;p.style.animation='';
    p.innerHTML=({overview:pOverview,logins:pLogins,hub:pHub,forum:pForum,team:pTeam,trader:pTrader,settings:pSettings})[k]();
    try{history.replaceState(null,'','#'+k);}catch(e){}
  }

  function loginRows(){
    return '<div class="logins">'+AREAS(D).map(function(a){
      return '<div class="lg" style="--ac:'+a.c+'"><span class="ai">'+svg(a.k)+'</span><div><b>'+esc(a.n)+'</b><small>'+esc(a.line)+'</small></div>'+
        '<span class="pill '+a.s+'">'+esc(a.pill)+'</span>'+
        '<button class="btn sm '+(a.s==='off'?'line':'')+'" type="button" data-go="'+a.open+'">'+esc(a.label)+' <span class="ar">→</span></button></div>';
    }).join('')+'</div>';
  }
  function pLogins(){
    return '<div class="ph-t"><div><h2>My Log Ins</h2><p>Every part of the site that needs a log in. They all use this one account, so you never need a second password.</p></div></div>'+
      loginRows()+
      '<p class="lg-n">Signed in as <b>'+esc(D.account.email||D.account.name)+'</b>. Change your password or email from <button type="button" data-tab-go="settings" style="background:none;border:0;padding:0;color:var(--purple);font-weight:700;text-decoration:underline">Settings</button>.</p>';
  }
  function countdown(s){
    var t=new Date(s).getTime()-Date.now();if(!(t>0))return '';
    var d=Math.floor(t/864e5),w=Math.floor(d/7);
    return '<div class="cd"><div><b>'+d+'</b><span>days</span></div><div><b>'+w+'</b><span>weeks</span></div></div>';
  }
  function pOverview(){
    var a=D.account,h=D.hub||{},f=D.forum||{},next=(h.trips||[])[0];
    var about='<div class="box"><h3>About Me</h3>'+(a.bio?'<p>'+esc(a.bio)+'</p>':'<div class="empty"><b>Add a few words about you</b>Which shows you go to, what you like to see. Other members see this on the forum.</div>')+
      '<div class="info" style="margin-top:12px">'+
        '<div><span>Name</span><b>'+esc(a.name)+'</b></div>'+
        '<div><span>Area</span><b>'+esc(a.area||'Not added')+'</b></div>'+
        '<div><span>Going To</span><b>'+esc((a.going||[]).length?a.going.join(', '):'Nothing saved yet')+'</b></div>'+
      '</div><div style="margin-top:12px"><button class="btn sm line" type="button" data-act="edit">Edit profile</button></div></div>';
    var nx=next?'<div class="next"><h3>Next Show</h3><p class="sh">'+esc(next.showName)+'</p><div style="color:#B9C9D6">'+esc(d8(next.start))+'</div>'+countdown(next.start)+'<button class="btn sm" type="button" data-go="my-airshow-hub">Plan this trip <span class="ar">→</span></button></div>'
      :'<div class="next"><h3>Next Show</h3><p class="sh">Nothing planned yet</p><p style="color:#B9C9D6">Add a show to your hub and the countdown shows here.</p><button class="btn sm" type="button" data-go="air-shows-guides">Find your airshow <span class="ar">→</span></button></div>';
    var posts=(f.threads||[]).length?'<ul class="list">'+f.threads.map(function(t){return '<li><b>'+esc(t.title)+'</b><span>'+plural(t.replies||0,'reply','replies')+'</span></li>';}).join('')+'</ul>':'<div class="empty"><b>No posts yet</b>Say hello in the forum, or ask a question before your next show.</div>';
    return '<div class="ph-t"><div><h2>Hello, '+esc(a.first)+'</h2><p>Here is everything on your account at a glance. Use the tabs to open each part.</p></div></div>'+
      '<div class="ov"><div style="display:grid;gap:18px;align-content:start">'+about+'</div>'+
      '<div style="display:grid;gap:18px;align-content:start">'+nx+
        '<div class="box"><h3>My Log Ins</h3>'+loginRows()+'</div>'+
        '<div class="box"><h3>Latest Forum Posts</h3>'+posts+'</div>'+
      '</div></div>';
  }
  function areaHead(k,title,line,go,label){
    var a=AREAS(D).filter(function(x){return x.k===k;})[0];
    return '<div class="area-hd" style="--ac:'+a.c+'"><span class="ai">'+svg(k)+'</span><div><h2>'+esc(title)+'</h2><p>'+esc(line)+'</p></div><button class="btn sm" type="button" data-go="'+go+'">'+esc(label)+' <span class="ar">→</span></button></div>';
  }
  function pHub(){
    var h=D.hub||{};
    var trips=(h.trips||[]).length?'<ul class="list">'+h.trips.map(function(t){return '<li><b>'+esc(t.showName)+'</b><span>'+esc(d8(t.start))+'</span></li>';}).join('')+'</ul>':'<div class="empty"><b>No shows saved yet</b>Open your hub and add the shows you are going to. I would suggest starting with just one.</div>';
    var past=(h.past||[]).length?'<ul class="list">'+h.past.map(function(p){return '<li><b>'+esc(p.showName)+'</b><span>'+esc(p.year||'')+'</span></li>';}).join('')+'</ul>':'<div class="empty"><b>Your airshow history starts here</b>Shows you have been to move here on their own once the day has passed.</div>';
    return areaHead('hub','My Airshow Hub','Your planner for every UK show.','my-airshow-hub','Open my hub')+
      '<div class="nums" style="--ac:#32B4AF"><div class="num"><b>'+(h.trips||[]).length+'</b><span>Shows planned</span></div><div class="num"><b>'+(h.mustSee||0)+'</b><span>Must see aircraft</span></div><div class="num"><b>'+(h.unread||0)+'</b><span>New show updates</span></div><div class="num"><b>'+(h.pastCount||0)+'</b><span>Shows attended</span></div></div>'+
      '<div class="cols2"><div class="box"><h3>Coming Up</h3>'+trips+'</div><div class="box"><h3>Been There</h3>'+past+'</div></div>';
  }
  function pForum(){
    var f=D.forum||{};
    var posts=(f.threads||[]).length?'<ul class="list">'+f.threads.map(function(t){return '<li><b>'+esc(t.title)+'</b><span>'+esc(pretty(t.group))+'</span></li>';}).join('')+'</ul>':'<div class="empty"><b>No posts yet</b>Start a thread whenever you like. Most people start with a question about their next show.</div>';
    var gal=(f.gallery||[]).length?'<div class="gal">'+f.gallery.map(function(g){return '<div style="background-image:url(\''+esc(g.url)+'\')" role="img" aria-label="'+esc(g.title)+'"></div>';}).join('')+'</div>':'<div class="empty"><b>No photos yet</b>Share your shots in the Photographer’s Corner.</div>';
    var groups=(f.groups||[]).length?'<div class="chips">'+f.groups.map(function(g){return '<span class="chip">'+esc(pretty(g))+'</span>';}).join('')+'</div>':'<div class="empty">You have not joined any groups yet.</div>';
    return areaHead('forum','Airshow Forum','Talk to other fans, share photos and find a show day buddy.','community-forum','Open the forum')+
      '<div class="nums" style="--ac:#6950A1"><div class="num"><b>'+(f.threadCount||0)+'</b><span>Threads started</span></div><div class="num"><b>'+(f.commentCount||0)+'</b><span>Replies</span></div><div class="num"><b>'+(f.followers||0)+'</b><span>Followers</span></div><div class="num"><b>'+(f.following||0)+'</b><span>Following</span></div></div>'+
      '<div class="cols2"><div class="box"><h3>My Posts</h3>'+posts+'<h3 style="margin-top:18px">My Groups</h3>'+groups+'</div><div class="box"><h3>My Photos</h3>'+gal+'</div></div>';
  }
  function pTeam(){
    var t=D.team||{},a=AREAS(D)[2];
    if(a.s==='off')return areaHead('team','Volunteer Hub','For people helping to build the guide.','join-the-team','See how to join')+
      '<div class="join-box"><div><b>Fancy helping out?</b><p>Know a show inside out, or take a decent photo? Joining the team is voluntary, there is no minimum and you get full credit for anything you send. Once I say yes, the Volunteer Hub tab here opens up.</p></div><button class="btn" type="button" data-go="join-the-team">Join the team <span class="ar">→</span></button></div>';
    if(a.s==='wait')return areaHead('team','Volunteer Hub','Thanks for asking to join.','volunteer-hub','Open the Volunteer Hub')+
      '<div class="empty"><b>Waiting for approval</b>I read every request myself. Once you are on the team, you can send in your work from the Volunteer Hub.</div>';
    return areaHead('team','Volunteer Hub',t.status==='paused'?'You are on a break. Come back whenever you like.':'Thanks for helping build the guide.','volunteer-hub','Open the Volunteer Hub')+
      '<div class="nums" style="--ac:#1D63B7"><div class="num"><b>'+(t.workCount||0)+'</b><span>Things sent in</span></div><div class="num"><b>'+(t.liveCount||0)+'</b><span>Live on the guide</span></div><div class="num"><b>'+(t.roles||[]).length+'</b><span>Roles</span></div><div class="num"><b>'+(t.shows||[]).length+'</b><span>Shows covered</span></div></div>'+
      ((t.roles||[]).length?'<div class="box"><h3>My Roles</h3><div class="chips">'+t.roles.map(function(r){return '<span class="chip t">'+esc(r)+'</span>';}).join('')+'</div></div>':'');
  }
  function pTrader(){
    var tr=D.trader||{},a=AREAS(D)[3];
    if(a.s==='off')return areaHead('trader','Trader Hub','For stalls and small businesses at the shows.','advertise-with-us','List your stall')+
      '<div class="join-box"><div><b>Run a stall at the shows?</b><p>List your business so visitors can see which shows and dates to find you at. Once your listing is in, the Trader Hub tab here opens up with everything in one place.</p></div><button class="btn" type="button" data-go="advertise-with-us">See trader plans <span class="ar">→</span></button></div>';
    return areaHead('trader','Trader Hub',(tr.name||'Your listing')+(a.s==='wait'?', waiting for a check.':'.'),'trader-hub','Open the Trader Hub')+
      '<div class="nums" style="--ac:#C2255C"><div class="num"><b style="font-size:24px">'+esc(tr.planName||'Free')+'</b><span>Plan</span></div><div class="num"><b>'+(tr.showCount||0)+'</b><span>Shows listed</span></div><div class="num"><b style="font-size:24px">'+esc(a.pill)+'</b><span>Status</span></div><div class="num"><b style="font-size:24px">'+esc(tr.name||'')+'</b><span>Business</span></div></div>';
  }
  function pSettings(){
    var a=D.account;
    return '<div class="ph-t"><div><h2>Settings</h2><p>Your log in details and the bits you can change yourself.</p></div></div>'+
      '<div class="settings"><div class="box"><h3>Your Account</h3><div class="info">'+
        '<div><span>Log In Email</span><b>'+esc(a.email||'Hidden')+'</b></div>'+
        '<div><span>Member Since</span><b>'+esc(d8(a.created)||'')+'</b></div>'+
        '<div><span>Profile Name</span><b>'+esc(a.name)+'</b></div></div>'+
        '<p style="margin-top:14px">To change your password, log out and choose Forgot password on the log in window. It sends you a link by email.</p>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" data-act="edit">Edit profile</button><button class="btn sm red" type="button" data-act="logout">Log out</button></div></div>'+
      '<div class="box"><h3>Your Details</h3><p>Your profile name, photo, area and bio show to other members on the forum. Your email never does.</p><p>Want your account or anything you have posted taken off? Drop me a message and I will sort it for you.</p>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm line" type="button" data-go="policies">Privacy policy</button><button class="btn sm line" type="button" data-go="contact-us">Contact the guide</button></div></div></div>';
  }

  /* ---------- edit profile ---------- */
  var INTO=['Photography','Fast jets','Warbirds','Helicopters','Display teams','Plane spotting','Camping','Family days','First timer'];
  function edit(){
    var a=D.account,dlg=document.createElement('div');dlg.className='dlg';
    dlg.innerHTML='<form novalidate><h2>Edit Profile</h2><p>This is the same profile other members see on the forum.</p>'+
      '<div class="fld"><label for="pfN">Display name</label><input id="pfN" type="text" maxlength="40" value="'+esc(a.name)+'"></div>'+
      '<div class="fld"><label for="pfA">Where you are from <small>(a town or county is plenty)</small></label><input id="pfA" type="text" maxlength="60" value="'+esc(a.area)+'"></div>'+
      '<div class="fld"><label for="pfB">About you</label><textarea id="pfB" maxlength="600">'+esc(a.bio)+'</textarea></div>'+
      '<div class="fld"><span class="fl">What you are into</span><div class="pick">'+INTO.map(function(x){return '<label><input type="checkbox" value="'+esc(x)+'"'+((a.into||[]).indexOf(x)>-1?' checked':'')+'><span>'+esc(x)+'</span></label>';}).join('')+'</div></div>'+
      '<div class="err" id="pfE" hidden></div>'+
      '<div class="row"><button class="btn line" type="button" data-x>Cancel</button><button class="btn" type="submit">Save profile</button></div></form>';
    document.body.appendChild(dlg);
    var f=dlg.querySelector('form');setTimeout(function(){document.getElementById('pfN').focus();},50);
    function close(){dlg.remove();}
    dlg.addEventListener('click',function(e){if(e.target===dlg||e.target.hasAttribute('data-x'))close();});
    dlg.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var p={name:document.getElementById('pfN').value.trim(),area:document.getElementById('pfA').value.trim(),bio:document.getElementById('pfB').value.trim(),
        into:[].map.call(f.querySelectorAll('.pick input:checked'),function(x){return x.value;}),going:a.going||[]};
      var er=document.getElementById('pfE');
      if(p.name.length<2){er.textContent='Your display name needs at least 2 characters.';er.hidden=false;return;}
      var b=f.querySelector('[type=submit]');b.disabled=true;b.textContent='Saving';
      api('save',p).then(function(){close();toast('Profile saved.');load();},function(err){er.textContent=err.message;er.hidden=false;b.disabled=false;b.textContent='Save profile';});
    });
  }
  function photo(){
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=function(){
      var file=inp.files&&inp.files[0];if(!file)return;
      var img=new Image(),r=new FileReader();
      r.onload=function(){img.onload=function(){
        var s=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        var q=.85,data=c.toDataURL('image/jpeg',q);while(data.length>380000&&q>.4){q-=.1;data=c.toDataURL('image/jpeg',q);}
        toast('Uploading your photo');
        api('photo',{dataUrl:data}).then(function(){toast('Photo updated.');load();},function(err){toast(err.message);});
      };img.src=r.result;};
      r.readAsDataURL(file);
    };
    inp.click();
  }

  /* ---------- clicks ---------- */
  document.addEventListener('click',function(e){
    var lk=e.target.closest('[data-look]');if(lk){setLook(lk.getAttribute('data-look'),true);if(document.getElementById('panel'))showTab(tab,false);return;}
    var t=e.target.closest('[data-act],[data-go],[data-tab],[data-tab-go]');if(!t)return;
    if(t.hasAttribute('data-tab')){showTab(t.getAttribute('data-tab'),false);return;}
    if(t.hasAttribute('data-tab-go')){showTab(t.getAttribute('data-tab-go'),false);document.getElementById('tabs').scrollIntoView({behavior:reduce?'auto':'smooth'});return;}
    if(t.hasAttribute('data-go')){var u=url(t.getAttribute('data-go'));if(LIVE)api('go',{url:'/'+t.getAttribute('data-go')});else window.open(u,'_blank');return;}
    var a=t.getAttribute('data-act');
    if(a==='login'||a==='signup'){api('login',{mode:a}).then(render,function(err){outView(err.message);});}
    if(a==='logout'){api('logout').then(function(){toast('You are logged out.');load();});}
    if(a==='edit')edit();
    if(a==='photo')photo();
  });
  document.addEventListener('keydown',function(e){
    var b=e.target.closest&&e.target.closest('.tb');if(!b)return;
    var all=[].slice.call(document.querySelectorAll('.tb')),i=all.indexOf(b),n=null;
    if(e.key==='ArrowRight')n=(i+1)%all.length;if(e.key==='ArrowLeft')n=(i-1+all.length)%all.length;
    if(n!==null){e.preventDefault();showTab(all[n].getAttribute('data-tab'),true);}
  });

  function render(d){D=d;if(!d||!d.loggedIn){outView();}else{inView();}setLook(look,false);}
  function load(){api('me').then(render,function(err){outView(err.message);});}

  try{var h=(location.hash||'').slice(1);if(/^[a-z]+$/.test(h))tab=h;}catch(e){}
  if(!LIVE){
    document.getElementById('demo').hidden=false;
    document.getElementById('demoIn').onclick=function(){demoIn=true;load();};
    document.getElementById('demoOut').onclick=function(){demoIn=false;load();};
  }
  load();
})();
</script>
</body>
</html>
