<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Profile | The Big Guide to UK Airshows</title>
<meta name="description" content="Your profile on The Big Guide to UK Airshows. One account for My Airshow Hub, the Airshow Forum, the Volunteer Hub and the Trader Hub, with a tab for each.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --navy:#13293C;--navy2:#0E2131;--teal:#32B4AF;--tealtext:#0E5F5B;--red:#D74949;--purple:#6950A1;--blue:#1D63B7;--green:#2BA84A;--coach:#C2255C;
  --ink:#0B1722;--soft:#41586B;--line:#DCE3E8;--pale:#F2F4F5;
  --c:"Barlow Condensed","Barlow",Arial,sans-serif;--b:"Barlow","Segoe UI",Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{font:400 17px/1.6 var(--b);color:var(--ink);background:var(--pale)}
img{max-width:100%;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
a{color:inherit}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.in{max-width:1200px;margin:0 auto;padding:0 28px}
[hidden]{display:none !important}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:700 17px var(--b);padding:13px 20px;background:var(--teal);color:#fff;border:2px solid var(--teal);transition:transform .3s var(--ease),background .3s,border-color .3s,color .3s}
.btn:hover{transform:translateY(-2px);background:var(--blue);border-color:var(--blue)}
.btn.ol{background:transparent;border-color:#fff;color:#fff}
.btn.ol:hover{background:#fff;color:var(--navy)}
.btn.line{background:#fff;color:var(--navy);border-color:var(--navy)}
.btn.line:hover{background:var(--navy);color:#fff}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.red:hover{background:var(--blue);border-color:var(--blue)}
.btn.sm{font-size:15px;padding:9px 14px}
.btn .ar{transition:transform .3s var(--ease)}
.btn:hover .ar{transform:translateX(4px)}
.demo{background:#FFF4D6;color:#5A4300;font:500 15px var(--b);padding:8px 0}
.demo .in{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo button{background:#fff;border:1px solid #D9C27A;padding:3px 10px;font:600 14px var(--b);color:#5A4300}

svg .pl{fill:#fff;stroke:none}
.tb .ring svg .pl{fill:var(--lc);transition:fill .3s}
.tb:hover .ring svg .pl,.tb[aria-selected=true] .ring svg .pl{fill:#fff}
.area-hd .ai svg .pl{fill:var(--ac)}
/* ===== logged out ===== */
.out-hd{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.out-hd .ph{position:absolute;inset:0;background:url(https://jskedge1.github.io/airshow-pages/join-img/hero-a400m.webp) 70% 45%/cover no-repeat;animation:drift 22s var(--ease) both}
.out-hd .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#13293C 0%,rgba(19,41,60,.95) 38%,rgba(19,41,60,.5) 70%,rgba(19,41,60,.15) 100%),linear-gradient(0deg,#13293C 0%,rgba(19,41,60,0) 45%)}
@keyframes drift{from{transform:scale(1.08)}to{transform:scale(1)}}
.out-hd .in{position:relative;padding-top:96px;padding-bottom:54px}
.tag{display:inline-block;background:var(--purple);color:#fff;font:600 15px var(--b);padding:6px 12px;margin-bottom:16px}
.out-hd h1{font:800 clamp(48px,7vw,88px)/.9 var(--c);text-transform:uppercase;margin:0 0 14px;max-width:12ch}
.out-hd h1 span{color:var(--teal)}
.out-hd .sub{font:700 clamp(17px,1.8vw,20px)/1.25 var(--b);color:var(--teal);text-transform:uppercase;letter-spacing:.02em;margin:0 0 16px}
.out-hd p.intro{max-width:54ch;color:#DCE6EE;margin:0 0 22px}
.out-hd .acts{display:flex;flex-wrap:wrap;gap:10px}
.out-body{padding:46px 0 60px}
.st{font:800 clamp(30px,3.8vw,44px)/1 var(--c);color:var(--red);text-transform:uppercase;margin:0 0 8px;padding-left:16px;border-left:6px solid var(--red)}
.st-p{color:var(--soft);max-width:60ch;margin:0 0 24px 22px}
.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.area{background:#fff;border:1px solid var(--line);border-top:5px solid var(--ac);padding:20px 18px 18px;transition:transform .35s var(--ease),box-shadow .35s}
.area:nth-child(2),.area:nth-child(4){margin-top:22px}
.area:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(19,41,60,.12)}
.area .ai{width:46px;height:46px;border-radius:50%;background:var(--ac);display:grid;place-items:center;margin-bottom:12px}
.area .ai svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.area b{display:block;font:800 24px/1 var(--c);text-transform:uppercase;color:var(--navy);margin-bottom:6px}
.area p{margin:0;font-size:16px;color:#33424F}
.area .who{display:inline-block;margin-top:12px;background:var(--pale);color:var(--navy);font:500 14px var(--b);padding:2px 9px}

/* ===== logged in: cover and profile card ===== */
.cover{position:relative;height:250px;background:var(--navy) url(https://jskedge1.github.io/airshow-pages/join-img/hero-wildcat.webp) 60% 40%/cover no-repeat}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(19,41,60,.85) 0%,rgba(19,41,60,.15) 60%)}
.card{position:relative;z-index:2;margin-top:-92px;background:#fff;box-shadow:0 20px 44px -26px rgba(19,41,60,.6);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:end;padding:0 26px 22px}
.av{position:relative;width:168px;height:168px;margin-top:-56px;border:6px solid #fff;border-radius:50%;background:var(--ac,#32B4AF);display:grid;place-items:center;overflow:hidden;box-shadow:0 10px 26px rgba(19,41,60,.25)}
.av img{width:100%;height:100%;object-fit:cover}
.av span{font:800 64px/1 var(--c);color:#fff}
.av-btn{position:absolute;left:128px;bottom:24px;width:40px;height:40px;border-radius:50%;background:var(--navy);border:3px solid #fff;display:grid;place-items:center;color:#fff;transition:background .3s}
.av-btn:hover{background:var(--teal)}
.av-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who-n{padding-top:18px}
.who-n h1{font:800 clamp(34px,4vw,48px)/1 var(--c);text-transform:uppercase;color:var(--navy);margin:0 0 6px}
.who-n .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--soft);font-size:16px}
.who-n .meta b{color:var(--navy);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--pale);color:var(--navy);font:500 14px var(--b);padding:3px 10px}
.chip.t{background:#E3F5F4;color:var(--tealtext)}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--navy);color:#fff}
.stat{padding:14px 18px;border-right:1px solid rgba(255,255,255,.08)}
.stat:last-child{border-right:0}
.stat b{display:block;font:800 32px/1 var(--c);color:var(--teal)}
.stat span{font-size:15px;color:#B9C9D6}

/* ===== tabs: transport tabs op1 ===== */
.tabs{display:flex;flex-wrap:wrap;gap:6px;overflow-x:auto;scrollbar-width:none;background:#E6EBEE;padding:10px 10px 0;border-bottom:3px solid var(--tc,var(--navy));margin-top:22px;transition:border-color .4s}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #D5DDE3;border-bottom:0;border-radius:12px 12px 0 0;padding:9px 16px 9px 9px;font:700 16px var(--b);color:var(--navy);transition:background .3s,color .3s,box-shadow .3s}
.tb .ring{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--lc);display:grid;place-items:center;transition:background .3s}
.tb .ring svg{width:14px;height:14px;stroke:var(--lc);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.tb .dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-left:2px}
.tb .dot.off{background:#B9C5CE}
.tb .dot.wait{background:#E0A100}
.tb:hover{box-shadow:0 0 0 4px rgba(50,180,175,.18)}
.tb:hover .ring{background:var(--lc)}
.tb:hover .ring svg{stroke:#fff}
.tb[aria-selected=true]{background:var(--lc);color:#fff;border-color:var(--lc)}
.tb[aria-selected=true] .ring{border-color:#fff;background:transparent}
.tb[aria-selected=true] .ring svg{stroke:#fff}
.panel{background:#fff;padding:28px 26px 30px;min-height:420px;animation:pin .45s var(--ease)}
@keyframes pin{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
.ph-t{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.ph-t h2{font:800 clamp(28px,3vw,38px)/1 var(--c);text-transform:uppercase;color:var(--red);margin:0;padding-left:14px;border-left:6px solid var(--red)}
.ph-t p{margin:6px 0 0 20px;color:var(--soft);max-width:60ch}

/* my log ins board */
.logins{display:grid;gap:10px}
.lg{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:18px;align-items:center;background:#fff;border:1px solid var(--line);border-left:6px solid var(--ac);padding:14px 16px;transition:transform .3s var(--ease),box-shadow .3s}
.lg:hover{transform:translateX(4px);box-shadow:0 10px 24px rgba(19,41,60,.1)}
.lg .ai{width:44px;height:44px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.lg .ai svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lg b{display:block;font:800 23px/1.05 var(--c);text-transform:uppercase;color:var(--navy)}
.lg small{display:block;color:var(--soft);font-size:15px}
.pill{font:600 14px var(--b);padding:4px 11px;white-space:nowrap}
.pill.on{background:#E2F4E6;color:#1C7332}
.pill.off{background:var(--pale);color:var(--soft)}
.pill.wait{background:#FFF1CC;color:#7A5600}
.lg-n{margin:14px 0 0;border-left:4px solid var(--purple);background:#F6F4FA;padding:12px 16px;font-size:16px;color:#26394A}

/* overview */
.ov{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px}
.box{background:#fff;border:1px solid var(--line);padding:18px 18px 16px}
.box h3{font:800 24px/1 var(--c);text-transform:uppercase;color:var(--navy);margin:0 0 12px}
.box p{margin:0 0 10px;color:#33424F;font-size:16px}
.info{display:grid;gap:4px}
.info div{display:flex;justify-content:space-between;gap:14px;background:var(--navy2);color:#fff;padding:10px 12px;font-size:16px}
.info span{color:#8FDCD8;font-weight:500}
.info b{font-weight:700;text-align:right}
.next{background:var(--navy);color:#fff;border-top:4px solid var(--teal);padding:20px 20px 18px}
.next h3{font:800 24px/1 var(--c);text-transform:uppercase;color:var(--teal);margin:0 0 12px}
.next .sh{font:800 34px/1 var(--c);text-transform:uppercase;margin:0 0 6px}
.next .cd{display:flex;gap:8px;margin:12px 0 14px}
.next .cd div{background:rgba(255,255,255,.08);padding:8px 12px;min-width:74px;text-align:center}
.next .cd b{display:block;font:800 30px/1 var(--c);color:#fff}
.next .cd span{font-size:14px;color:#B9C9D6}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.list li:last-child{border-bottom:0}
.list li b{color:var(--navy);font-weight:600}
.list li span{color:var(--soft);white-space:nowrap}
.empty{background:var(--pale);padding:16px 18px;color:var(--soft);font-size:16px}
.empty b{display:block;color:var(--navy);font-weight:700;margin-bottom:2px}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gal div{aspect-ratio:4/3;background:var(--pale) center/cover no-repeat}
.area-hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--ac);color:#fff;padding:18px 20px;border-bottom:5px solid rgba(0,0,0,.18);margin-bottom:18px}
.area-hd .ai{width:54px;height:54px;background:#fff;display:grid;place-items:center}
.area-hd .ai svg{width:26px;height:26px;stroke:var(--ac);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.area-hd h2{font:800 clamp(28px,3vw,38px)/1 var(--c);text-transform:uppercase;margin:0}
.area-hd p{margin:4px 0 0;color:rgba(255,255,255,.92);font-size:16px}
.area-hd .btn{background:#fff;color:var(--navy);border-color:#fff}
.area-hd .btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
.num{background:var(--pale);padding:14px 16px;border-top:4px solid var(--ac)}
.num b{display:block;font:800 32px/1 var(--c);color:var(--navy)}
.num span{font-size:15px;color:var(--soft)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.join-box{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;border:2px dashed #C9D3DA;padding:22px 22px}
.join-box b{display:block;font:800 26px/1 var(--c);text-transform:uppercase;color:var(--navy);margin-bottom:6px}
.join-box p{margin:0;color:#33424F}
.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.err{background:#FBE9E9;color:#8A2222;padding:12px 16px;margin:16px 0;font-weight:500}
.load{padding:120px 0;text-align:center;color:var(--soft)}
.load i{display:inline-block;width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* edit dialog */
.dlg{position:fixed;inset:0;z-index:80;background:rgba(11,23,34,.6);display:grid;place-items:start center;padding:40px 16px;overflow:auto}
.dlg form{background:#fff;width:min(640px,100%);border-top:5px solid var(--teal);padding:26px 26px 22px;animation:pin .4s var(--ease)}
.dlg h2{font:800 32px/1 var(--c);text-transform:uppercase;color:var(--navy);margin:0 0 4px}
.dlg>form>p{margin:0 0 18px;color:var(--soft)}
.fld{margin-bottom:16px}
.fld label,.fld .fl{display:block;font:700 16px var(--b);color:var(--navy);margin-bottom:6px}
.fld small{font-weight:500;color:var(--soft)}
.fld input,.fld textarea{width:100%;font:400 17px/1.5 var(--b);color:var(--ink);background:#F7F9FA;border:0;border-bottom:2px solid #B9C5CE;padding:10px 12px;transition:border-color .3s,background .3s}
.fld input:focus,.fld textarea:focus{outline:0;border-bottom-color:var(--teal);background:#fff}
.fld textarea{min-height:100px;resize:vertical}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick label{position:relative;margin:0;font-weight:500}
.pick input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pick span{display:inline-block;border:1px solid #C9D3DA;background:#fff;color:var(--navy);font:500 15px var(--b);padding:6px 12px;transition:background .3s,color .3s,border-color .3s}
.pick input:checked+span{background:var(--teal);border-color:var(--teal);color:#fff}
.pick input:focus-visible+span{outline:3px solid var(--purple);outline-offset:2px}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-left:5px solid var(--teal);z-index:90;font-weight:500;box-shadow:0 14px 30px rgba(0,0,0,.25)}


.cm{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px;align-items:start}
.cm-side{display:grid;gap:18px}
.cm-ok{color:var(--tealtext);font-weight:600;margin:10px 0 0}
html.hud .cm-ok{color:#5FE3DC}
.pick input[type=radio]+span{cursor:pointer}

.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bdg{display:inline-flex;align-items:center;gap:6px;background:var(--navy);color:#fff;font:600 14px var(--b);padding:4px 10px 4px 6px}
.bdg svg{width:16px;height:16px;stroke:#8FDCD8;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bdg svg .pl{fill:#8FDCD8}
.bdg.gold{background:#B8862B}
.bdg.gold svg{stroke:#FFE7A8}.bdg.gold svg .pl{fill:#FFE7A8}
.comp{background:#fff;border-left:6px solid var(--purple);padding:14px 18px 14px;margin-top:14px;box-shadow:0 10px 24px -18px rgba(19,41,60,.5)}
.comp-t{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.comp-t b{font:800 22px/1.1 var(--c);text-transform:uppercase;color:var(--navy)}
.comp-t span{color:var(--soft);font-size:15px}
.comp-bar{height:8px;background:var(--pale);margin:10px 0 12px}
.comp-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--teal));transition:width .8s var(--ease)}
.comp-l{display:flex;flex-wrap:wrap;gap:6px}
.comp-l button{background:#F6F4FA;border:1px solid #DCD3EE;color:var(--navy);font:600 14px var(--b);padding:6px 10px;transition:background .3s,color .3s}
.comp-l button span{color:var(--purple);display:inline-block;transition:transform .3s var(--ease)}
.comp-l button:hover{background:var(--purple);color:#fff}
.comp-l button:hover span{color:#fff;transform:translateX(3px)}
.tb .cnt{background:var(--red);color:#fff;font:700 12px/1 var(--b);padding:4px 6px;border-radius:9px}
.wg{padding:10px 0;border-bottom:1px solid var(--line)}
.wg:last-child{border-bottom:0}
.wg>b{display:block;color:var(--navy);font-weight:700;margin-bottom:6px}
.wg-p{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.mini{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font:800 13px var(--c);overflow:hidden}
.mini img{width:100%;height:100%;object-fit:cover}
.wg-n{font-size:15px;color:#33424F;margin-right:6px}
.nf{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.nf button{background:#fff;border:1px solid #C9D3DA;color:var(--navy);font:600 15px var(--b);padding:6px 12px;transition:background .3s,color .3s}
.nf button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.nl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.nl li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--ac);padding:12px 14px}
.nl li.new{background:#F4FBFA}
.nl li.new b::after{content:"New";margin-left:8px;background:var(--purple);color:#fff;font:600 12px var(--b);padding:2px 7px;vertical-align:middle}
.nl .ai{width:38px;height:38px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.nl .ai svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nl b{color:var(--navy);font-weight:700}
.nl p{margin:2px 0;color:#33424F;font-size:15px}
.nl small{color:var(--soft);font-size:14px}
.pp{display:grid;grid-template-columns:220px minmax(0,1fr);gap:0;box-shadow:0 20px 40px -28px rgba(19,41,60,.7)}
.pp-cover{background:#5B1F2B;color:#E9C987;padding:26px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;border-right:6px solid #3E1520}
.pp-cover span{font:600 13px var(--b);letter-spacing:.04em}
.pp-cover b{font:800 34px/1 var(--c);text-transform:uppercase}
.pp-cover em{font-style:normal;font:600 16px var(--b);color:#fff}
.pp-cover i{font-style:normal;border:2px solid #E9C987;padding:4px 10px;font:700 14px var(--b)}
.pp-pages{background:#FBF7EE;background-image:repeating-linear-gradient(0deg,rgba(19,41,60,.035) 0 1px,transparent 1px 28px);padding:20px 22px}
.pp-y{margin-bottom:14px}

.pub{background:#fff;width:min(520px,100%);animation:pin .4s var(--ease);overflow:hidden}
.pub-bar{display:flex;justify-content:space-between;align-items:center;background:var(--purple);color:#fff;font:600 15px var(--b);padding:8px 8px 8px 14px}
.pub-bar button{background:none;border:0;color:#fff;font-size:26px;line-height:1;width:34px;height:34px}
.pub-cv{height:110px;background:var(--navy) url(https://jskedge1.github.io/airshow-pages/join-img/hero-wildcat.webp) 60% 40%/cover}

.av.sm{width:110px;height:110px;margin-top:-55px;border-width:5px}

.pub-n div{background:var(--pale);padding:8px 10px}

.tg{display:grid;gap:8px;margin:12px 0 14px}

.tgl input{position:absolute;opacity:0;width:44px;height:24px;margin:0}

.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}
.tgl input:checked+.sw{background:var(--teal)}
.tgl input:checked+.sw::after{transform:translateX(20px)}
.tgl input:focus-visible+.sw{outline:3px solid var(--purple);outline-offset:2px}

.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

html.hud .nl li{background:rgba(6,16,25,.55);border-color:var(--hl)}

html.hud .pp-pages{background:#0E2131;background-image:repeating-linear-gradient(0deg,rgba(95,227,220,.05) 0 1px,transparent 1px 28px)}
html.hud .pp-y h3{color:var(--cy);font-family:var(--m);font-weight:500}

html.hud .pub{background:#0B1C29;border:1px solid var(--hl);color:var(--hfg)}
html.hud .pub-b h2{color:#fff}
html.hud .pub-b p{color:var(--hmut)}
html.hud .pub-n div{background:rgba(255,255,255,.05)}
html.hud .pub-n b{color:var(--cy);font-family:var(--m);font-weight:500}
html.hud .pub-h{background:rgba(105,80,161,.18)}
html.hud .tgl b{color:#fff}
html.hud .tgl small{color:var(--hmut)}

html.hud .tgl input:checked+.sw{background:var(--cy)}

.lp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lpc{background:#fff;border:1px solid var(--line);border-top:5px solid var(--ac);display:flex;flex-direction:column;transition:transform .35s var(--ease),box-shadow .35s}
.lpc:nth-child(even){transform:translateY(18px)}
.lpc:hover{box-shadow:0 18px 36px rgba(19,41,60,.14)}
.lpc:hover .bf-img{background-position:center 30%}
.lpc-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.lpc-b p{margin:0;color:#33424F;font-size:16px;flex:1}
.lpc-b .btn{align-self:flex-start}
.lpc-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lpc-t .ai{width:36px;height:36px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.lpc-t .ai svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lpc-t b{font:800 24px/1 var(--c);text-transform:uppercase;color:var(--navy);margin-right:auto}
.bf{margin:12px 12px 0;border:1px solid #CBD5DC;box-shadow:0 10px 22px -14px rgba(19,41,60,.6);overflow:hidden}
.bf-bar{display:flex;align-items:center;gap:5px;background:#E6EBEE;padding:6px 10px}
.bf-bar i{width:9px;height:9px;border-radius:50%;background:#C2CCD3}
.bf-bar i:first-child{background:#E06D6D}.bf-bar i:nth-child(2){background:#E8BE5A}.bf-bar i:nth-child(3){background:#6CC48A}
.bf-bar span{margin-left:8px;background:#fff;color:var(--soft);font:500 12px var(--b);padding:2px 10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf-img{aspect-ratio:960/470;background:var(--navy) center top/cover no-repeat;transition:background-position 1.6s var(--ease)}
.peek{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;align-items:center}
.peek .bf{margin:0}
html.hud .lpc{background:rgba(6,16,25,.55);border-color:var(--hl)}
html.hud .lpc-t b{color:#fff}
html.hud .lpc-b p{color:var(--hmut)}
html.hud .bf{border-color:var(--hl);box-shadow:0 0 24px rgba(95,227,220,.12)}
html.hud .bf-bar{background:#0B1C29}
html.hud .bf-bar span{background:rgba(255,255,255,.06);color:var(--cy);font-family:var(--m);font-size:11px}
.mini-l{display:grid;gap:6px}
.mini-l button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-left:4px solid var(--ac);padding:8px 10px;text-align:left;transition:transform .3s var(--ease)}
.mini-l button:hover{transform:translateX(3px)}
.mini-l .ai{width:30px;height:30px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.mini-l .ai svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

html.hud .mini-l button{background:rgba(6,16,25,.55);border-color:var(--hl)}
html.hud .mini-l b{color:#fff}
.snd-chip{display:none;align-items:center;gap:7px;background:transparent;border:1px solid rgba(95,227,220,.35);color:#A9BDCB;font:500 13px "JetBrains Mono",monospace;padding:8px 11px}
.snd-chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.snd-chip[aria-pressed=true]{color:#5FE3DC;border-color:#5FE3DC;box-shadow:0 0 14px rgba(95,227,220,.25)}
html.hud .snd-chip{display:inline-flex}
html.hud .card{grid-template-columns:auto minmax(0,1fr)}
html.hud .card .acts{grid-column:1/-1;justify-content:flex-end;margin-top:-6px}
html.hud .av-btn{bottom:auto;top:128px}
.snd-box .snd-off{margin:12px 0 0;border-left:4px solid var(--purple);background:#F6F4FA;padding:8px 12px;font-size:15px}
html.hud .snd-box .snd-off{display:none}
.snd-box .tgl,.snd-box .btn{opacity:.55}
html.hud .snd-box .tgl,html.hud .snd-box .btn{opacity:1}
.look-in{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:36px;align-items:center;margin-top:64px}
.li-pts{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:10px}
.li-pts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.li-pts span{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:800 16px var(--c)}
.li-pts b{display:block;color:var(--navy);font-weight:700}
.li-pts small{display:block;color:var(--soft);font-size:15px}
.li-shot{position:relative;transform:rotate(-1.2deg);transition:transform .6s var(--ease)}
.li-shot:hover{transform:rotate(0)}
.li-shot .bf{margin:0;box-shadow:0 30px 60px -30px rgba(19,41,60,.7)}
.li-img{aspect-ratio:1024/688;background-size:cover;background-position:center top}
.li-tag{position:absolute;right:-10px;top:-14px;background:var(--purple);color:#fff;font:600 14px var(--b);padding:5px 12px;transform:rotate(2deg)}
html.hud .li-pts b{color:#fff}
html.hud .li-pts small{color:var(--hmut)}
html.hud .li-pts span{background:transparent;border:2px solid var(--cy);color:var(--cy)}
/* ===== look switch (same as the forum) ===== */
.look{display:inline-flex;align-items:center;gap:4px;padding:5px;background:var(--navy2);border-top:3px solid var(--teal);transition:border-color .45s var(--ease)}
.look .lbl{font:600 14px var(--b);color:#9FD8D5;padding:0 8px 0 6px;white-space:nowrap}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.06)}
.seg .pill{position:absolute;top:0;bottom:0;left:0;width:50%;background:var(--teal);transition:transform .45s var(--ease),background .45s var(--ease)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;border:0;background:none;color:#fff;font:700 14px var(--b);padding:8px 12px;white-space:nowrap;transition:color .35s}
.seg button svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
html.hud .look{border-top-color:#5FE3DC;background:rgba(6,16,25,.8)}

.out-hd .look{margin-top:22px}
.card .look{margin-right:4px}

/* ===== HUD look: the cockpit style from My Airshow Hub and the forum ===== */
html.hud{--hbg:#061019;--hfg:#E8F1F6;--hmut:#A9BDCB;--cy:#5FE3DC;--glass:rgba(22,52,74,.55);--glass2:rgba(6,16,25,.62);--hl:rgba(95,227,220,.22);--hl2:rgba(95,227,220,.1);--m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
html.hud body{background-color:var(--hbg);color:var(--hfg);background-image:radial-gradient(1200px 700px at 80% -10%,rgba(50,180,175,.16),transparent 60%),radial-gradient(900px 600px at -10% 60%,rgba(105,80,161,.14),transparent 60%),linear-gradient(var(--hl2) 1px,transparent 1px),linear-gradient(90deg,var(--hl2) 1px,transparent 1px);background-size:auto,auto,48px 48px,48px 48px}
html.hud .cover::after{background:linear-gradient(0deg,#061019 0%,rgba(6,16,25,.35) 70%),repeating-linear-gradient(0deg,rgba(95,227,220,.05) 0 1px,transparent 1px 4px)}
html.hud .card{background:var(--glass);border:1px solid var(--hl);box-shadow:0 0 0 1px rgba(0,0,0,.2),0 24px 50px -24px rgba(0,0,0,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
html.hud .card::before,html.hud .card::after,html.hud .panel::before,html.hud .panel::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--cy);pointer-events:none}
html.hud .card::before,html.hud .panel::before{left:-1px;top:-1px;border-right:0;border-bottom:0}
html.hud .card::after,html.hud .panel::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
html.hud .av{border-color:#0B1C29;box-shadow:0 0 0 2px var(--cy),0 0 30px rgba(95,227,220,.35)}
html.hud .av-btn{background:#061019;border-color:var(--cy);color:var(--cy)}
html.hud .who-n h1{color:#fff;text-shadow:0 0 24px rgba(95,227,220,.25)}
html.hud .who-n .meta{color:var(--hmut);font-family:var(--m);font-size:14px}
html.hud .who-n .meta b{color:var(--cy);font-weight:500}
html.hud .chip,html.hud .chip.t{background:rgba(95,227,220,.1);color:var(--cy);border:1px solid var(--hl);font-family:var(--m);font-size:13px}
html.hud .stats{background:var(--glass2);border:1px solid var(--hl);border-top:0}
html.hud .stat{border-right-color:var(--hl2)}
html.hud .stat b{font-family:var(--m);font-weight:500;font-size:30px;color:var(--cy);text-shadow:0 0 16px rgba(95,227,220,.45)}
html.hud .stat span{font-family:var(--m);font-size:13px;color:var(--hmut)}
html.hud .tabs{background:transparent;border-bottom:1px solid var(--hl);padding:10px 0 0;gap:4px}
html.hud .tb{position:relative;background:transparent;border:1px solid transparent;border-radius:0;color:var(--hmut);font:500 14px var(--m);padding:9px 14px 9px 9px;letter-spacing:.02em}
html.hud .tb::before,html.hud .tb::after{content:"";position:absolute;top:0;bottom:0;width:8px;border:2px solid var(--cy);opacity:0;transition:opacity .3s,width .35s var(--ease)}
html.hud .tb::before{left:0;border-right:0}
html.hud .tb::after{right:0;border-left:0}
html.hud .tb:hover{box-shadow:none;color:#fff}
html.hud .tb:hover::before,html.hud .tb:hover::after{opacity:.6}
html.hud .tb[aria-selected=true]{background:rgba(95,227,220,.08);color:#fff;border-color:transparent}
html.hud .tb[aria-selected=true]::before,html.hud .tb[aria-selected=true]::after{opacity:1;width:12px}
html.hud .tb .ring{border-color:var(--cy);width:26px;height:26px;border-width:2px}
html.hud .tb .ring svg{stroke:var(--cy)}
html.hud .tb .ring svg .pl,html.hud .tb:hover .ring svg .pl{fill:var(--cy)}
html.hud .tb:hover .ring,html.hud .tb[aria-selected=true] .ring{background:transparent}
html.hud .tb[aria-selected=true] .ring svg{stroke:var(--cy)}
html.hud .tb[aria-selected=true] .ring svg .pl{fill:var(--cy)}
html.hud .panel{position:relative;background:var(--glass);border:1px solid var(--hl);border-top:0;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);animation:hudOpen .55s var(--ease)}
@keyframes hudOpen{0%{clip-path:inset(0 50% 0 50%);opacity:.6}55%{clip-path:inset(0 0 0 0)}62%{transform:translateX(3px);filter:hue-rotate(40deg) saturate(1.6)}68%{transform:translateX(-2px)}74%{transform:none;filter:none}100%{opacity:1}}
html.hud .ph-t h2{color:var(--cy);border-left-color:var(--cy);text-shadow:0 0 20px rgba(95,227,220,.3)}
html.hud .ph-t p,html.hud .box p{color:var(--hmut)}
html.hud .box{background:var(--glass2);border:1px solid var(--hl)}
html.hud .box h3{color:#fff}
html.hud .info div{background:rgba(255,255,255,.04);border:1px solid var(--hl2)}
html.hud .info span{color:var(--cy);font-family:var(--m);font-size:14px}
html.hud .next{background:linear-gradient(135deg,rgba(50,180,175,.18),rgba(6,16,25,.7));border:1px solid var(--hl);border-top:3px solid var(--cy)}
html.hud .next h3{color:var(--cy)}
html.hud .next .cd div{background:rgba(6,16,25,.7);border:1px solid var(--hl)}
html.hud .next .cd b{font-family:var(--m);font-weight:500;color:var(--cy);text-shadow:0 0 14px rgba(95,227,220,.5)}
html.hud .lg{background:rgba(6,16,25,.55);border-color:var(--hl);border-left-width:4px}
html.hud .lg:hover{box-shadow:0 0 24px rgba(95,227,220,.12)}
html.hud .lg b,html.hud .num b,html.hud .join-box b{color:#fff}
html.hud .lg small,html.hud .num span{color:var(--hmut)}
html.hud .pill{font-family:var(--m);font-weight:500;font-size:13px}
html.hud .pill.on{background:rgba(43,168,74,.16);color:#7DE39A;border:1px solid rgba(125,227,154,.35)}
html.hud .pill.off{background:rgba(255,255,255,.05);color:var(--hmut);border:1px solid var(--hl2)}
html.hud .pill.wait{background:rgba(224,161,0,.14);color:#FFD36B;border:1px solid rgba(255,211,107,.35)}
html.hud .lg-n,html.hud .empty{background:rgba(105,80,161,.16);color:var(--hmut);border-left-color:var(--purple)}
html.hud .empty b{color:#fff}
html.hud .list li{border-bottom-color:var(--hl2)}
html.hud .list li b{color:#fff}
html.hud .list li span{color:var(--hmut);font-family:var(--m);font-size:14px}
html.hud .num{background:rgba(6,16,25,.55);border:1px solid var(--hl2);border-top:3px solid var(--ac)}
html.hud .num b{font-family:var(--m);font-weight:500}
html.hud .join-box{border-color:var(--hl)}
html.hud .join-box p{color:var(--hmut)}
html.hud .area-hd{box-shadow:0 0 30px rgba(0,0,0,.35)}
html.hud .btn.line{background:transparent;color:var(--cy);border-color:var(--cy)}
html.hud .btn.line:hover{background:var(--cy);color:#061019}
html.hud .btn:not(.line):not(.red):not(.ol){box-shadow:0 0 18px rgba(50,180,175,.35)}
html.hud .gal div{background-color:rgba(255,255,255,.05)}
html.hud .out-body .st{color:var(--cy);border-left-color:var(--cy)}
html.hud .out-body .st-p{color:var(--hmut)}
html.hud .area{background:var(--glass);border-color:var(--hl);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
html.hud .area b{color:#fff}
html.hud .area p{color:var(--hmut)}
html.hud .area .who{background:rgba(95,227,220,.1);color:var(--cy);font-family:var(--m);font-size:13px}
html.hud .dlg form{background:#0B1C29;border:1px solid var(--hl);border-top:4px solid var(--cy);color:var(--hfg)}
html.hud .dlg h2,html.hud .fld label,html.hud .fld .fl{color:#fff}
html.hud .dlg>form>p,html.hud .fld small{color:var(--hmut)}
html.hud .fld input,html.hud .fld textarea{background:rgba(255,255,255,.05);color:#fff;border-bottom-color:var(--hl)}
html.hud .pick span{background:transparent;color:var(--hmut);border-color:var(--hl)}
html.hud .pick input:checked+span{background:var(--cy);border-color:var(--cy);color:#061019}
html.hud .load{color:var(--hmut)}
html.hud .toast{background:#0B1C29;border-left-color:var(--cy)}
@media(prefers-reduced-motion:reduce){html.hud .panel{animation:none}.seg .pill{transition:none}}

@media(max-width:1000px){
  .areas{grid-template-columns:repeat(2,minmax(0,1fr))}
  .area:nth-child(4){margin-top:0}
  .card{grid-template-columns:auto minmax(0,1fr)}
  .card .acts{grid-column:1/-1;justify-content:flex-start}

  /* ---------- cockpit sounds (HUD look only), the same sounds as My Airshow Hub ---------- */
  var SFX=(function(){
    var on=false,ctx=null;
    try{on=localStorage.getItem('ukagOvSound')==='on';}catch(e){}
    function ac(){if(!ctx){var A=window.AudioContext||window.webkitAudioContext;if(!A)return null;ctx=new A();}if(ctx.state==='suspended')ctx.resume();return ctx;}
    function noise(at,dur,f0,f1,vol,type){
      var c=ac();if(!c)return;var t=c.currentTime+.01+at;
      var n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
      for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
      var src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
      src.buffer=b;f.type=type||'bandpass';f.Q.value=1.4;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.35);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      src.connect(f);f.connect(g);g.connect(c.destination);src.start(t);src.stop(t+dur);
    }
    function beep(f,at,dur,type,vol){
      var c=ac();if(!c)return;var t=c.currentTime+.01+at,o=c.createOscillator(),g=c.createGain();
      o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);
    }
    function ok(){return on&&document.documentElement.classList.contains('hud');}
    return {
      isOn:function(){return on;},
      set:function(v){on=v;try{localStorage.setItem('ukagOvSound',v?'on':'off');}catch(e){}if(v)ac();},
      key:function(){if(ok()){noise(0,.03,2600,2400,.35,'highpass');beep(380,0,.05,'sine',.25);beep(2093,.045,.04,'sine',.08);}},
      glitch:function(){if(ok()){noise(0,.26,300,5000,.18);[.24,.28,.31].forEach(function(a){beep(600+Math.random()*1800,a,.025,'square',.04);});beep(1760,.36,.08,'sine',.08);}},
      lock:function(){if(ok()){for(var i=0;i<4;i++)beep(1400+i*140,i*.07,.04,'square',.04);beep(2093,.3,.25,'triangle',.1);}},
      radio:function(){if(ok()){noise(0,.35,1800,900,.1);beep(1000,.02,.06,'sine',.04);}},
      whoosh:function(){if(ok())noise(0,.4,600,4500,.22);},
      jet:function(){if(ok())noise(0,2.6,200,1400,.4,'lowpass');}
    };
  })();

    var dlg=document.createElement('div');dlg.className='dlg';
    dlg.innerHTML='<div class="pub" role="dialog" aria-label="How other members see your profile"><div class="pub-bar"><span>This is how other members see you</span><button type="button" data-x aria-label="Close">×</button></div>'+
      '<div class="pub-cv"></div><div class="pub-b"><div class="av sm" style="--ac:'+esc(a.colour)+'">'+(a.photo?'<img src="'+esc(a.photo)+'" alt="">':'<span>'+esc(initials(a.name))+'</span>')+'</div>'+
      '<h2>'+esc(a.name)+'</h2>'+(pv.area!==false&&a.area?'<p class="pub-m">From '+esc(a.area)+'</p>':'')+
      (a.bio?'<p>'+esc(a.bio)+'</p>':'')+badgeRow()+
      ((a.into||[]).length?'<div class="chips">'+a.into.map(function(x){return '<span class="chip t">'+esc(x)+'</span>';}).join('')+'</div>':'')+
      '<div class="pub-n"><div><b>'+(f.threadCount||0)+'</b><span>Posts</span></div><div><b>'+(f.photoCount||0)+'</b><span>Photos</span></div>'+(pv.followers!==false?'<div><b>'+(f.followers||0)+'</b><span>Followers</span></div>':'')+(pv.passport!==false?'<div><b>'+(h.pastCount||0)+'</b><span>Stamps</span></div>':'')+'</div>'+
      (pv.going!==false&&(a.going||[]).length?'<p class="pub-m">Going to '+esc(a.going.join(', '))+'</p>':'')+
      '<p class="pub-h">Never shown: your email, your trip plans, your must see list and your log ins. Change what shows in Settings.</p>'+
      '<div class="row"><button class="btn sm line" type="button" data-x>Close</button><button class="btn sm" type="button" data-x data-tab-go="settings">Privacy settings</button></div></div></div>';
    document.body.appendChild(dlg);
    dlg.addEventListener('click',function(e){if(e.target===dlg||e.target.closest('[data-x]'))dlg.remove();});
    dlg.addEventListener('keydown',function(e){if(e.key==='Escape')dlg.remove();});
    setTimeout(function(){dlg.querySelector('[data-x]').focus();},50);
  }
  /* ---------- privacy controls ---------- */
  var PV=[['area','Where I am from','Shows your area on your profile and forum posts.'],['going','Shows I am going to','Lets other members see which shows you have saved, and puts you in their Who’s Going Too list if they follow you.'],['followers','My followers','Shows how many people follow you.'],['passport','My Airshow Passport','Shows the stamps from the shows you have been to.']];
  function privacyBox(){
    var pv=D.privacy||{};
    return '<div class="box"><h3>What Other Members See</h3><p>Turn things off if you would rather keep them to yourself. Your email and trip plans are never shown.</p><div class="tg">'+
      PV.map(function(x){var on=pv[x[0]]!==false;return '<label class="tgl"><input type="checkbox" data-pv="'+x[0]+'"'+(on?' checked':'')+'><span class="sw" aria-hidden="true"></span><span><b>'+esc(x[1])+'</b><small>'+esc(x[2])+'</small></span></label>';}).join('')+
      '</div><button class="btn sm line" type="button" data-act="public">'+svg('eye')+' How others see me</button></div>';
  }

  /* ---------- contact me ---------- */
  var TOPICS=['A question about a show','Help with my account','An idea for the site','Something looks wrong','Joining the team','Trading at the shows','Remove my account or posts'];
  var MAIL='contactus@ukairshowguide.co.uk';
  function pContact(){
    var a=D.account;
    return '<div class="area-hd" style="--ac:#2BA84A"><span class="ai">'+svg('mail')+'</span><div><h2>Contact Me</h2><p>I read every message myself and try to reply within a few days.</p></div><button class="btn sm" type="button" data-go="contact-us">Contact page <span class="ar">→</span></button></div>'+
      '<div class="cm"><form class="box cm-f" id="cmF" novalidate><h3>Send Me A Message</h3>'+
        '<p>Pick what it is about and write a few lines. This opens your own email with it all filled in, so you can read it over before it goes.</p>'+
        '<div class="fld"><span class="fl">What is it about?</span><div class="pick" id="cmT">'+TOPICS.map(function(t,i){return '<label><input type="radio" name="cmt" value="'+esc(t)+'"'+(i===0?' checked':'')+'><span>'+esc(t)+'</span></label>';}).join('')+'</div></div>'+
        '<div class="fld"><label for="cmS">Which show? <small>(if it is about one)</small></label><input id="cmS" type="text" maxlength="80" value="'+esc(((D.hub||{}).trips||[])[0]?D.hub.trips[0].showName:'')+'"></div>'+
        '<div class="fld"><label for="cmM">Your message</label><textarea id="cmM" maxlength="2000" placeholder="Hi Jack,"></textarea></div>'+
        '<div class="err" id="cmE" hidden></div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" id="cmGo" href="#">Open in my email <span class="ar">→</span></a><button class="btn line" type="button" id="cmCopy">Copy message</button></div>'+
        '<p class="cm-ok" id="cmOk" hidden>Copied. Paste it into an email to '+MAIL+'.</p>'+
      '</form>'+
      '<div class="cm-side"><div class="next"><h3>Other Ways To Reach Me</h3>'+
        '<div class="info"><div><span>Email</span><b>'+MAIL+'</b></div><div><span>Instagram</span><b>@theukairshowguide</b></div><div><span>Your Email</span><b>'+esc(a.email||'')+'</b></div></div>'+
        '<p style="color:#B9C9D6;margin:12px 0 0;font-size:16px">I will reply to the email on your account, so you know it is really from me.</p></div>'+
        '<div class="box"><h3>Before You Write</h3><p>A lot of questions about parking, buses and timings are already answered on each show page. It might be worth a quick look first, as it could save you waiting for a reply.</p><button class="btn sm line" type="button" data-go="airshow-questions">Questions and answers</button></div>'+
      '</div></div>';
  }
  function cmBuild(){
    var t=(document.querySelector('#cmT input:checked')||{}).value||'A question',sh=document.getElementById('cmS').value.trim(),m=document.getElementById('cmM').value.trim(),a=D.account;
    var subject=t+(sh?' ('+sh+')':'');
    var body=(m||'Hi Jack,')+'\n\nFrom '+a.name+(a.email?' ('+a.email+')':'')+'\nSent from My Profile on The Big Guide to UK Airshows';
    return {subject:subject,body:body};
  }

  /* ---------- edit profile ---------- */
  var INTO=['Photography','Fast jets','Warbirds','Helicopters','Display teams','Plane spotting','Camping','Family days','First timer'];
  function edit(){
    var a=D.account,dlg=document.createElement('div');dlg.className='dlg';
    dlg.innerHTML='<form novalidate><h2>Edit Profile</h2><p>This is the same profile other members see on the forum.</p>'+
      '<div class="fld"><label for="pfN">Display name</label><input id="pfN" type="text" maxlength="40" value="'+esc(a.name)+'"></div>'+
      '<div class="fld"><label for="pfA">Where you are from <small>(a town or county is plenty)</small></label><input id="pfA" type="text" maxlength="60" value="'+esc(a.area)+'"></div>'+
      '<div class="fld"><label for="pfB">About you</label><textarea id="pfB" maxlength="600">'+esc(a.bio)+'</textarea></div>'+
      '<div class="fld"><span class="fl">What you are into</span><div class="pick">'+INTO.map(function(x){return '<label><input type="checkbox" value="'+esc(x)+'"'+((a.into||[]).indexOf(x)>-1?' checked':'')+'><span>'+esc(x)+'</span></label>';}).join('')+'</div></div>'+
      '<div class="err" id="pfE" hidden></div>'+
      '<div class="row"><button class="btn line" type="button" data-x>Cancel</button><button class="btn" type="submit">Save profile</button></div></form>';
    document.body.appendChild(dlg);
    var f=dlg.querySelector('form');setTimeout(function(){document.getElementById('pfN').focus();},50);
    function close(){dlg.remove();}
    dlg.addEventListener('click',function(e){if(e.target===dlg||e.target.hasAttribute('data-x'))close();});
    dlg.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var p={name:document.getElementById('pfN').value.trim(),area:document.getElementById('pfA').value.trim(),bio:document.getElementById('pfB').value.trim(),
        into:[].map.call(f.querySelectorAll('.pick input:checked'),function(x){return x.value;}),going:a.going||[]};
      var er=document.getElementById('pfE');
      if(p.name.length<2){er.textContent='Your display name needs at least 2 characters.';er.hidden=false;return;}
      var b=f.querySelector('[type=submit]');b.disabled=true;b.textContent='Saving';
      api('save',p).then(function(){SFX.lock();close();toast('Profile saved.');load();},function(err){er.textContent=err.message;er.hidden=false;b.disabled=false;b.textContent='Save profile';});
    });
  }
  function photo(){
    var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=function(){
      var file=inp.files&&inp.files[0];if(!file)return;
      var img=new Image(),r=new FileReader();
      r.onload=function(){img.onload=function(){
        var s=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        var q=.85,data=c.toDataURL('image/jpeg',q);while(data.length>380000&&q>.4){q-=.1;data=c.toDataURL('image/jpeg',q);}
        toast('Uploading your photo');
        api('photo',{dataUrl:data}).then(function(){toast('Photo updated.');load();},function(err){toast(err.message);});
      };img.src=r.result;};
      r.readAsDataURL(file);
    };
    inp.click();
  }

  /* ---------- clicks ---------- */
  document.addEventListener('click',function(e){
    var cg=e.target.closest('#cmGo');if(cg){e.preventDefault();var mm=document.getElementById('cmM').value.trim(),er=document.getElementById('cmE');if(mm.length<3){er.textContent='Add a few words to your message first.';er.hidden=false;return;}er.hidden=true;var c=cmBuild();var href='mailto:'+MAIL+'?subject='+encodeURIComponent(c.subject)+'&body='+encodeURIComponent(c.body);try{window.top.location.href=href;}catch(x){location.href=href;}return;}
    var cc=e.target.closest('#cmCopy');if(cc){var c2=cmBuild(),txt='To: '+MAIL+'\nSubject: '+c2.subject+'\n\n'+c2.body;var ok=function(){document.getElementById('cmOk').hidden=false;};try{navigator.clipboard.writeText(txt).then(ok,function(){});}catch(x){}return;}
    var tr=e.target.closest('[data-try]');if(tr){var was=SFX.isOn();if(!was)SFX.set(true);SFX[tr.getAttribute('data-try')]();if(!was)SFX.set(false);return;}
    var nf=e.target.closest('[data-nf]');if(nf){nFilter=nf.getAttribute('data-nf');showTab('notes',false);return;}
    var lk=e.target.closest('[data-look]');if(lk){setLook(lk.getAttribute('data-look'),true);if(document.getElementById('panel'))showTab(tab,false);return;}
    var t=e.target.closest('[data-act],[data-go],[data-tab],[data-tab-go]');if(!t)return;
    if(t.hasAttribute('data-tab')){showTab(t.getAttribute('data-tab'),false);return;}
    if(t.hasAttribute('data-tab-go')){showTab(t.getAttribute('data-tab-go'),false);document.getElementById('tabs').scrollIntoView({behavior:reduce?'auto':'smooth'});return;}
    if(t.hasAttribute('data-go')){var u=url(t.getAttribute('data-go'));if(LIVE)api('go',{url:'/'+t.getAttribute('data-go')});else window.open(u,'_blank');return;}
    var a=t.getAttribute('data-act');
    if(a==='login'||a==='signup'){api('login',{mode:a}).then(render,function(err){outView(err.message);});}
    if(a==='logout'){api('logout').then(function(){toast('You are logged out.');load();});}
    if(a==='edit')edit();
    if(a==='photo')photo();
    if(a==='public')publicView();
    if(a==='sound'){SFX.set(!SFX.isOn());sndUI();SFX.key();}
  });
  document.addEventListener('change',function(e){
    var t=e.target;if(t.hasAttribute&&t.hasAttribute('data-snd')){SFX.set(t.checked);sndUI();SFX.key();return;}
    if(!t.hasAttribute||!t.hasAttribute('data-pv'))return;
    var p={};[].forEach.call(document.querySelectorAll('[data-pv]'),function(x){p[x.getAttribute('data-pv')]=x.checked;});
    D.privacy=p;
    api('privacy',p).then(function(){SFX.lock();toast('Privacy saved.');},function(err){toast(err.message);});
  });
  document.addEventListener('keydown',function(e){
    var b=e.target.closest&&e.target.closest('.tb');if(!b)return;
    var all=[].slice.call(document.querySelectorAll('.tb')),i=all.indexOf(b),n=null;
    if(e.key==='ArrowRight')n=(i+1)%all.length;if(e.key==='ArrowLeft')n=(i-1+all.length)%all.length;
    if(n!==null){e.preventDefault();showTab(all[n].getAttribute('data-tab'),true);}
  });

  function render(d){D=d;if(!d||!d.loggedIn){outView();}else{inView();}setLook(look,false);}
  function load(){api('me').then(render,function(err){outView(err.message);});}

  try{var h=(location.hash||'').slice(1);if(/^[a-z]+$/.test(h))tab=h;}catch(e){}
  if(!LIVE){
    document.getElementById('demo').hidden=false;
    document.getElementById('demoIn').onclick=function(){demoIn=true;load();};
    document.getElementById('demoOut').onclick=function(){demoIn=false;load();};
  }
  load();
})();
</script>
</body>
</html>
