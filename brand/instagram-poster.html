<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>We're on Instagram | UK Airshow Guide</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{--navy:#13293C;--deep:#0E2131;--teal:#32B4AF;--hf:'Barlow Condensed','Arial Narrow',sans-serif;--bf:'Barlow',Arial,sans-serif;
  --ig:linear-gradient(45deg,#FEDA75 0%,#FA7E1E 25%,#D62976 50%,#962FBF 75%,#4F5BD5 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0f14}
.poster{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:var(--bf);color:#fff;
  background:
    radial-gradient(900px 700px at 0% 100%,#FEDA75 0%,rgba(254,218,117,0) 60%),
    radial-gradient(900px 800px at 100% 0%,#4F5BD5 0%,rgba(79,91,213,0) 62%),
    linear-gradient(35deg,#FA7E1E 0%,#D62976 42%,#962FBF 78%,#4F5BD5 100%)}
/* soft smoke-trail arcs, echoing the logo swoosh */
.poster::before,.poster::after{content:"";position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.22);pointer-events:none}
.poster::before{width:1700px;height:1700px;left:-980px;top:-420px}
.poster::after{width:1500px;height:1500px;right:-940px;bottom:-560px;border-color:rgba(255,255,255,.16)}

.logo{position:absolute;left:50%;top:54px;transform:translateX(-50%);background:#fff;border-radius:26px;padding:16px 34px 12px;
  box-shadow:0 14px 40px rgba(60,10,70,.28)}
.logo img{display:block;height:104px}

.head{position:absolute;left:0;right:0;top:214px;text-align:center;font-family:var(--hf);text-transform:uppercase;line-height:.86}
.head small{display:block;font-size:66px;font-weight:700;letter-spacing:.2em;margin-right:-.2em}
.head b{display:block;font-size:212px;font-weight:800;font-style:italic;letter-spacing:.005em;margin-top:10px;
  text-shadow:0 8px 30px rgba(70,10,80,.35)}

/* Instagram-style post card */
.post{position:absolute;left:50%;top:498px;width:560px;margin-left:-300px;background:#fff;color:var(--navy);border-radius:30px;
  transform:rotate(-4deg);box-shadow:0 34px 70px rgba(50,5,60,.45);overflow:hidden}
.post header{display:flex;align-items:center;gap:14px;padding:16px 20px}
.av{width:56px;height:56px;border-radius:50%;padding:3px;background:var(--ig);flex:none}
.av span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:#fff;border:2px solid #fff;
  font-family:var(--hf);font-weight:800;font-style:italic;font-size:23px;color:var(--navy);letter-spacing:-.01em}
.av span i{color:#E0162B;font-style:inherit}
.who{font-weight:700;font-size:23px;line-height:1.1}
.who span{display:block;font-weight:500;font-size:16px;color:#6B7B88;margin-top:3px}
.dots{margin-left:auto;display:flex;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--navy)}
.photo{height:360px;background:url(../home-img/v2/hero-arrows-riat23.jpg) 58% 50%/cover}
.acts{display:flex;align-items:center;gap:20px;padding:15px 20px 17px}
.acts svg{width:34px;height:34px;fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts svg.heart{fill:#ED4956;stroke:#ED4956}
.acts svg:last-child{margin-left:auto}

/* follow strip */
.follow{position:absolute;left:54px;right:54px;bottom:54px;background:#fff;color:var(--navy);border-radius:32px;
  display:flex;align-items:center;gap:28px;padding:24px 26px 24px 34px;box-shadow:0 20px 50px rgba(50,5,60,.35)}
.follow .txt{flex:1;min-width:0}
.follow .lbl{font-family:var(--hf);font-weight:700;font-size:28px;letter-spacing:.16em;text-transform:uppercase;color:#D62976}
.follow .at{font-family:var(--hf);font-weight:800;font-size:76px;line-height:1;margin-top:4px;letter-spacing:-.005em;
  background:linear-gradient(90deg,#FA7E1E 0%,#D62976 45%,#962FBF 80%,#4F5BD5 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.follow p{font-size:22px;font-weight:500;color:#4A5A66;margin-top:10px;line-height:1.3}
.qr{flex:none;width:170px;text-align:center}
.qr svg{display:block;width:170px;height:170px}
.qr span{display:block;margin-top:6px;font-family:var(--hf);font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:#6B7B88}

/* camera glyph sticker */
.glyph{position:absolute;right:92px;top:560px;width:150px;height:150px;border-radius:38px;background:#fff;transform:rotate(11deg);
  display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(50,5,60,.4)}
.glyph svg{width:98px;height:98px}
.like{position:absolute;left:66px;top:900px;transform:rotate(-9deg);background:#ED4956;color:#fff;border-radius:22px 22px 22px 4px;
  padding:12px 20px;font-weight:700;font-size:30px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 30px rgba(50,5,60,.4)}
.like svg{width:30px;height:30px;fill:#fff}
</style>
</head>
<body>
<div class="poster">
