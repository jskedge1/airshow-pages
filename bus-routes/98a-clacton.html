<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus 98A, Walton to Clacton | The Big Guide to UK Airshows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --navy:#13293C;--navy-2:#1C3850;--navy-3:#0C1C2A;
  --sky:#00A6E2;--sky-ink:#006F99;--teal:#32B4AF;--teal-ink:#0E5F5B;
  --red:#D74949;--amber:#F2B233;--line:#C6C6C6;--mist:#EEF2F5;--paper:#FFFFFF;--ink:#0B0B0B;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{background:var(--paper);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;font-size:17px;line-height:27px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* top strip */
.strip{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0 0;font-weight:500;font-size:15px}
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--navy);padding:6px 0;border-bottom:2px solid transparent;transition:border-color .3s var(--ease)}
.back:hover{border-color:var(--sky)}
.back svg{width:16px;height:16px}
.op{color:#3d4a55}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:0 48px;align-items:end;padding:26px 0 0}
.blind{position:relative;background:var(--navy-3);border-radius:14px 14px 14px 0;padding:22px 26px 24px;display:flex;align-items:center;gap:22px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(12,28,42,.7)}
.blind::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.55) 1px,transparent 1.3px);background-size:4px 4px;pointer-events:none}
.blind .num{font:800 92px/0.9 "Barlow Condensed",sans-serif;color:var(--amber);letter-spacing:-.01em;text-shadow:0 0 18px rgba(242,178,51,.35)}
.blind .dest{font:700 34px/1 "Barlow Condensed",sans-serif;color:var(--amber);text-transform:uppercase;letter-spacing:.02em;text-shadow:0 0 14px rgba(242,178,51,.3)}
.blind .via{display:block;margin-top:8px;font:600 18px/1.2 "Barlow Condensed",sans-serif;color:#FFE2A3;letter-spacing:.03em;text-transform:uppercase;opacity:1;text-shadow:0 0 10px rgba(242,178,51,.3);transition:opacity .4s var(--ease)}
.intro h1{font:800 46px/46px "Barlow Condensed",sans-serif;color:var(--navy);text-transform:uppercase;letter-spacing:-.005em}
.intro p{margin-top:12px;font-size:18px;line-height:29px;color:#1d2730;max-width:520px}

/* facts */
.facts{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.2fr;margin:34px 0 0;border-top:3px solid var(--navy)}
.fact{padding:14px 18px 16px 0;border-right:1px solid var(--line)}
.fact+.fact{padding-left:18px}
.fact:last-child{border-right:0}
.fact span{display:block;font-weight:500;font-size:15px;line-height:20px;color:var(--navy)}
.fact b{display:block;margin-top:4px;font:700 25px/28px "Barlow Condensed",sans-serif;color:var(--navy)}
.fact.hl b{color:var(--red)}

/* planner */
.planner{margin-top:38px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px 28px;align-items:start}
.planner h2,.sec h2{font:800 30px/32px "Barlow Condensed",sans-serif;color:var(--navy);text-transform:uppercase;grid-column:1/-1}
.seg{display:inline-flex;background:var(--mist);border-radius:12px;padding:5px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 16px;font-weight:600;font-size:16px;color:var(--navy);transition:background .3s var(--ease),color .3s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.board{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.board::-webkit-scrollbar{display:none}
.dep{flex:0 0 auto;min-width:150px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px 11px;transition:border-color .3s var(--ease),background .3s var(--ease),transform .3s var(--ease)}
.dep:hover{border-color:var(--navy);transform:translateY(-2px)}
.dep .t{font:700 28px/30px "Barlow Condensed",sans-serif;color:var(--navy);font-variant-numeric:tabular-nums}
.dep .a{display:block;font-weight:500;font-size:14px;line-height:19px;color:#3d4a55}
.dep[aria-pressed="true"]{background:var(--navy);border-color:var(--navy)}
.dep[aria-pressed="true"] .t{color:var(--amber)}
.dep[aria-pressed="true"] .a{color:#dfe7ee}

/* map stage */
.stage{position:relative;margin-top:20px}
.mapbox{position:relative}
#map{height:640px;border-radius:16px;z-index:0;background:#dfe6ea}
#map .leaflet-tile-pane{filter:saturate(.55) contrast(.95) brightness(1.04)}
.leg{position:absolute;left:16px;bottom:16px;z-index:5;background:#fff;border-radius:10px;padding:8px 12px;display:flex;gap:14px;font-weight:500;font-size:14px;line-height:18px;box-shadow:0 6px 18px -8px rgba(12,28,42,.45)}
.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--navy);background:#fff}
.leg i.r{background:var(--red);border-color:var(--red)}
.leg i.l{width:22px;height:5px;border:0;border-radius:3px;background:var(--sky)}
.panel{position:absolute;top:18px;right:18px;max-height:calc(100% - 36px);width:372px;z-index:5;background:#fff;border-radius:14px;box-shadow:0 22px 44px -20px rgba(12,28,42,.55);display:flex;flex-direction:column;overflow:hidden}
.panel header{background:var(--navy);color:#fff;padding:14px 18px 13px}
.panel header b{display:block;font:700 22px/24px "Barlow Condensed",sans-serif;text-transform:uppercase}
.panel header span{font-weight:500;font-size:14px;line-height:19px;color:#cfdbe5}
.stops{list-style:none;overflow-y:auto;scrollbar-width:none;padding:10px 18px 14px}
.stops::-webkit-scrollbar{display:none}
.stops li{position:relative;padding:5px 0 5px 28px;display:flex;justify-content:space-between;gap:12px;font-size:15px;line-height:21px}
.stops li::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:3px;background:var(--sky)}
.stops li:first-child::before{top:14px}
.stops li:last-child::before{bottom:calc(100% - 14px)}
.stops li::after{content:"";position:absolute;left:2px;top:10px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--sky)}
.stops li.key{font-weight:700;color:var(--navy);padding-top:8px;padding-bottom:8px}
.stops li.key::after{top:12px;left:0;width:15px;height:15px;border:3px solid var(--navy)}
.stops li.off{color:var(--red)}
.stops li.off::after{background:var(--red);border-color:var(--red)}
.stops li.off .tag{display:block;font-weight:500;font-size:13px;line-height:17px;color:var(--red)}
.stops li.stop{cursor:pointer}
.stops li.stop:hover span:first-child,.stops li.active span:first-child{text-decoration:underline;text-decoration-color:var(--sky);text-underline-offset:3px}
.stops li.minor{display:none;color:#2c3944}
.stops li.minor.open{display:flex}
.stops time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sky-ink);white-space:nowrap}
.stops li.key time{color:var(--navy)}
.stops li.off time{color:var(--red)}
.stops li.fold{padding-top:2px;padding-bottom:2px}
.stops li.fold::after{display:none}
.stops li.fold::before{background:repeating-linear-gradient(var(--sky) 0 4px,transparent 4px 8px)}
.stops li.fold button{border:0;background:none;padding:2px 0;font-weight:600;font-size:14px;color:var(--sky-ink);text-align:left}
.stops li.fold button:hover{color:var(--navy)}

/* map bits */
.lbl{background:var(--navy);color:#fff;border:0;border-radius:6px;font:600 13px "Barlow",sans-serif;padding:3px 8px;box-shadow:0 4px 10px -4px rgba(0,0,0,.5)}
.lbl.off{background:var(--red)}
.lbl::before{display:none}
.busdot{width:30px;height:30px;border-radius:50%;background:var(--amber);border:3px solid var(--navy);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -2px rgba(12,28,42,.6);transition:opacity .6s var(--ease)}
.busdot svg{width:15px;height:15px}
.leaflet-popup-content{font:500 15px/21px "Barlow",sans-serif;margin:10px 14px}
.leaflet-popup-content b{color:var(--navy)}

/* roads */
.sec{margin-top:56px}
.journey{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:34px;align-items:start;margin-top:18px}
.legs{list-style:none;counter-reset:none}
.legs li{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.legs li:last-child{border-bottom:1px solid var(--line)}
.signs{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.sign{display:inline-block;font:700 16px/1 "Barlow",sans-serif;padding:5px 7px 4px;border-radius:4px;border:2px solid #111;background:#fff;color:#111;letter-spacing:.01em}
.sign.m{background:#1D5FAD;border-color:#fff;color:#fff;box-shadow:0 0 0 1px #1D5FAD}
.legs b{display:block;font:700 21px/24px "Barlow Condensed",sans-serif;color:var(--navy);text-transform:uppercase}
.legs p{margin-top:3px;font-size:16px;line-height:25px;color:#1d2730}
.side{position:relative;top:-64px}
.advice{background:var(--navy);color:#fff;border-radius:16px 16px 16px 0;padding:24px 24px 22px}
.advice h3{font:700 24px/26px "Barlow Condensed",sans-serif;text-transform:uppercase;color:var(--amber)}
.advice p{margin-top:10px;font-size:16px;line-height:25px;color:#e6edf3}
.advice a.btn{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--amber);color:var(--navy);text-decoration:none;font-weight:700;font-size:15px;padding:10px 16px;border-radius:10px;transition:transform .3s var(--ease),background .3s var(--ease)}
.advice a.btn:hover{transform:translateX(3px);background:#f6c35a}
.alt{margin-top:14px;border:2px solid var(--teal);border-radius:14px;padding:16px 18px}
.alt b{display:block;font:700 20px/22px "Barlow Condensed",sans-serif;color:var(--teal-ink);text-transform:uppercase}
.alt p{margin-top:6px;font-size:15px;line-height:23px}

.note{margin:44px 0 40px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;line-height:21px;color:#3d4a55;max-width:820px}
.note a{color:var(--sky-ink)}

.rise{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rise.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rise{opacity:1;transform:none;transition:none}.dep,.advice a.btn{transition:none}}

@media(max-width:980px){
  .hero{grid-template-columns:1fr;gap:22px}
  .facts{grid-template-columns:1fr 1fr}
  .fact:nth-child(2){border-right:0}
  .fact:nth-child(3){padding-left:0}
  .fact:nth-child(n+3){border-top:1px solid var(--line)}
  .planner{grid-template-columns:1fr}
  #map{height:460px}
  .panel{position:static;width:auto;margin-top:14px;box-shadow:none;border:1px solid var(--line)}
  .stops{max-height:none}
  .journey{grid-template-columns:1fr}
  .side{top:0}
}
@media(max-width:560px){
  .wrap{padding:0 16px}
  .strip{flex-direction:column;align-items:flex-start;gap:0;font-size:14px}
  .op{padding-left:24px;margin-top:-4px}
  .blind{padding:16px 18px;gap:14px}
  .blind .num{font-size:64px}
  .blind .dest{font-size:26px}
  .blind .via{font-size:15px}
  .intro h1{font-size:34px;line-height:36px}
  .intro p{font-size:17px;line-height:27px}
  .fact{padding-right:10px}
  .fact+.fact{padding-left:10px}
  .fact:nth-child(3){padding-left:0}
  .fact b{font-size:21px;line-height:24px}
  #map{height:360px;border-radius:12px}
  .leg{left:auto;right:8px;bottom:auto;top:8px;gap:8px;font-size:12px;padding:6px 8px}
  .legs li{grid-template-columns:1fr;gap:8px}
  .seg{display:flex}
  .seg button{flex:1;padding:10px 8px;font-size:15px}
  .dep{min-width:128px}
}

.pickrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nobus{display:none;margin-top:14px;background:var(--mist);border-left:5px solid var(--red);border-radius:0 12px 12px 0;padding:14px 18px;font-size:16px;line-height:25px}
.nobus.on{display:block}
.boardnote{grid-column:1/-1;font-size:15px;line-height:22px;color:#3d4a55;margin-top:-6px}
.stage.off{opacity:.45;pointer-events:none}

.seg button{white-space:nowrap}
.dep{max-width:300px}
.board{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);padding-right:40px}
.dep .a{white-space:normal}
@media(max-width:560px){.blindwrap{padding:0 0 16px 14px}.roadstrip{margin-top:26px;height:48px}.roadstrip .rbus{top:7px}.roadstrip .lane{font-size:11px}.panel header b{padding-right:84px}.pickrow{display:grid;grid-template-columns:1fr;width:100%}.pickrow .seg{width:100%}.dep{max-width:76vw}}

/* ---------- bus touches ---------- */
/* seat moquette panel behind the destination blind */
.blindwrap{position:relative;padding:0 0 22px 22px}
.moquette{position:absolute;left:0;bottom:0;width:72%;height:78%;border-radius:12px;z-index:0;
  background-color:#13293C;
  background-image:
    radial-gradient(circle at 25% 25%,#32B4AF 0 3px,transparent 3.5px),
    radial-gradient(circle at 75% 75%,#F2B233 0 2.5px,transparent 3px),
    linear-gradient(45deg,transparent 44%,rgba(0,166,226,.45) 44% 56%,transparent 56%),
    linear-gradient(-45deg,transparent 44%,rgba(215,73,73,.35) 44% 56%,transparent 56%);
  background-size:26px 26px,26px 26px,26px 26px,26px 26px}
.blindwrap .blind{z-index:1}
/* the blind rolls to a new destination */
.blind .dest,.blind .via{will-change:transform,opacity}
.blind .roll{animation:roll .55s cubic-bezier(.65,0,.35,1)}
@keyframes roll{0%{transform:translateY(0);opacity:1}45%{transform:translateY(-120%);opacity:0}55%{transform:translateY(120%);opacity:0}100%{transform:translateY(0);opacity:1}}
.blind .ends{display:block;margin-top:6px;font:600 14px/1.2 "Barlow",sans-serif;color:#cfdbe5;opacity:.8;position:relative;z-index:1}

/* the road: tarmac strip with lane markings and a bus that drives along it */
.roadstrip{position:relative;height:54px;margin:34px 0 0;border-radius:10px;overflow:hidden;
  background:#2B343C;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px);background-size:5px 5px}
.roadstrip::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;
  background:repeating-linear-gradient(90deg,#fff 0 34px,transparent 34px 60px);opacity:.8}
.roadstrip::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:2px;background:#F2B233;box-shadow:0 -4px 0 #F2B233}
.roadstrip .lane{position:absolute;left:18px;top:7px;font:800 13px/1 "Barlow",sans-serif;letter-spacing:.32em;color:rgba(255,255,255,.85)}
.roadstrip .rbus{position:absolute;top:9px;left:-120px;width:96px;height:36px;transition:transform 7s cubic-bezier(.45,.05,.35,1)}
.roadstrip.go .rbus{transform:translateX(calc(100vw + 160px))}
.roadstrip .rstop{position:absolute;right:26px;top:4px;width:26px;height:46px}
@media (prefers-reduced-motion:reduce){.roadstrip .rbus{left:42%;transition:none}.roadstrip.go .rbus{transform:none}.blind .roll{animation:none}}

/* departure buttons as bus tickets */
.dep{position:relative;border:0!important;background:#FBF6EA;border-radius:6px;padding:11px 16px 12px 22px;
  box-shadow:inset 0 0 0 1px #E2D7BD;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,transparent 6.5px,#000 7px) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px) right/51% 100% no-repeat;
          mask:radial-gradient(circle 7px at 0 50%,transparent 6.5px,#000 7px) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px) right/51% 100% no-repeat}
.dep::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;border-left:2px dashed #CDBF9E}
.dep:hover{box-shadow:inset 0 0 0 1px var(--navy)}
.dep[aria-pressed="true"]{background:var(--navy);box-shadow:none}
.dep[aria-pressed="true"]::before{border-color:rgba(242,178,51,.55)}

/* stop list header as the bus's next stop display */
.panel header{position:relative;background:#0C1C2A;overflow:hidden}
.panel header::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.5) 1px,transparent 1.3px);background-size:4px 4px;pointer-events:none}
.panel header b{color:var(--amber);text-shadow:0 0 12px rgba(242,178,51,.35);position:relative;z-index:1}
.panel header span{position:relative;z-index:1}
.bell{position:absolute;right:16px;top:14px;z-index:2;display:flex;align-items:center;gap:6px;font:600 13px/1 "Barlow",sans-serif;color:#cfdbe5}
.bell i{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px rgba(215,73,73,.25);animation:bell 2.4s ease-in-out infinite}
@keyframes bell{0%,100%{box-shadow:0 0 0 3px rgba(215,73,73,.25)}50%{box-shadow:0 0 0 6px rgba(215,73,73,.08)}}
@media (prefers-reduced-motion:reduce){.bell i{animation:none}}
.panel header b{padding-right:96px}

/* bus stop flag beside the stop to get off at, and on headings */
.flag{display:inline-block;vertical-align:-3px;width:18px;height:26px;margin-right:6px}
.stops li.off .flag{position:absolute;left:-2px;top:2px;width:18px;height:26px;margin:0}
.stops li.off::after{display:none}
.hflag{display:inline-block;width:22px;height:32px;margin-right:10px;vertical-align:-4px}
.fact.hl b{display:flex;align-items:flex-start;gap:4px}

/* full timetable, laid out like the case at a bus stop */
.ttwrap{grid-column:1/-1}
.ttbtn{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--amber);color:var(--navy);border-radius:10px;padding:10px 16px;font-weight:700;font-size:15px;line-height:20px;transition:transform .3s var(--ease),background .3s var(--ease)}
.ttbtn:hover{transform:translateY(-2px);background:#f6c35a}
.ttbtn svg{width:18px;height:18px;transition:transform .35s var(--ease)}
.ttbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.ttcase{display:none;margin-top:14px;background:var(--navy);border-radius:14px;padding:10px;box-shadow:0 18px 40px -24px rgba(12,28,42,.7)}
.ttcase.on{display:block;animation:ttin .45s var(--ease)}
@keyframes ttin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.tthead{display:flex;align-items:center;gap:12px;padding:6px 8px 12px;color:#fff}
.tthead .br{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:36px;padding:0 8px;border-radius:8px;background:#0C1C2A;color:var(--amber);font:800 24px/1 "Barlow Condensed",sans-serif}
.tthead b{display:block;font:700 21px/23px "Barlow Condensed",sans-serif;text-transform:uppercase}
.tthead span{font-weight:500;font-size:14px;line-height:19px;color:#cfdbe5}
.ttsheet{background:#fff;border-radius:8px;overflow-x:auto;scrollbar-width:none;position:relative}
.ttsheet::-webkit-scrollbar{display:none}
.ttsheet table{border-collapse:separate;border-spacing:0;font-size:15px;line-height:20px}
.ttsheet th{position:sticky;left:0;z-index:2;background:#fff;text-align:left;font-weight:600;color:var(--navy);padding:7px 14px 7px 12px;min-width:170px;max-width:210px;border-right:2px solid var(--navy);white-space:normal}
.ttsheet td{padding:7px 10px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;color:#1d2730;white-space:nowrap;border-left:1px solid #EEF2F5}
.ttsheet tr:nth-child(even) th,.ttsheet tr:nth-child(even) td{background:#F6F8FA}
.ttsheet tr.off th,.ttsheet tr.off td{background:#FCEDED;color:var(--red);font-weight:700}
.ttsheet tr.off th .flag{margin-right:6px}
.ttsheet td.sel{box-shadow:inset 0 0 0 2px var(--amber)}
.ttsheet td.no{color:#b6bec5;font-weight:500}
.tthint{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 8px 4px;font-size:14px;line-height:19px;color:#cfdbe5}

/* ---------- bus company colours (set from CFG.theme) ---------- */
:root{--op1:#13293C;--op2:#F2B233;--opink:#fff;--op3:#F2B233}
.livery{height:10px;margin:14px 0 0;border-radius:5px;background:linear-gradient(100deg,var(--op1) 0 58%,var(--op2) 58% 74%,var(--op3) 74% 84%,var(--op1) 84% 100%)}
.opchip{display:inline-flex;align-items:center;gap:8px;background:var(--op1);color:var(--opink);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600;font-size:15px;line-height:20px}
.opchip i{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--op2) 0 33%,var(--op3) 0 66%,var(--opink) 0);box-shadow:0 0 0 2px var(--op1),0 0 0 3px rgba(255,255,255,.5)}
.facts{border-top-color:var(--op1)}
.busdot{background:var(--op2);border-color:var(--op1)}
.busdot svg rect:first-child{fill:var(--op1)}
.rbus .lv1{fill:var(--op1)}.rbus .lv2{fill:var(--op2)}.rbus .lv3{fill:var(--op3)}

/* times row scroll buttons */
.boardwrap{position:relative;min-width:0}
.bscroll{position:absolute;top:50%;z-index:3;width:38px;height:38px;margin-top:-21px;border-radius:50%;border:0;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -6px rgba(12,28,42,.7);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.bscroll:hover{transform:scale(1.08)}
.bscroll svg{width:16px;height:16px}
.bscroll.l{left:-12px}.bscroll.r{right:-4px}
.bscroll[hidden]{display:none}
.bscroll:disabled{opacity:0;pointer-events:none}

/* next bus after the time now */
.dep .nx{position:absolute;right:10px;top:6px;font:700 11px/1 "Barlow",sans-serif;background:var(--red);color:#fff;border-radius:4px;padding:3px 5px}

/* your stop for the show: a red bus stop sign */
.yourstop{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 28px;align-items:center;margin-top:28px;background:var(--mist);border-radius:16px 16px 16px 0;padding:18px 26px 18px 18px;position:relative;overflow:hidden}
.yourstop::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--amber) 0 18px,transparent 18px 30px);opacity:.7}
.stopsign{width:150px;height:auto;display:block;filter:drop-shadow(0 10px 14px rgba(12,28,42,.25));transform-origin:50% 100%}
.yourstop.in .stopsign{animation:sway 1.6s cubic-bezier(.36,.07,.19,.97) .3s 1}
@keyframes sway{0%{transform:rotate(0)}25%{transform:rotate(-2.2deg)}55%{transform:rotate(1.4deg)}80%{transform:rotate(-.6deg)}100%{transform:rotate(0)}}
.yourstop h2{font:800 30px/32px "Barlow Condensed",sans-serif;color:var(--navy);text-transform:uppercase}
.yourstop .sname{display:block;margin-top:6px;font:700 26px/29px "Barlow Condensed",sans-serif;color:var(--red)}
.yourstop ul{list-style:none;margin-top:10px;display:grid;gap:8px}
.yourstop li{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:24px}
.yourstop li svg{flex:0 0 22px;width:22px;height:22px;margin-top:1px}
.yourstop li b{color:var(--navy)}
@media (prefers-reduced-motion:reduce){.yourstop.in .stopsign{animation:none}}
@media(max-width:560px){.yourstop{grid-template-columns:86px minmax(0,1fr);gap:6px 14px;padding:14px 14px 18px 10px}.stopsign{width:86px}.yourstop h2{font-size:24px;line-height:26px}.yourstop .sname{font-size:21px;line-height:24px}.yourstop li{font-size:15px;line-height:22px}.bscroll{display:none}}

/* map marker for the stop to get off at */
.offpin{width:30px;height:46px}
.offpin svg{width:30px;height:46px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
</style>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var each = function(list, fn){ Array.prototype.forEach.call(list, fn); };
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var KEY = 1, OFF = 2, LABEL = 4;
  var OFFPIN = L.divIcon({ className: 'offpin', iconSize: [30, 46], iconAnchor: [15, 46],
    html: '<svg viewBox="0 0 30 46"><rect x="13.5" y="16" width="3" height="30" fill="#5E6A72"/><rect x="1" y="1" width="28" height="22" rx="4" fill="#D74949" stroke="#fff" stroke-width="2"/><rect x="8" y="5" width="14" height="10" rx="2" fill="#fff"/><rect x="10" y="6.5" width="10" height="3.5" rx="1" fill="#D74949"/><text x="15" y="21" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-weight="800" font-size="5.6" fill="#fff">BUS STOP</text></svg>' });
  var FLAG = '<svg class="flag" viewBox="0 0 18 26" aria-hidden="true"><rect x="8" y="9" width="2" height="17" fill="#13293C"/><rect x="1" y="1" width="16" height="11" rx="2" fill="#fff" stroke="#D74949" stroke-width="2"/><rect x="4.5" y="3.6" width="9" height="5.6" rx="1" fill="#D74949"/><rect x="5.6" y="4.4" width="6.8" height="2" rx=".4" fill="#fff"/></svg>';

  /* fixed text */
  $('backlink').href = CFG.showUrl;
  $('backlink').target = CFG.showTarget || '_top';
  $('backlink').querySelector('span').textContent = 'Back to ' + CFG.showName;
  $('opname').textContent = 'Run by ' + CFG.operator;
  if (CFG.theme) {
    var rs = document.documentElement.style;
    rs.setProperty('--op1', CFG.theme[0]); rs.setProperty('--op2', CFG.theme[1]);
    rs.setProperty('--opink', CFG.theme[2]); rs.setProperty('--op3', CFG.theme[3] || CFG.theme[1]);
  }
  $('bnum').textContent = CFG.num;
  $('title').textContent = CFG.title;
  $('lead').textContent = CFG.lead;
  $('tiph').textContent = CFG.tipHead;
  $('tip').textContent = CFG.tip;
  $('tipbtn').href = CFG.showUrl;
  $('tipbtn').target = CFG.showTarget || '_top';
  $('tipbtn').textContent = CFG.tipBtn + ' ›';
  $('note').innerHTML = CFG.note;
  $('map').setAttribute('aria-label', 'Map of the bus ' + CFG.num + ' route');
  if (CFG.alt) { $('alt').hidden = false; $('alth').textContent = CFG.alt[0]; $('altp').textContent = CFG.alt[1]; }
  document.title = CFG.title + ' | The Big Guide to UK Airshows';

  /* destination blind: shows where the picked direction is going, cycles its "via" line,
     and rolls over like a real blind when the direction changes */
  var vi = 0, VIA = CFG.blindVia, shownDest = null;
  function setBlind(dest, via){
    VIA = via && via.length ? via : CFG.blindVia; vi = 0;
    if (dest === shownDest) return;
    var first = shownDest === null; shownDest = dest;
    var d = $('bdest'), v = $('bvia');
    if (first || reduce) { d.textContent = dest; v.textContent = VIA[0] || ''; return; }
    [d, v].forEach(function(el){ el.classList.remove('roll'); void el.offsetWidth; el.classList.add('roll'); });
    setTimeout(function(){ d.textContent = dest; v.textContent = VIA[0] || ''; }, 260);
  }
  if (!reduce) {
    setInterval(function(){
      if (VIA.length < 2) return;
      var v = $('bvia'); v.style.opacity = 0;
      setTimeout(function(){ vi = (vi + 1) % VIA.length; v.textContent = VIA[vi]; v.style.opacity = 1; }, 400);
    }, 3200);
  }

  $('facts').innerHTML = CFG.facts.map(function(f){
    return '<div class="fact' + (f[2] ? ' ' + f[2] : '') + '"><span>' + f[0] + '</span><b>' + f[1] + '</b></div>';
  }).join('');

  $('legs').innerHTML = CFG.legs.map(function(l){
    var signs = l[0].map(function(r){ return '<span class="sign' + (/^M\d/.test(r) ? ' m' : '') + '">' + r + '</span>'; }).join('');
    return '<li><div class="signs">' + (signs || '<span class="sign">Local</span>') + '</div><div><b>' + l[1] + '</b><p>' + l[2] + '</p></div></li>';
  }).join('');

  /* map */
  var map = L.map('map', { scrollWheelZoom: false, zoomControl: false });
  L.control.zoom({ position: 'topleft' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  map.setView(CFG.target, 11);
  var lineLayer = L.layerGroup().addTo(map), layer = L.layerGroup().addTo(map);
  var showPin = L.circleMarker(CFG.target, { radius: 6, color: '#D74949', weight: 2, fillColor: '#fff', fillOpacity: 1, dashArray: '3 3' })
    .bindTooltip(CFG.targetLabel, { direction: 'top', offset: [0, -6], className: 'lbl off' }).addTo(map);

  var day = DATA.start || 0, dir = 0, idx = 0, ROUTE = [], casing = null;
  window.addEventListener('resize', function(){ map.invalidateSize(); });

  function fit(){
    if (!casing) return;
    var wide = window.innerWidth > 980;
    map.fitBounds(casing.getBounds().extend(CFG.target), { paddingTopLeft: [30, 30], paddingBottomRight: [wide ? 420 : 30, 30] });
  }

  /* unpack journeys: [time, stop index, flags] -> [time, name, lat, lon, flags, short name] */
  DATA.days.forEach(function(dd){ dd.dirs.forEach(function(x){ x.trips.forEach(function(tr){
    tr.s = tr.s.map(function(p){ var st = DATA.stops[p[1]]; return [p[0], st[0], st[1], st[2], p[2], st[3]]; });
  }); }); });
  function D(){ return DATA.days[day]; }
  function DIR(){ return D().dirs[dir]; }

  function segBtns(el, items, cur, onpick){
    el.innerHTML = items.map(function(t, i){ return '<button type="button" data-i="' + i + '" aria-pressed="' + (i === cur) + '">' + t + '</button>'; }).join('');
    el.style.display = items.length > 1 ? '' : 'none';
    each(el.children, function(b){ b.addEventListener('click', function(){ onpick(+b.getAttribute('data-i')); }); });
  }

  function render(){
    segBtns($('day'), DATA.days.map(function(d){ return d.label; }), day, function(i){ day = i; dir = Math.min(dir, Math.max(0, DATA.days[i].dirs.length - 1)); idx = 0; render(); runBus(); });
    var dd = D();
    if (!dd.dirs.length || !dd.dirs.some(function(x){ return x.trips.length; })) {
      setBlind(CFG.blindDest, CFG.blindVia);
      $('ttbtn').parentNode.style.display = 'none';
      $('dir').style.display = 'none'; $('board').innerHTML = ''; $('bnote').textContent = '';
      $('nobus').textContent = dd.none; $('nobus').classList.add('on'); $('stage').classList.add('off');
      return;
    }
    $('nobus').classList.remove('on'); $('stage').classList.remove('off');
    if (!DIR().trips.length) { dir = dd.dirs.findIndex(function(x){ return x.trips.length; }); idx = 0; }
    segBtns($('dir'), dd.dirs.map(function(d){ return d.label; }), dir, function(i){ dir = i; idx = 0; render(); runBus(); });
    var cur = DIR(); setBlind(cur.blind || CFG.blindDest, cur.via);
    board(); drawLine(); draw(); table();
  }

  /* every time that day, at the main stops */
  var ttOpen = false;
  $('ttbtn').addEventListener('click', function(){
    ttOpen = !ttOpen; $('ttbtn').setAttribute('aria-expanded', ttOpen); $('ttcase').classList.toggle('on', ttOpen); table();
  });
  function table(){
    var d = DIR(), tt = d && d.tt;
    $('ttbtn').parentNode.style.display = tt ? '' : 'none';
    if (!tt) return;
    $('ttlbl').textContent = (ttOpen ? 'Hide the times for ' : 'See every time on ') + D().label;
    if (!ttOpen) return;
    $('ttnum').textContent = CFG.num;
    $('tttitle').textContent = d.label + ', ' + D().label;
    $('ttsub').textContent = tt.cols.length + (tt.cols.length === 1 ? ' bus' : ' buses') + ' that day, shown at the main stops';
    var picked = d.trips[idx] ? d.trips[idx].s[0][0] : null;
    var html = '<table><tbody>' + tt.rows.map(function(name, r){
      return '<tr' + (r === tt.off ? ' class="off"' : '') + '><th scope="row">' + (r === tt.off ? FLAG : '') + name + '</th>' +
        tt.cols.map(function(c){
          var v = c[r], sel = picked && c[0] === picked;
          return '<td class="' + (v ? '' : 'no') + (sel ? ' sel' : '') + '">' + (v || '•') + '</td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody></table>';
    $('ttsheet').innerHTML = html;
    var sh = $('ttsheet');
    $('tthint').textContent = sh.scrollWidth > sh.clientWidth + 4 ? 'Swipe or scroll sideways for later buses' : 'A dot means the bus doesn’t stop there';
  }

  function arrows(){
    var b = $('board'), over = b.scrollWidth > b.clientWidth + 4;
    $('bl').hidden = $('br').hidden = !over;
    $('bl').disabled = b.scrollLeft < 8;
    $('br').disabled = b.scrollLeft + b.clientWidth >= b.scrollWidth - 8;
  }
  $('bl').addEventListener('click', function(){ $('board').scrollBy({ left: -Math.max(240, $('board').clientWidth * .7), behavior: reduce ? 'auto' : 'smooth' }); });
  $('br').addEventListener('click', function(){ $('board').scrollBy({ left: Math.max(240, $('board').clientWidth * .7), behavior: reduce ? 'auto' : 'smooth' }); });
  $('board').addEventListener('scroll', arrows, { passive: true });
  window.addEventListener('resize', arrows);

  /* the next bus after the time now, when today is the picked day */
  function nextIndex(){
    var days = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
    var now = new Date();
    try { var p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now);
      var wd = p.filter(function(x){ return x.type === 'weekday'; })[0].value.toLowerCase().slice(0, 3);
      var hm = (+p.filter(function(x){ return x.type === 'hour'; })[0].value) * 60 + (+p.filter(function(x){ return x.type === 'minute'; })[0].value);
    } catch (e) { return -1; }
    if (D().key !== wd) return -1;
    var tr = DIR().trips;
    for (var i = 0; i < tr.length; i++) { var t = tr[i].big.split(':'); if (+t[0] * 60 + +t[1] >= hm) return i; }
    return -1;
  }

  function board(){
    var d = DIR(), nx = nextIndex();
    $('board').innerHTML = d.trips.map(function(t, i){
      return '<button type="button" class="dep" aria-pressed="' + (i === idx) + '" data-i="' + i + '">' + (i === nx ? '<span class="nx">Next</span>' : '') + '<span class="t">' + t.big + '</span><span class="a">' + t.small + '</span></button>';
    }).join('');
    $('bnote').textContent = d.note || '';
    each($('board').children, function(b){ b.addEventListener('click', function(){ idx = +b.getAttribute('data-i'); var sl = $('board').scrollLeft; board(); $('board').scrollLeft = sl; draw(); table(); }); });
    setTimeout(arrows, 30);
  }

  function drawLine(){
    lineLayer.clearLayers();
    ROUTE = DATA.lines[DIR().li] || [];
    casing = L.polyline(ROUTE, { color: '#13293C', weight: 11, opacity: .18 }).addTo(lineLayer);
    L.polyline(ROUTE, { color: (CFG.theme && CFG.theme[0]) || '#00A6E2', weight: 5, opacity: 1 }).addTo(lineLayer);
    fit(); measure();
  }

  function draw(){
    layer.clearLayers();
    var trip = DIR().trips[idx], s = trip.s, ol = $('stops');
    $('ptitle').textContent = trip.title;
    var oi = -1; s.forEach(function(p, i){ if (p[4] & OFF) oi = i; });
    function mm(x){ var a = x.split(':'); return +a[0] * 60 + +a[1]; }
    var ride = mm(s[s.length - 1][0]) - mm(s[0][0]);
    $('psub').textContent = s.length + ' stops, ' + s[0][0] + ' to ' + s[s.length - 1][0] + ', ' + ride + ' minutes';
    if (oi >= 0) {
      var o = s[oi];
      $('ysname').textContent = o[1];
      if (oi > 0 && oi < s.length - 1 || oi === s.length - 1) {
        $('ysbelltxt').innerHTML = oi > 0 ? 'Press the bell once you pass <b>' + s[oi - 1][1] + '</b>, so the driver knows to stop.' : 'This is where the bus sets off.';
        $('yswalk').textContent = CFG.walkLine;
        $('ysride').textContent = trip.title + ' gets here at ' + o[0] + ', ' + (mm(o[0]) - mm(s[0][0])) + ' minutes after it sets off.';
      }
      if (oi === 0) {
        $('ysbelltxt').innerHTML = 'Catch the bus here after the show. Wave to the driver as it comes in, so they know to stop.';
        $('yswalk').textContent = CFG.walkBack;
        $('ysride').textContent = 'This bus leaves here at ' + o[0] + ' and gets to ' + s[s.length - 1][1] + ' at ' + s[s.length - 1][0] + '.';
      }
    }
    ol.innerHTML = '';
    var group = null, gid = 0;
    s.forEach(function(p, i){
      var isOff = p[4] & OFF, key = (p[4] & KEY) || isOff || i === 0 || i === s.length - 1;
      var m = isOff ? L.marker([p[2], p[3]], { icon: OFFPIN, zIndexOffset: 1000 }).addTo(layer) : L.circleMarker([p[2], p[3]], {
        radius: key ? 6 : 4, color: '#13293C', weight: key ? 3 : 2, fillColor: '#FFFFFF', fillOpacity: 1
      }).addTo(layer);
      m.bindPopup('<b>' + p[1] + '</b><br>' + p[0] + (isOff ? '<br>' + CFG.offTag : ''));
      var small = window.innerWidth < 560 && !isOff && i !== 0 && i !== s.length - 1;
      if ((p[4] & LABEL || isOff) && !small) m.bindTooltip(p[5] || p[1], { permanent: true, direction: 'right', offset: isOff ? [14, -26] : [10, 0], className: 'lbl' + (isOff ? ' off' : '') });

      if (!key) {
        if (!group) {
          group = { id: 'g' + (gid++), items: [] };
          var fl = document.createElement('li'); fl.className = 'fold';
          fl.innerHTML = '<button type="button" aria-expanded="false"></button>';
          ol.appendChild(fl); group.fold = fl;
        }
        group.items.push(p);
      } else { closeGroup(); }

      var li = document.createElement('li');
      li.className = 'stop' + (key ? ' key' : ' minor') + (isOff ? ' off' : '');
      if (!key) li.dataset.g = group.id;
      li.innerHTML = (isOff ? FLAG : '') + '<span>' + p[1] + (isOff ? '<span class="tag">' + CFG.offTag + '</span>' : '') + '</span><time>' + p[0] + '</time>';
      li.addEventListener('click', function(){
        each(ol.querySelectorAll('.active'), function(x){ x.classList.remove('active'); });
        li.classList.add('active');
        map.setView([p[2], p[3]], 15, { animate: !reduce }); m.openPopup();
      });
      ol.appendChild(li);
    });
    closeGroup();

    function closeGroup(){
      if (!group) return;
      var g = group, n = g.items.length, btn = g.fold.firstChild;
      var label = n === 1 ? g.items[0][1] : g.items[0][1] + ' and ' + (n - 1) + ' more stops';
      btn.textContent = label;
      btn.addEventListener('click', function(){
        var open = btn.getAttribute('aria-expanded') !== 'true';
        btn.setAttribute('aria-expanded', open);
        btn.textContent = open ? 'Hide the smaller stops' : label;
        each(ol.querySelectorAll('li.minor[data-g="' + g.id + '"]'), function(x){ x.classList.toggle('open', open); });
      });
      group = null;
    }
  }

  /* a small bus runs the route once, then fades */
  var bus = null, raf = 0, cum = [0];
  var busIcon = L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15],
    html: '<div class="busdot"><svg viewBox="0 0 16 16" fill="#13293C"><rect x="2" y="1.5" width="12" height="11" rx="2"/><rect x="3.5" y="3" width="9" height="4" rx=".6" fill="#F2B233"/><circle cx="5" cy="10" r="1" fill="#F2B233"/><circle cx="11" cy="10" r="1" fill="#F2B233"/><rect x="3" y="12.5" width="2.4" height="2" rx=".5"/><rect x="10.6" y="12.5" width="2.4" height="2" rx=".5"/></svg></div>' });
  function measure(){
    cum = [0];
    for (var k = 1; k < ROUTE.length; k++) cum.push(cum[k - 1] + map.distance(ROUTE[k - 1], ROUTE[k]));
  }
  function at(d){
    var lo = 0, hi = cum.length - 1;
    while (lo < hi - 1) { var mid = (lo + hi) >> 1; if (cum[mid] < d) lo = mid; else hi = mid; }
    var f = (d - cum[lo]) / ((cum[hi] - cum[lo]) || 1);
    return [ROUTE[lo][0] + (ROUTE[hi][0] - ROUTE[lo][0]) * f, ROUTE[lo][1] + (ROUTE[hi][1] - ROUTE[lo][1]) * f];
  }
  function runBus(){
    if (reduce || ROUTE.length < 2) return;
    cancelAnimationFrame(raf);
    if (bus) { map.removeLayer(bus); bus = null; }
    var total = cum[cum.length - 1], start = null, dur = 7000;
    bus = L.marker(ROUTE[0], { icon: busIcon, interactive: false, keyboard: false }).addTo(map);
    function step(ts){
      if (!bus) return;
      if (!start) start = ts;
      var p = Math.min((ts - start) / dur, 1), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      bus.setLatLng(at(e * total));
      if (p < 1) raf = requestAnimationFrame(step);
      else { var el = bus.getElement(); if (el) el.firstChild.style.opacity = 0; var b = bus; setTimeout(function(){ map.removeLayer(b); }, 700); bus = null; }
    }
    raf = requestAnimationFrame(step);
  }

  render();

  var started = false;
  var io = 'IntersectionObserver' in window ? new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (!e.isIntersecting) return;
      e.target.classList.add('in'); io.unobserve(e.target);
      if (!started && e.target.id === 'stage') { started = true; setTimeout(runBus, 500); }
    });
  }, { threshold: .15 }) : null;
  each(document.querySelectorAll('.rise'), function(el){ io ? io.observe(el) : el.classList.add('in'); });
  var strip = document.querySelector('.roadstrip');
  if (strip && 'IntersectionObserver' in window) {
    new IntersectionObserver(function(es, o){ es.forEach(function(e){ if (e.isIntersecting) { setTimeout(function(){ strip.classList.add('go'); }, 300); o.disconnect(); } }); }, { threshold: .6 }).observe(strip);
  } else if (strip) strip.classList.add('go');
  if (!io) runBus();
})();
</script>
<!-- mobile-fit: keeps every part of the page inside the screen on phones and tablets. Same block in every page and template. -->
<style id="mobile-fit">
  img,video,iframe,canvas{max-width:100%}
  h1,h2,h3,h4,p,li,dd,dt,td,th,a,button,figcaption,label{overflow-wrap:break-word}
  /* grid and flex children may shrink below their longest word instead of pushing the page wider */
  .hero2-body>*,.hero2-side,.hero2-side dl,.hero2-side dl>div,.hero2-side dd,.btn-row>*,.jump.boxes>*,.reveal,.lu-fwrap{min-width:0}
  @media (max-width:760px){
    .hero2-body{grid-template-columns:minmax(0,1fr)!important}
    .btn-row{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:600px){
    .hero2 h1{font-size:clamp(30px,10.4vw,44px)!important;line-height:1.02}
    .hero2-side dl>div{grid-template-columns:minmax(min-content,34%) minmax(0,1fr)!important}
    .hero2-side dt{overflow-wrap:normal}
  }
  @media (max-width:440px){
    .jump.boxes{grid-template-columns:minmax(0,1fr)!important}
    .jump.boxes strong{font-size:22px}
    .lu .lu-key ul{grid-template-columns:minmax(0,1fr)!important}
  }
  /* drawings with labels: when the space is too narrow they keep a readable size and slide sideways instead of shrinking */
  .mf-pan{position:relative;min-width:0;max-width:100%}
  .mf-pan-hint{display:none}
  .mf-pan.mf-on .mf-pan-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
  .mf-pan.mf-on .mf-pan-scroll::-webkit-scrollbar{display:none}
  .mf-pan.mf-on .mf-pan-scroll>svg{min-width:var(--mf-min,560px)}
  .mf-pan.mf-on .mf-pan-hint{display:flex;align-items:center;gap:8px;margin:8px 0 0;font:500 14px/20px "Barlow",sans-serif;color:inherit;opacity:.85;transition:opacity .4s ease}
  .mf-pan-hint svg{width:22px!important;height:12px!important;flex:none;display:inline-block!important;background:none!important;min-width:0!important}
  .mf-pan.mf-on .mf-pan-hint.mf-light,.pmap-fig .mf-pan.mf-on .mf-pan-hint{color:#D8E3EC;padding:0 6px}
  .mf-pan.mf-seen .mf-pan-hint{opacity:.55}
  .layout>*,.layout-map,.layout-text,.pmap-fig,.sg-sec{min-width:0}
  /* comfortable tap sizes on touch screens */
  @media (pointer:coarse){
    .more-link,.clear,#gtFullMap,a.back,a.more,button.more{min-height:40px!important;display:inline-flex;align-items:center}
  }
</style>
<script id="mobile-fit-js">
(function(){
  /* labelled drawings (sun guide, site layouts, photo maps) slide sideways on phones so their labels stay readable */
  function panify(){
    var list=document.querySelectorAll('.sg-sec svg.view, .layout-map > svg, .pmap-fig > svg, svg[data-pan]');
    [].forEach.call(list,function(svg){
      if(svg.closest('.mf-pan')) return;
      var vb=(svg.getAttribute('viewBox')||'').split(/[\s,]+/).map(Number);
      if(vb.length!==4 || vb[2]<300) return;
      var smallest=99;
      [].forEach.call(svg.querySelectorAll('text'),function(t){
        var fs=parseFloat(getComputedStyle(t).fontSize); if(fs&&fs<smallest) smallest=fs;
      });
      if(smallest===99) smallest=14;
      /* width at which the smallest label renders at about 10px, kept between 520 and 820 */
      var min=Math.round(Math.max(520,Math.min(820,vb[2]*10/smallest)));
      var pan=document.createElement('div'); pan.className='mf-pan';
      var sc=document.createElement('div'); sc.className='mf-pan-scroll'; sc.style.setProperty('--mf-min',min+'px');
      svg.parentNode.insertBefore(pan,svg); sc.appendChild(svg); pan.appendChild(sc);
      var hint=document.createElement('p'); hint.className='mf-pan-hint';
      hint.innerHTML='<svg viewBox="0 0 22 12" aria-hidden="true"><path d="M1 6h20M5 2L1 6l4 4M17 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Swipe sideways to see the whole drawing';
      pan.appendChild(hint);
      if(onDark(pan)) hint.classList.add('mf-light');
      pan._min=min;
      sc.addEventListener('scroll',function(){ if(sc._auto){sc._auto=false;return;} pan.classList.add('mf-seen');},{passive:true});
    });
  }
  /* light hint text when the drawing sits on a dark panel */
  function onDark(el){
    for(var p=el;p&&p!==document.documentElement;p=p.parentElement){
      var m=getComputedStyle(p).backgroundColor.match(/[\d.]+/g);
      if(m && (m.length<4 || +m[3]>0.5)) return (0.299*m[0]+0.587*m[1]+0.114*m[2])<110;
    }
    return false;
  }
  function centre(sc){ var x=(sc.scrollWidth-sc.clientWidth)/2; if(x>0 && Math.abs(sc.scrollLeft-x)>1){ sc._auto=true; sc.scrollLeft=x; } }
  /* turn sliding on only where the drawing would otherwise render too small to read */
  function measure(){
    [].forEach.call(document.querySelectorAll('.mf-pan'),function(pan){
      var w=pan.clientWidth; if(!w) return;
      pan.classList.toggle('mf-on', w < pan._min*0.92);
    });
  }
  function recentre(){ measure(); [].forEach.call(document.querySelectorAll('.mf-pan.mf-on:not(.mf-seen) .mf-pan-scroll'),centre); }
  /* boxes laid out in a grid may shrink below their longest line instead of pushing the page wider */
  function gridKids(){
    [].forEach.call(document.body.getElementsByTagName('*'),function(el){
      var d=getComputedStyle(el).display;
      if(d!=='grid' && d!=='inline-grid') return;
      [].forEach.call(el.children,function(c){ if(getComputedStyle(c).minWidth==='auto') c.style.minWidth='0'; });
    });
  }
  function init(){ gridKids(); panify(); recentre(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
  window.addEventListener('load',function(){panify();recentre();});
  /* sections opened later become visible: centre their drawings when they appear */
  document.addEventListener('click',function(){ setTimeout(recentre,450); },true);
  window.addEventListener('resize',recentre);
})();
</script>
