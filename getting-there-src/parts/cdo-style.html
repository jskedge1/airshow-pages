<style>
.cdo{background:#fff;box-shadow:0 2px 14px rgba(19,41,60,.09);padding:28px 30px;margin:28px 0;font-family:Barlow,system-ui,sans-serif;color:#13293C}
.cdo h3{margin:0;font-family:'Barlow',Barlow,sans-serif;font-weight:800;font-size:40px;line-height:1.05;color:#D74949}
.cdo-intro{margin:6px 0 14px;font-size:16px;line-height:1.55;color:#3F5263;max-width:720px}
.cdo-row{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) 90px;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid #DDE3E8}
.cdo-name{font-family:'Barlow',Barlow,sans-serif;font-weight:800;font-size:22px;line-height:1.1;text-transform:none}
.cdo-name small{display:block;font-family:Barlow,sans-serif;font-weight:500;font-size:14px;text-transform:none;color:#3F5263;margin-top:3px}
.cdo-track{height:14px;background:#ECEEF0;overflow:hidden}
.cdo-track i{display:block;height:14px;width:0;background:var(--c);transition:width 1s cubic-bezier(.2,.7,.2,1)}
.cdo.in .cdo-track i{width:var(--w)}
.cdo-cost{text-align:right;font-weight:700;font-size:21px}
.cdo-note{margin:12px 0 0;font-size:14px;line-height:1.5;color:#3F5263}
@media (max-width:700px){.cdo{padding:22px 18px}.cdo h3{font-size:32px}.cdo-row{grid-template-columns:minmax(0,1fr) 80px;gap:8px 14px}.cdo-track{grid-column:1/-1;grid-row:2}}
@media (prefers-reduced-motion:reduce){.cdo-track i{transition:none}}
</style>
