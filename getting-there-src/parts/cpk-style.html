<style>
.cpk{margin:28px 0;font-family:Barlow,system-ui,sans-serif;color:#13293C}
.cpk-head{background:#13293C;padding:28px 30px}
.cpk-head h3{margin:0;font-family:'Barlow',Barlow,sans-serif;font-weight:800;font-size:44px;line-height:1.05;color:#fff}
.cpk-head p{margin:8px 0 0;font-size:17px;line-height:1.55;color:#C9D6E0;max-width:760px}
.cpk-board{background:#fff;box-shadow:0 2px 12px rgba(19,41,60,.08)}
.cpk-th,.cpk-r{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr)}
.cpk-th{background:#0E2131;color:#fff;font-weight:600;font-size:15px}
.cpk-th span{padding:11px 22px}
.cpk-r{min-height:68px;border-bottom:2px solid #DDE3E8;transition:transform .25s ease}
.cpk-r:hover{transform:translateX(4px)}
.cpk-r i{background:var(--c)}
.cpk-n{background:#ECEEF0;display:flex;align-items:center;padding:10px 22px;font-weight:500;font-size:21px;line-height:1.25}
.cpk-v{background:var(--bg,#fff);display:flex;align-items:center;padding:10px 22px;font-weight:600;font-size:18px;line-height:1.35}
.cpk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px}
.cpk-box{background:#fff;padding:22px;box-shadow:0 2px 12px rgba(19,41,60,.08);transition:transform .25s ease,box-shadow .25s ease}
.cpk-box:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(19,41,60,.14)}
.cpk-box h4{margin:0 0 6px;font-weight:700;font-size:24px;color:#000}
.cpk-box p{margin:0 0 10px;font-size:16px;line-height:1.5}
.cpk-t{border-top:2px solid #13293C}
.cpk-t div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #D5DBE0;font-size:15px}
.cpk-t b{text-align:right}
.cpk-box small{display:block;margin-top:10px;font-size:14px;line-height:1.45;color:#3F5263}
@media (max-width:900px){.cpk-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.cpk-head{padding:22px 18px}.cpk-head h3{font-size:34px}.cpk-th,.cpk-r{grid-template-columns:14px minmax(0,1fr)}.cpk-th span:last-child{display:none}.cpk-r i{grid-row:1/3}.cpk-n{padding:12px 16px 2px;background:#fff}.cpk-v{padding:2px 16px 12px;font-size:16px}}
@media (prefers-reduced-motion:reduce){.cpk-r,.cpk-box{transition:none}.cpk-r:hover,.cpk-box:hover{transform:none}}
</style>
