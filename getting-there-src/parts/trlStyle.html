<style id="trlStyle">
#explore .xd-content.trl{--trc:#2F3238;--trd:#23272B;--trk:#17181A;--trr:#D2232A;--tra:#F2B233}
#explore .xd-content.trl .tr-box,#explore .xd-content.trl>.xd-title,#explore .xd-content.trl>.ft-stats,#explore .xd-content.trl>.xd-blindbar{display:none!important}
.trl-hero{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:center;padding:34px 30px 30px;background-color:#2F3238;background-image:linear-gradient(45deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.035) 75%),linear-gradient(-45deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.035) 75%);background-size:22px 22px;border-bottom:4px solid #D2232A;font-family:Barlow,system-ui,sans-serif;color:#fff}
.trl-tag{display:inline-block;background:#D2232A;color:#fff;font:600 13px/1 Barlow,sans-serif;padding:7px 10px;margin-bottom:14px}
.trl-hero h3,#explore .xd-content.trl .trl-hero h3{margin:0 0 12px!important;font:800 54px/.95 'Barlow',Barlow,sans-serif!important;color:#fff!important;text-transform:none!important;letter-spacing:0}
.trl-hero h3 span{color:#FF8A8A}
.trl-hero p{margin:0;font-size:16px;line-height:1.65;color:#DCE1E5}
.trl-board{background:#050607;border-top:3px solid #F2B233;padding:14px 16px 12px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.trl-board b{display:block;font:800 40px/1 'Barlow',Barlow,sans-serif;color:#F2B233;letter-spacing:0}
.trl-board b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trl-board b span{font-size:20px;margin-left:8px}
.trl-board small{display:block;margin-top:6px;font:600 12px/1.3 'Barlow',Barlow,sans-serif;color:#F2B233;opacity:.85;letter-spacing:0;text-transform:none}
.trl-kd{margin-top:10px;background:#23272B;border-top:3px solid #D2232A}
.trl-kd h4,#explore .xd-content.trl .trl-kd h4{margin:0!important;padding:12px 16px 6px!important;font:800 18px/1 'Barlow',Barlow,sans-serif!important;color:#FF8A8A!important;text-transform:none!important;border:0!important;background:none!important}
.trl-kd div{display:flex;justify-content:space-between;gap:12px;padding:9px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:14px;color:#C9CFD4}
.trl-kd div span{white-space:nowrap}.trl-kd div b{color:#fff;text-align:right;font-weight:700}
.trl-kd div.hl b{background:#D2232A;padding:2px 8px}
.trl-jr{background:#1B1E21;padding:18px 30px 22px;font-family:Barlow,system-ui,sans-serif;color:#fff}
.trl-jr-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:-18px -30px 22px;padding:14px 30px;background:#D2232A;font-size:15px;color:#FFFFFF}
.trl-jr-h b{font:800 22px/1 'Barlow',Barlow,sans-serif;color:#FFFFFF;text-transform:none}
.trl-line{position:relative;display:flex;justify-content:space-between;align-items:flex-start}
.trl-line:before{content:"";position:absolute;left:14px;right:14px;top:12px;height:6px;background:#D2232A;transform:scaleX(0);transform-origin:left;transition:transform 1.4s cubic-bezier(.22,.61,.36,1)}
.trl.in-view .trl-line:before{transform:scaleX(1)}
.trl-stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:160px;text-align:center}
.trl-stop i{width:30px;height:30px;border-radius:50%;background:#D2232A;box-shadow:inset 0 0 0 5px #fff;border:3px solid #D2232A;box-sizing:border-box}
.trl-stop b{font:800 16px/1.1 'Barlow',Barlow,sans-serif;text-transform:none}
.trl-stop small{font-size:13px;color:#C9CFD4}
.trl-mid{position:absolute;left:50%;top:26px;transform:translateX(-50%);text-align:center;font:600 13px/1.3 Barlow,sans-serif;color:#fff}
.trl-go{display:flex;align-items:stretch;margin:0;background:#D2232A;color:#fff!important;text-decoration:none!important;font-family:Barlow,sans-serif;transition:background .3s ease}
.trl-go:hover{background:#B51C22}
.trl-go span{flex:1;padding:14px 20px}
.trl-go b{display:block;font:800 22px/1.1 'Barlow',Barlow,sans-serif;text-transform:none}
.trl-go small{display:block;font-size:14px;opacity:.9}
.trl-go i{display:flex;align-items:center;justify-content:center;width:64px;font-style:normal;font-size:24px;background:rgba(0,0,0,.18);transition:padding .3s ease}
.trl-go:hover i{padding-left:10px}
#explore .xd-content.trl>.ft-tabs{background:#2F3238!important;border:0!important;padding:0 10px!important;gap:0!important;box-shadow:none!important}
#explore .xd-content.trl>.ft-tabs button{background:transparent!important;color:#fff!important;border:0!important;border-bottom:4px solid transparent!important;border-radius:0!important;padding:14px 16px!important;font:600 15px/1.2 Barlow,sans-serif!important;box-shadow:none!important}
#explore .xd-content.trl>.ft-tabs button[aria-selected="true"],#explore .xd-content.trl>.ft-tabs button:hover{border-bottom-color:#D2232A!important;background:rgba(255,255,255,.06)!important}
#travel #explore .xd-content.trl>.xd-sec>h4{position:relative;padding-left:18px!important;font:800 34px/1 'Barlow',Barlow,sans-serif!important;color:#2F3238!important;text-transform:none!important;border:0!important;background:none!important}
#explore .xd-content.trl>.xd-sec>h4:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:#D2232A}
@media (max-width:860px){.trl-hero{grid-template-columns:minmax(0,1fr);padding:26px 18px}.trl-hero h3{font-size:42px!important}.trl-jr{padding:16px 18px 20px}.trl-jr-h{margin:-16px -18px 20px;padding:12px 18px}.trl-stop{width:110px}#explore .xd-content.trl>.ft-tabs{overflow-x:auto;flex-wrap:nowrap!important}#explore .xd-content.trl>.ft-tabs button{white-space:nowrap}}
@media (prefers-reduced-motion:reduce){.trl-line:before{transition:none;transform:none}.trl-go,.trl-go i{transition:none}}
</style>
