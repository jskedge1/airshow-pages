<script>
(function(){var s=document.getElementById('cdo');if(!s)return;
 if(!('IntersectionObserver' in window)){s.classList.add('in');return;}
 var o=new IntersectionObserver(function(e){e.forEach(function(x){if(x.isIntersecting){s.classList.add('in');o.disconnect();}});},{threshold:.25});o.observe(s);
 setTimeout(function(){if(!s.classList.contains('in')&&s.offsetParent)s.classList.add('in');},4000);})();
</script>
