<!-- Poster information boxes (pier sign design, 8 Nov 2026): three tabs, four white boxes each -->
<style>
.pbx{max-width:1200px;margin:40px auto 8px;padding:0 24px;box-sizing:border-box;font-family:"Barlow",sans-serif;color:#0B0F14}
.pbx *{box-sizing:border-box}
.pbx-in{background:#E6E8EA;box-shadow:0 14px 34px rgba(19,41,60,.14)}
.pbx-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 20px;padding:12px 22px;background:#0B0F14;color:#fff}
.pbx-bar b{font-weight:700;font-size:22px}
.pbx-bar span{font-size:14px;color:#C9D6E0}
.pbx-band{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 20px;padding:12px 22px;background:#6950A1;color:#fff}
.pbx-band b{font-weight:700;font-size:28px;line-height:1.1}
.pbx-band span{font-weight:300;font-size:28px;line-height:1.1}
.pbx-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#D3D8DC;padding:12px 22px 0}
.pbx-tab{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;min-height:66px;padding:10px 18px;cursor:pointer;background:#fff;color:#13293C;box-shadow:inset 0 6px 0 var(--c),inset -1px 0 0 #D3D8DC;transition:transform .25s cubic-bezier(.2,.7,.2,1),background .25s ease}
.pbx-tab:hover{transform:translateY(-3px)}
.pbx-tab:focus-visible{outline:3px solid #32B4AF;outline-offset:2px}
.pbx-tab i{flex:none;width:14px;height:14px;border-radius:50%;background:var(--c)}
.pbx-tab b{display:block;font-weight:700;font-size:18px;line-height:1.1}
.pbx-tab small{display:block;font-weight:500;font-size:13px;color:#3E4A54;margin-top:2px}
.pbx-tab[aria-selected="true"]{background:#13293C;color:#fff;box-shadow:inset 0 6px 0 var(--c)}
.pbx-tab[aria-selected="true"] i{background:#fff}
.pbx-tab[aria-selected="true"] small{color:#C9D6E0}
.pbx-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;padding:24px 22px 26px}
.pbx-box{background:#fff;padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 12px rgba(19,41,60,.06);transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s ease}
.pbx-box:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(19,41,60,.14)}
.pbx-box h4{margin:0!important;padding:0!important;border:0!important;font:800 34px/34px "Barlow","Barlow",sans-serif!important;color:#0B0F14!important;text-transform:none!important;letter-spacing:0!important}
.pbx-box p{margin:0!important;font-size:15px!important;line-height:22px!important;color:#0B0F14!important}
.pbx-box .pbx-note{margin-top:auto!important;padding-top:10px;font-size:13px!important;line-height:18px!important;color:#3E4A54!important}
.pbx-th{display:flex;justify-content:space-between;gap:10px;padding-bottom:6px;border-bottom:2px solid #0B0F14;font-size:13px;font-weight:600}
.pbx-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #9AA4AC;font-size:15px;line-height:20px}
.pbx-row b{font-weight:600;white-space:nowrap;text-align:right}
.pbx-way{display:flex;gap:12px;align-items:flex-start}
.pbx-way em{flex:none;min-width:56px;height:28px;padding:0 8px;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px;background:var(--c);color:var(--i,#fff)}
.pbx-way b{display:block;font-weight:700;font-size:16px;line-height:1.2}
.pbx-way span{display:block;font-size:13px;line-height:18px;color:#3E4A54}
.pbx-tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.pbx-tips li{display:flex;gap:10px;font-size:15px;line-height:21px}
.pbx-tips li:before{content:"";flex:none;width:8px;height:8px;margin-top:7px;background:#6950A1}
.pbx-pane[hidden]{display:none}
.pbx-wide{grid-column:1/-1}
.pbx-3{grid-template-columns:repeat(3,minmax(0,1fr))}
#travel .ukag-jp.tp-tc,.ukag-jp.tp-tc{margin:0!important;padding:0!important;max-width:none!important}
.tp-tc .jq-lines{padding:0!important;background:transparent!important}
.tp-tc .jq-lines h3{display:none}
.tp-tc .jq-lines>p{margin:0 0 14px!important;font-size:15px!important;line-height:22px!important;color:#0B0F14!important}
.tp-tc .jq-chip{background:#F1F4F6;box-shadow:none;font-size:14px}
.tp-tc .jq-chip i{border-radius:0;width:12px;height:12px}
.tp-tc .jq-chip{background:#13293C;color:#fff;font-weight:500}
.tp-tc .jq-chip b{color:#fff}
.tp-tc .jq-chip i{border-radius:50%;width:14px;height:14px;box-shadow:0 0 0 2px #fff}
.tp-tc table{display:block;background:#0B0F14;font-size:16px;border-collapse:collapse;box-shadow:0 12px 30px rgba(11,15,20,.22)}
.tp-tc thead{display:block;background:#6950A1}
.tp-tc tbody{display:block}
.tp-tc tr{display:grid;grid-template-columns:190px minmax(0,1fr) 220px 104px;align-items:stretch}
.tp-tc th{background:transparent!important;color:#fff;font:600 15px/1.2 "Barlow",sans-serif;padding:12px 16px}
.tp-tc th.jq-hm,.tp-tc td.jq-hm{display:block!important}
.tp-tc tbody tr{border-top:1px solid rgba(255,255,255,.14);transition:background .25s ease}
.tp-tc tbody tr:hover{background:#1C3850}
.tp-tc td{border-top:0!important;color:#fff;padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
.tp-tc td:first-child{background:#13293C;border-left:8px solid #44AED6}
.tp-tc td:first-child b{font-size:19px;color:#fff}
.tp-tc td:first-child small{color:#9FB8CB;font-size:13px}
.tp-tc td:first-child br{display:none}
.tp-tc td:nth-child(2){display:block;align-self:center;font-size:16px;line-height:23px;color:#E8EEF2}
.tp-tc td .jq-dots{display:inline-flex!important;gap:5px!important;margin-right:10px!important}
.tp-tc td .jq-dots i{width:14px!important;height:14px!important;box-shadow:0 0 0 2px #fff}
.tp-tc td:nth-child(3){color:#F2B705;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.tp-tc td:last-child{padding:10px 12px}
.tp-tc td a{display:flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;background:#44AED6;color:#13293C!important;font-weight:700;font-size:15px;text-decoration:none!important;transition:background .25s ease}
.tp-tc td a:hover{background:#2F9CC6}
@media(max-width:760px){.tp-tc thead{display:none}.tp-tc tr{grid-template-columns:minmax(0,1fr) auto}.tp-tc td:first-child{grid-column:1/-1}.tp-tc td:nth-child(2){grid-column:1/-1;padding-top:12px}.tp-tc td:nth-child(3){padding-top:0}.tp-tc td:last-child{padding:4px 12px 12px}}
.tp-tc{margin:24px 0 8px!important;padding:0!important;max-width:none!important}
.tp-tc-h{display:flex;align-items:center;min-height:54px;margin:0 0 14px!important;padding:0 18px 0 0!important;background:#0B0F14;color:#fff!important;font:800 24px/1 "Barlow","Barlow",sans-serif!important;text-transform:none}
.tp-tc-h:before{content:"";align-self:stretch;width:54px;margin-right:16px;background:#D70428}
.tp-tc .jq-lines h3{display:none}
.pbx-wait{font-size:15px;color:#3E4A54}
@media(max-width:980px){.pbx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.pbx{padding:0 16px}.pbx-tabs{grid-template-columns:minmax(0,1fr);padding:10px 12px 0;gap:6px}.pbx-tab{box-shadow:inset 0 6px 0 var(--c)}.pbx-grid{grid-template-columns:minmax(0,1fr);padding:16px 12px 18px}.pbx-band b,.pbx-band span{font-size:22px}}
@media(prefers-reduced-motion:reduce){.pbx-tab,.pbx-box{transition:none}.pbx-tab:hover,.pbx-box:hover{transform:none}}
</style>
