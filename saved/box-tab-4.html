<!--
  Box Tab 4  (saved 9 Nov 2026, from the Clacton Airshow live page)
  The 20 square guide boxes: photo top with big outline number, coloured strip,
  name, one-line description and "Open ->", tinted background in each box colour,
  rises on hover. Photos: travel = Shenfield station, help = Juno helicopters
  (c) Chris Murgatroyd, watch = wing walkers (c) Chris Murgatroyd, support = Red Arrows.
  How to use: the page builds .cg-next .cg-all with one button[data-goto] per section;
  paste these blocks after it. Optional last block (sqtabs) moves the boxes to the top
  of main, hides the blue .sec-bar headers and makes each box open/close its section.
-->
<style id="ind-css">html{font-synthesis-weight:none}body{font-weight:500}b,strong{font-weight:700}button,input,select,textarea{font-family:inherit;font-weight:500}

</style>

<script id="ixl-js">
(function(){
  var MAP={overview:{sel:'header .cg-bg img.photo'},matchcheck:{alt:'aerobatic team in formation'},scores:{alt:'Strikemasters'},compare:{alt:'MiG-17'},lineup:{alt:'Spitfire banking overhead'},whatyousee:{alt:'Hawk trailing blue smoke'},stay:{tile:'stay'},days:{alt:'Dakota passing the crowd'},timeline:{tile:'timeline'},dayruns:{alt:'P-51 Mustang'},ground:{alt:'Grob Tutor'},seafront:{alt:'Tracker trailing smoke'},photo:{tile:'photo'},kids:{alt:'OV-10 Bronco'},postcard:{alt:'Hawk banking with its red'},facilities:{alt:'picnic benches'}};
  function find(m){
    var im=null;
    if(m.sel)im=document.querySelector(m.sel);
    else if(m.tile)im=document.querySelector('.cg-tiles>button[data-goto="'+m.tile+'"] img');
    else{var a=m.alt.toLowerCase();im=[].filter.call(document.querySelectorAll('img[alt]'),function(i){return i.alt.toLowerCase().indexOf(a)>-1;})[0];}
    return im?(im.getAttribute('src')||im.currentSrc):'';
  }
  function run(){
    var grid=document.querySelector('.ix-grid');if(!grid)return false;
    [].forEach.call(grid.querySelectorAll('button[data-goto]'),function(b){
      var m=MAP[b.getAttribute('data-goto')];if(!m)return;var src=find(m);if(!src)return;
      var top=b.querySelector('.ix-top');if(!top)return;
      top.classList.add('ix-ph');top.style.setProperty('--ph','url("'+src.replace(/"/g,'%22')+'")');
    });
    return true;
  }
  var n=0;(function w(){if(run())return;if(++n<60)setTimeout(w,250);})();
})();
</script>

<script id="ixd-js">
(function(){
  var IMG={"travel": "https://jskedge1.github.io/airshow-pages/camping-layout/img/f3812d3cc7d6083d.webp", "help": "https://jskedge1.github.io/airshow-pages/camping-layout/img/8cc625a9c1774702.webp", "watch": "https://jskedge1.github.io/airshow-pages/camping-layout/img/0974d6f164ffe3a2.webp", "support": "https://jskedge1.github.io/airshow-pages/camping-layout/img/65179cf1c2e9807e.webp"},CR={"help": 1, "watch": 1};
  function run(){
    var grid=document.querySelector('.ix-grid');if(!grid)return false;
    Object.keys(IMG).forEach(function(k){
      var b=grid.querySelector('button[data-goto="'+k+'"]');if(!b)return;var top=b.querySelector('.ix-top');if(!top)return;
      top.classList.add('ix-ph');top.style.setProperty('--ph','url("'+IMG[k]+'")');
      if(CR[k]&&!top.querySelector('.ix-cr')){var c=document.createElement('span');c.className='ix-cr';c.textContent='\u00a9 Chris Murgatroyd';top.appendChild(c);}
    });
    return true;
  }
  var n=0;(function w(){if(run())return;if(++n<60)setTimeout(w,250);})();
})();
</script>

<!-- optional: boxes as the collapsible section tabs -->
<style id="sqtabs-css">

</style>
<script id="sqtabs-js">
(function(){
  var n=0;
  function go(){
    var all=document.querySelector('.cg-next .cg-all .ix-grid');
    var main=document.querySelector('main');
    if(!all||!main||!document.querySelector('main .sec-toggle')){ if(++n<120) setTimeout(go,150); return; }
    var block=all.closest('.cg-all');
    var sec=document.createElement('section');
    sec.className='sqtabs'; sec.id='sqtabs'; sec.setAttribute('aria-label','Sections');
    var w=document.createElement('div'); w.className='wrap'; sec.appendChild(w); w.appendChild(block);
    main.insertBefore(sec, main.firstChild);
    var btns=[].slice.call(block.querySelectorAll('.ix-grid > button[data-goto]'));
    function panel(id){ return document.getElementById(id); }
    function tog(id){ var p=panel(id); return p&&p.querySelector('.sec-bar .sec-toggle'); }
    function isOpen(id){ var t=tog(id); return t&&t.getAttribute('aria-expanded')==='true'; }
    function setOpen(id,on){ var t=tog(id); if(t&&isOpen(id)!==on) t.click(); var p=panel(id); if(p){ if(on) p.removeAttribute('data-sq-closed'); else p.setAttribute('data-sq-closed',''); } }
    function mark(){ btns.forEach(function(b){ var on=!!isOpen(b.getAttribute('data-goto')); if(b.classList.contains('sq-on')!==on) b.classList.toggle('sq-on',on); var v=on?'true':'false'; if(b.getAttribute('aria-expanded')!==v) b.setAttribute('aria-expanded',v); var m=b.querySelector('.ix-more'), tx=on?'Close \u00d7':'Open \u2192'; if(m&&m.textContent!==tx) m.textContent=tx; }); }
    btns.forEach(function(b){ var id=b.getAttribute('data-goto'); if(!isOpen(id)){ var p=panel(id); if(p) p.setAttribute('data-sq-closed',''); } });
    window.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('.sqtabs .ix-grid > button[data-goto]'); if(!b) return;
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      var id=b.getAttribute('data-goto'), on=!isOpen(id);
      setOpen(id,on); mark();
      if(on){ var p=panel(id); setTimeout(function(){ p.scrollIntoView({behavior:'smooth',block:'start'}); },60); }
    },true);
    window.addEventListener('click',function(e){
      var a=e.target.closest&&e.target.closest('.back-top a'); if(!a) return;
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); sec.scrollIntoView({behavior:'smooth',block:'start'});
    },true);
    /* any other link that opens a section keeps the squares in step */
    new MutationObserver(function(ms){ if(!ms.some(function(m){return m.target.classList&&m.target.classList.contains('sec-toggle');})) return; btns.forEach(function(b){ var id=b.getAttribute('data-goto'), p=panel(id); if(p&&isOpen(id)) p.removeAttribute('data-sq-closed'); }); mark(); })
      .observe(main,{subtree:true,attributes:true,attributeFilter:['aria-expanded']});
    mark();
  }
  go();
})();
</script>
