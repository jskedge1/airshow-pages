<!-- "Clean box info" (saved 9 Nov 2026): the Experience Flights cards from the Duxford page.
     Navy header with a small pale teal label and a white Barlow title, a short plain paragraph,
     then label/value rows on pale blue grey. Teal line draws across the top and the card lifts on hover.
     A purple .cbx-hero card can span two columns for the big one. -->
<style>html{font-synthesis-weight:none}body{font-weight:500}b,strong{font-weight:700}button,input,select,textarea{font-family:inherit;font-weight:500}
.cbx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;grid-auto-flow:row dense}
.cbx{position:relative;background:#fff;border:1px solid #CBD5DD;padding:0 0 18px;display:flex;flex-direction:column;transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s ease}
.cbx::before{content:"";position:absolute;left:0;top:0;height:4px;width:0;background:#32B4AF;transition:width .5s;z-index:2}
.cbx:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(19,41,60,.16)}
.cbx:hover::before{width:100%}
.cbx header{background:#13293C;color:#fff;padding:16px 18px 14px}
.cbx-op{display:block;font:700 15px/1.3 Barlow,sans-serif;color:#8FDCD8}
.cbx h3{font:700 28px/1 Barlow,sans-serif;color:#fff;margin:6px 0 0;letter-spacing:.005em}
.cbx p{font:500 16px/1.6 Barlow,sans-serif;color:#13293C;margin:14px 18px 0;flex:1}
.cbx dl{margin:14px 18px 0;display:grid;gap:4px}
.cbx dl div{display:flex;justify-content:space-between;gap:12px;background:#E9EEF5;padding:8px 10px;font:500 15px/1.4 Barlow,sans-serif}
.cbx dt{color:#0E5F5B;font-weight:700;white-space:nowrap}
.cbx dd{margin:0;font-weight:700;color:#13293C;text-align:right}
.cbx-hero{grid-column:span 2;background:#6950A1;border-color:#6950A1}
.cbx-hero header{background:#4F3C7D}
.cbx-hero p{color:#F2EEFA;font-size:18px}
.cbx-hero dl div{background:rgba(255,255,255,.12)}
.cbx-hero dt{color:#E3DAF5}.cbx-hero dd{color:#fff}
@media(max-width:900px){.cbx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.cbx-grid{grid-template-columns:minmax(0,1fr)}.cbx-hero{grid-column:auto}}
@media(prefers-reduced-motion:reduce){.cbx{transition:none}.cbx:hover{transform:none}}
</style>
<div class="cbx-grid">
  <article class="cbx">
    <header><span class="cbx-op">Small label</span><h3>Box title</h3></header>
    <p>One or two plain sentences of advice.</p>
    <dl><div><dt>Label</dt><dd>Value</dd></div><div><dt>Label</dt><dd>Value</dd></div></dl>
  </article>
</div>
