<!-- Food vans and traders part (saved 9 Nov 2026): the Traders at this show box gets its own part at the
     end of Food & facilities, with a gap above it and a red sub heading. Works on any feature show page. -->
<style id="traders-part-css">html{font-synthesis-weight:none}body{font-weight:500}b,strong{font-weight:700}button,input,select,textarea{font-family:inherit;font-weight:500}
html body #facilities ukag-show-traders{display:block;margin-top:18px!important;clear:both}
html body #facilities h3.tr-sub{margin:64px 0 16px!important;padding:0;border:0;font:700 34px/1.05 Barlow,sans-serif;letter-spacing:-.005em;text-transform:capitalize;color:#D74949}
@media (max-width:700px){html body #facilities h3.tr-sub{margin-top:44px!important;font-size:26px}}
</style>
<script id="traders-part-js">
(function(){var n=0;(function w(){var t=document.querySelector('#facilities ukag-show-traders');
if(!t){if(++n<80)setTimeout(w,150);return;}
var p=t.previousElementSibling;if(p&&p.classList.contains('tr-sub'))return;
var h=document.createElement('h3');h.className='sub-h tr-sub';h.textContent='Food vans and traders';
t.parentNode.insertBefore(h,t);})();})();
</script>
