<button class="totop" id="totop" onclick="window.scrollTo({top:0,behavior:'smooth'})">Back to top</button>
<script>
var CH_AIR=[{"id": "welcome", "n": 1, "t": "Welcome, let me make settings less confusing", "lvl": "b", "h": "<p class=\"pp\">If you are attending a UK airshow with a camera for the first time, the settings can feel like a minefield. One aircraft is moving slowly along the taxiway, the next is a fast jet crossing the display line, and then a helicopter appears and needs a completely different shutter speed. You do not have much time to think, and it is very easy to start changing everything at once.</p><p class=\"pp\">I have created this guide to make that part of the day easier. It gives you practical starting settings for the situations you are likely to photograph at a UK airshow, using basic photography language and without overcomplicating it. These are not magic settings that will work perfectly every time. The weather, light, aircraft, lens and your position along the crowdline will all make a difference. However, they will give you a safe place to begin.</p><p class=\"pp\">My advice is simple: start with a reliable setting, take a photograph, check the result and change one thing at a time. Get the safe photograph first. Once you know you have something sharp, you can slow the shutter, try a different angle or be a little more creative.</p><div class=\"tip\"><b>Jack’s quick tip</b><p>Do not spend the whole display looking at the back of the camera. Check a few photographs when the aircraft has moved away, make a small adjustment and then get ready for the next pass.</p></div>"}, {"id": "startup", "n": 2, "t": "The simple startup before the flying", "lvl": "b", "h": "<p class=\"pp\">Set the camera up before the first display. You do not want a rare aircraft appearing while the camera is still set for a static aircraft or a long exposure from the night before. The good thing about many airshows is that you generally see some arrivals and departures before the flying display begins. This is less likely at a seaside airshow. Use them to get your settings right. I still do this, even after more than 15 years. You will see most photographers doing this.</p><div class=\"set\"><b>File type</b><p><strong>RAW, or RAW + JPEG.</strong> RAW keeps more detail and gives you more room to recover bright skies and dark aircraft when editing. JPEG is fine if you do not plan to edit much, but RAW gives you more flexibility. If this is your first airshow, shooting in JPEG is perfectly fine.</p></div><div class=\"set\"><b>Camera mode</b><p><strong>Shutter Priority (S on Nikon and Sony, or Tv on Canon).</strong> You choose the shutter speed and the camera works out the aperture. This is normally the easiest mode for a beginner at an airshow.</p></div><div class=\"set\"><b>Focus mode</b><p><strong>AF-C, AI Servo or Continuous AF.</strong> The camera continues to adjust focus while the aircraft moves towards you, away from you or across the sky.</p></div><div class=\"set\"><b>Drive mode</b><p><strong>Continuous high speed burst.</strong> A short burst gives you several frames to choose from when the aircraft is banking, crossing or passing display centre.</p></div><div class=\"set\"><b>Metering</b><p><strong>Matrix or Evaluative.</strong> This is a good general option for changing aircraft and backgrounds.</p></div><div class=\"set\"><b>White balance</b><p><strong>Auto.</strong> This is a sensible starting point, especially when shooting RAW, because the colour can be corrected later.</p></div><div class=\"set\"><b>Image stabilisation</b><p><strong>On.</strong> Use normal mode for general flying and a panning or sport mode if your lens offers one. Check your own lens instructions, because stabilisation systems can behave differently.</p></div><div class=\"set\"><b>Focus area</b><p><strong>Group or Single Point.</strong> It is easier to keep a group of focus points on a moving aircraft than one tiny point, but it is less likely to grab the cloud or background than using the whole viewfinder.</p></div><div class=\"set\"><b>ISO</b><p><strong>Auto ISO to begin with.</strong> This lets the camera raise or lower the sensitivity as the light changes. If your camera allows it, set the maximum to ISO 1200, so your photographs do not become noisy. Use ISO 1000 if your camera has no 1200 setting.</p></div><div class=\"tip\"><b>Jack’s quick tip</b><p>Photograph a distant sign, vehicle or parked aircraft before the flying starts. Zoom into the photograph and check that it is sharp. It is much easier to correct a problem before the first display.</p></div>"}, {"id": "shutter", "n": 3, "t": "The correct shutter speed for aviation", "lvl": "b", "h": "<p class=\"pp\">Shutter speed controls how long the camera records the scene. A fast speed, such as 1/1600 second, freezes movement. A slower speed, such as 1/160 second, shows movement in propellers, rotors and backgrounds, but it is harder to keep the aircraft sharp.</p><p class=\"pp\">At an airshow you will change shutter speed more than most other settings. Jets normally need a faster shutter. Propeller aircraft and helicopters normally need a slower shutter, so the blades do not look completely frozen. This is why leaving the camera on one setting all day will not give the best result.</p><p class=\"pp\">This is also why we recommend having two bodies, meaning one can be left on a Slow Shutter speed, and the other on a fast one.</p>"}, {"id": "jets", "n": 4, "t": "Fast jets and high speed passes", "lvl": "b", "h": "<p class=\"pp\">Fast jets are often the easiest place to start because you are trying to freeze the movement. The difficult part is keeping the aircraft inside the frame and allowing the autofocus enough time to lock on. Remember, practice makes perfect. It will take you some time to learn and get the shot you want.</p><div class=\"set\"><b>Safe starting shutter speed</b><p><strong>1/1000 second.</strong> This should freeze many normal fast jet passes while keeping the ISO manageable in reasonable light.</p></div>@@PHOTO:phantom-tiger@@<div class=\"set\"><b>Very fast pass, tight turn or vapour</b><p><strong>1/1600 second.</strong> This works well when the aircraft is very close, crossing quickly, pulling hard or when you are using a long lens.</p></div>@@PHOTO:jet-vapour@@<p class=\"pp\">Please note that these are a guide. I also use a simple rule of thumb, where the shutter speed should be at least equal to your focal length. If you are shooting at 500mm, I would suggest setting the shutter to 1/1000 or higher to create sharp images. Your ISO may need to be increased to make your images lighter depending on the cloud cover.</p><div class=\"set\"><b>Aperture</b><p><strong>Chosen by the camera in Shutter Priority.</strong> If you use Manual mode, f/7.1 or f/8 is a useful starting area when there is enough light. This is generally the sweet spot for sharpness on most lenses.</p></div><div class=\"set\"><b>ISO</b><p><strong>Auto ISO.</strong> Watch that it does not rise unnecessarily high. In bright conditions it may remain around ISO 100 to 400; under dark cloud it may rise much further. I personally like to use manual ISO.</p></div><div class=\"set\"><b>Autofocus</b><p><strong>AF-C / AI Servo with a small group or subject tracking.</strong> Begin tracking the jet before it reaches the point where you want the photograph.</p></div><p class=\"pp\">For a fast pass, start slightly wider than you think you need. Find the aircraft, follow it smoothly and zoom in only once you have it under control. If you use too much focal length straight away, the aircraft can disappear from the viewfinder, and you may miss the entire pass. I have done this a few times before.</p><div class=\"tip\"><b>Jack’s quick tip</b><p>Leave a little space in front of the aircraft and around the wingtips. You can crop the photograph later, but you cannot put a clipped wingtip or smoke trail back into the frame.</p></div>"}, {"id": "arrivals", "n": 5, "t": "Jets arriving and departing", "lvl": "b", "h": "<p class=\"pp\">Arrivals, departures and runway movements give you different opportunities from the main flying display. You may capture rotation, touchdown smoke, afterburner, a pilot wave or the aircraft banking away. The distance and angle can change quickly, so a zoom lens is very useful.</p>@@PHOTO:f16-burner@@<div class=\"set\"><b>Take off</b><p><strong>1/1000 to 1/1600 second.</strong> Use the faster end for a powerful rotation, a close departure or visible heat and exhaust movement.</p></div><div class=\"set\"><b>Landing</b><p><strong>1/800 to 1/1250 second.</strong> This gives you a good chance of freezing the aircraft and the moment the wheels touch down.</p></div>@@PHOTO:typhoon-gear@@<div class=\"set\"><b>Taxiing jet</b><p><strong>1/320 to 1/800 second.</strong> A slower taxi does not need the same speed as a flying pass. Raise it if the aircraft is moving quickly or your longer lens is difficult to hold steady.</p></div>@@PHOTO:f16-taxi@@<p class=\"pp\">Heat haze can make a perfectly focused aircraft look soft, particularly close to the runway on a hot day. A faster shutter will not remove heat haze. If it becomes severe, concentrate on closer aircraft, wait for a different angle or include the haze as part of the atmosphere.</p>"}, {"id": "props", "n": 6, "t": "Propeller aircraft and moving blades", "lvl": "c", "h": "<p class=\"pp\">Propeller aircraft need a different approach. If you use 1/1600 second, the aircraft may be sharp, but the propeller can look stopped. Slowing the shutter shows the engine is running and gives the photograph more life. The trade off is that your success rate will fall, so work down gradually rather than going straight to a very slow speed.</p><div class=\"set\"><b>Safe beginner starting point</b><p><strong>around 1/320 second.</strong> This normally gives some blade movement while still giving you a reasonable chance of a sharp aircraft.</p></div>@@PHOTO:twin-prop-landing@@<div class=\"set\"><b>More propeller blur</b><p><strong>1/250, then 1/200 or 1/160 second.</strong> Try each speed after you have secured a sharp photograph. The slower you go, the smoother your panning needs to be.</p></div>@@PHOTO:twin-prop-bank@@<div class=\"set\"><b>Fast aerobatic propeller aircraft</b><p><strong>around 1/500 second to begin.</strong> These aircraft can change direction quickly. Secure the airframe first, then reduce the speed on a later pass.</p></div>@@PHOTO:aero-smoke@@<div class=\"set\"><b>Taxiing propeller aircraft</b><p><strong>around 1/250 second.</strong> If your tracking feels smooth, try 1/160 or 1/125 second for more movement. Any lower you will risk the whole shot being blurry, trust me, I have many images like that.</p></div>@@PHOTO:prop-runway@@<div class=\"tip\"><b>Jack’s quick tip</b><p>Do not chase a perfect full propeller disc at the expense of a sharp aircraft. Some movement in the blades normally looks much better than a lovely, blurred propeller attached to a soft airframe.</p></div>"}, {"id": "helis", "n": 7, "t": "Helicopters and rotor blur", "lvl": "c", "h": "<p class=\"pp\">Helicopters can be difficult because rotor speeds vary and a very fast shutter makes the blades look frozen. Start safely and reduce the speed as your confidence improves.</p>@@PHOTO:heli-blue@@<div class=\"set\"><b>Safe beginner starting point</b><p><strong>1/250 to 1/320 second.</strong> This should show some rotor movement while giving you a fair chance of keeping the helicopter sharp.</p></div><div class=\"set\"><b>More rotor blur</b><p><strong>1/160 to 1/200 second.</strong> Try this once you have a sharp frame and the helicopter is moving in a predictable direction.</p></div>@@PHOTO:heli-hover@@<div class=\"set\"><b>Hovering helicopter</b><p><strong>around 1/200 to 1/250 second.</strong> Even though the helicopter is hovering, keep following small movements and hold the camera steadily.</p></div>@@PHOTO:merlin-cloud@@<p class=\"pp\">Do not assume that every helicopter needs exactly the same speed. A large helicopter with slower looking rotors may need a slower shutter to show movement than a smaller machine. Check a photograph when it is safe to do so and adjust.</p>"}, {"id": "heavy", "n": 8, "t": "Large transport aircraft", "lvl": "b", "h": "<p class=\"pp\">Large aircraft may look slow because of their size, but they can still be moving quickly. They also give you a chance to photograph banking topsides, wingtip vortices and formations with smaller aircraft.</p><div class=\"set\"><b>Normal flying pass</b><p><strong>1/800 to 1/1250 second.</strong> This is usually fast enough for a sharp heavy aircraft while avoiding an unnecessarily high ISO.</p></div>@@PHOTO:c17-cloud@@<div class=\"set\"><b>Propeller transport aircraft</b><p><strong>around 1/320 second.</strong> Treat it as a propeller aircraft if you want visible blade movement, then work down slowly.</p></div>@@PHOTO:transport-bank@@@@PHOTO:casa-landing@@"}, {"id": "teams", "n": 9, "t": "Display teams and crossovers", "lvl": "c", "h": "<p class=\"pp\">For formation teams, your main job is keeping every aircraft inside the frame. A wider view often creates a stronger photograph because it shows the shape of the formation, smoke and the scale of the display.</p><div class=\"set\"><b>Formation pass</b><p><strong>1/1000 to 1/1600 second.</strong> This freezes the aircraft and helps when they are spread across a large part of the frame.</p></div>@@PHOTO:frecce-smoke@@<div class=\"set\"><b>Break or crossover</b><p><strong>1/1600 second.</strong> The relative movement can be very fast, so track early and begin your short burst just before the aircraft meet or separate.</p></div>@@PHOTO:hawks-smoke@@<div class=\"set\"><b>Focus area</b><p><strong>Group, zone or auto.</strong> Keep the focus area on the nearest or most important aircraft and use enough depth of field where possible. 90% of the time, I shoot in Group, giving me the best chance of the aircraft being in focus.</p></div><p class=\"pp\">Listen to the commentary, as it may warn you about an opposition pass, break or aircraft arriving from behind. Use the first pass to learn the route. If the display repeats a similar manoeuvre, you will be better prepared the next time.</p><div class=\"tip\"><b>Jack’s quick tip</b><p>A formation does not need to fill the frame. Smoke, cloud and empty space can make the shape much clearer and give the aircraft somewhere to move into.</p></div>"}, {"id": "panning", "n": 10, "t": "Panning for movement", "lvl": "c", "h": "<p class=\"pp\">Panning means moving the camera smoothly with the aircraft while using a slower shutter speed. If it works, the aircraft remains sharp while the background becomes blurred. It can look excellent during taxiing, take off or landing, but not every frame will be sharp, and that is completely normal. Expect some blurry and out of focus shots the first time you do this. Even now it happens.</p><div class=\"set\"><b>Beginner panning speed</b><p><strong>1/250 or 1/320 second.</strong> This gives you some movement without making the technique too unforgiving.</p></div>@@PHOTO:typhoon-pan@@<div class=\"set\"><b>Next challenge</b><p><strong>1/160 or 1/125 second.</strong> Use this once you can follow the aircraft smoothly. Expect fewer sharp frames. Do not go lower than you need to, as you will be at risk of ruining your images.</p></div>@@PHOTO:f16-pan@@<p class=\"pp\">To pan, stand with your feet comfortably apart, turn from your waist towards the approaching aircraft and find it early. Keep moving at the same speed as the aircraft, press the shutter gently and continue following it after the burst. Do not stop moving as soon as you press the button.</p><div class=\"tip\"><b>Jack’s quick tip</b><p>Take the safe sharp photograph first, then try the slower pan on the next pass. A big show is not the place to discover at home that every photograph from a rare display was blurred.</p></div>"}, {"id": "statics", "n": 11, "t": "Static aircraft in the showground", "lvl": "b", "h": "<p class=\"pp\">If your chosen airshow has static aircraft, they give you time to slow down and think about the photograph. The challenge is normally the crowd, barriers, signs and other aircraft in the background rather than movement.</p><div class=\"set\"><b>Camera mode</b><p><strong>Aperture Priority (A or Av).</strong> You choose the aperture and the camera selects a suitable shutter speed. This is simple for subjects that are not moving.</p></div><div class=\"set\"><b>Aperture for the whole aircraft</b><p><strong>f/7.1 to f/11.</strong> This helps keep more of the aircraft sharp, especially when photographing it from an angle.</p></div><div class=\"set\"><b>Aperture for details</b><p><strong>f/4 to f/5.6 where your lens allows.</strong> A wider aperture can soften the background behind a badge, cockpit, intake or piece of landing gear.</p></div><div class=\"set\"><b>ISO</b><p><strong>ISO 100 to 400 in good light, or Auto ISO.</strong> Keep it low, when possible, for clean detail, but do not allow the shutter speed to become too slow to handhold.</p></div><div class=\"set\"><b>Focus</b><p><strong>AF-S / One Shot for a still aircraft.</strong> Place the focus point on the cockpit, markings or the detail that matters most. Continuous focus is also fine if you prefer to leave the camera set up that way.</p></div><p class=\"pp\">Walk around the aircraft before taking the first photograph. Move a little left or right, crouch lower or use a longer focal length to narrow the background. Popular aircraft may be quieter early in the day or later in the afternoon, so return if the first view is too busy.</p>@@PHOTO:heli-static@@"}, {"id": "people", "n": 12, "t": "People, ground crew and atmosphere", "lvl": "b", "h": "<p class=\"pp\">A complete set of photographs should show more than aircraft against the sky. Pilots, ground crew, families, flags, trade stands, weather and reactions along the crowdline all help tell the story of the day.</p><div class=\"set\"><b>General people and atmosphere</b><p><strong>Aperture Priority, f/4 to f/8 and Auto ISO.</strong> Use the wider end for one person and a wider aperture; use f/8 when you want a group or more of the scene sharp.</p></div><div class=\"set\"><b>Moving people or crew</b><p><strong>at least 1/250 second.</strong> Raise the shutter speed towards 1/500 second if people are walking quickly or working around an aircraft. This will help reduce motion blur.</p></div><div class=\"set\"><b>Wide venue photograph</b><p><strong>f/8 to f/11.</strong> This keeps more of the scene sharp and works well for crowdline, runway and dramatic sky photographs.</p></div>@@PHOTO:typhoon-static@@<p class=\"pp\">For close photographs of people, especially children, ask permission when practical. Never cross a barrier, block a working crew or interfere with the operation to obtain a photograph.</p>"}];
var CH_LIGHT=[{"id": "sun", "n": 13, "t": "Bright sun, white paint and shiny metal", "lvl": "c", "h": "<p class=\"pp\">Bright sunshine can look easy, but white paint and polished metal can quickly lose detail. Once a highlight becomes completely white, it can be difficult or impossible to recover.</p><div class=\"set\"><b>Exposure compensation</b><p><strong>start at 0, then try minus 0.3 or minus 0.7 if highlights are flashing.</strong> A small reduction can protect white aircraft and bright cloud without making everything too dark.</p></div><div class=\"set\"><b>ISO</b><p><strong>keep it low where possible.</strong> Bright light normally allows ISO 100 to 400 while still using a fast shutter.</p></div><p class=\"pp\">Use the histogram and highlight warning rather than judging exposure only from the rear screen. In sunlight the screen can appear darker than the actual photograph, which may tempt you to make the file too bright.</p>@@PHOTO:white-jet@@"}, {"id": "dark", "n": 14, "t": "Dark aircraft, backlight and silhouettes", "lvl": "c", "h": "<p class=\"pp\">A dark aircraft against a bright sky can cause the camera to make the subject too dark. You can either brighten the aircraft or use the backlight deliberately to create a silhouette. Similar to what I have done in the photograph below.</p><div class=\"set\"><b>To show detail in the aircraft</b><p><strong>+0.3 to +1.0 exposure compensation as a careful starting range.</strong> Check the bright sky as you increase exposure, because it may lose detail.</p></div><div class=\"set\"><b>For a silhouette</b><p><strong>reduce exposure until the aircraft becomes a clean dark shape.</strong> This works best when the outline is easy to recognise and the sky has strong colour or cloud detail.</p></div><p class=\"pp\">There is no perfect answer when the brightness difference is very large. Shooting RAW gives you more room to lift shadows later but protect the most important highlights and accept that some deep shadows may remain.</p><p class=\"pp\">This is why it’s also important to be shooting in RAW, as you can really push your files to the max. It’s also helpful if you have a higher megapixel camera, as this will help with the dynamic range. However, a camera with 20mp will be sufficient.</p>@@PHOTO:dark-tanker@@"}, {"id": "overcast", "n": 15, "t": "Overcast skies and changing cloud", "lvl": "b", "h": "<p class=\"pp\">Overcast light can make aircraft look flat, but it can also soften harsh shadows and bring out surface detail. Broken clouds are harder because the brightness can change between one pass and the next. You might find you will have many under and over exposed shots just by one pass.</p><div class=\"set\"><b>Mode</b><p><strong>Shutter Priority with Auto ISO.</strong> This keeps the shutter speed where you need it while the camera reacts to changing light.</p></div><div class=\"set\"><b>Fast jets</b><p><strong>keep 1/1000 second if possible.</strong> Allow ISO to rise rather than dropping to a speed that makes every frame soft.</p></div><div class=\"set\"><b>Exposure compensation</b><p><strong>+0.3 to +0.7 for a dark aircraft against pale cloud, if needed.</strong> Check the histogram and reduce it if the cloud is losing all detail.</p></div><p class=\"pp\">Noise from a higher ISO can often be reduced during editing. A blurred aircraft caused by a shutter speed that was too slow is much harder to repair.</p>@@PHOTO:f16-grey@@"}, {"id": "rain", "n": 16, "t": "Rain, haze and the UK weather", "lvl": "c", "h": "<p class=\"pp\">The UK weather does not always behave itself. Back in 2023, when I attended RIAT on the Friday, we were hit with some heavy downpours. Rain, dark clouds and haze can make photography harder, but they can also create reflections, spray, vapour and far more atmosphere than a plain blue sky. I did notice that many photographers put their cameras away, however I find it’s the best time to capture those unique images that you will only capture in these conditions. I have always said, work with the weather. It’s your friend, not your enemy.</p>@@PHOTO:f16-spray@@<ul class=\"check\"><li><b>In rain, protect the camera with a proper cover or dry bag and keep a clean lens cloth easy to reach</b></li><li><b>Under dark clouds, use Auto ISO and concentrate on keeping the shutter speed suitable for the aircraft</b></li><li><b>With dramatic clouds, expose the aircraft but keep checking bright gaps in the sky</b></li><li><b>In heat haze, photograph closer subjects where possible. Editing cannot restore detail that the moving air has removed</b></li><li><b>In strong wind, use a stable stance, tuck your elbows in and secure loose covers and straps</b></li></ul><div class=\"tip\"><b>Jack’s quick tip</b><p>Stop waiting for the weather you hoped for and look for the photograph the actual weather is offering. Some of the most memorable aviation photographs are created in difficult conditions. This is my favourite style of photography in aviation.</p></div>"}, {"id": "af", "n": 17, "t": "Autofocus that keeps the aircraft sharp", "lvl": "c", "h": "<p class=\"pp\">Use continuous autofocus for flying aircraft. On different camera brands this may be called AF-C, AI Servo or Continuous AF. If your camera has aircraft detection, try it before attending an airshow so you know how quickly it finds and holds a subject. Technology helps, but you still need to keep the aircraft inside the focus area.</p><ul class=\"check\"><li><b>Begin at the wider end of the zoom, find the aircraft and only zoom in once tracking is secure</b></li><li><b>Track the aircraft for a moment before pressing the shutter, giving autofocus time to settle</b></li><li><b>Use a small group or zone if the camera keeps focusing on cloud, smoke or the background</b></li><li><b>If the aircraft keeps leaving the frame, zoom out. Too much focal length is often the problem</b></li><li><b>Keep both eyes open as the aircraft approaches. This makes it easier to find it before bringing the viewfinder fully to your eye</b></li><li><b>Practise before your chosen airshow by following cars, birds or commercial aircraft. A local free airshow or one of Duxford’s flying days will help you gain that experience before attending a bigger airshow for the first time</b></li></ul><div class=\"tip\"><b>Jack’s quick tip</b><p>A sharp photograph taken slightly wider is much more useful than a tightly framed photograph where the autofocus has missed.</p></div>"}, {"id": "burst", "n": 18, "t": "Burst shooting without filling the buffer", "lvl": "c", "h": "<p class=\"pp\">Continuous burst is helpful, but holding the shutter down for the entire pass creates hundreds of similar files and can fill the camera buffer. When that happens, the camera may slow down just as the aircraft reaches the best position. I always recommend a camera with at least 6 FPS. However, if your budget only allows 3 FPS, that’s completely fine.</p><p class=\"pp\">Follow the aircraft, begin a short burst just before the moment you want and release shortly afterwards. For a bank, crossover or touchdown, try to anticipate the action rather than reacting after it has already happened. Over time, you will find out the type of images you want to take, and the limitations of your camera and lenses. This will allow you to take less images, I may only take around 40 images of one display, as I know the images I want. This will help save battery life and space on your SD cards, and it stops your computer’s storage filling up.</p>"}, {"id": "manual", "n": 19, "t": "Manual mode, when you are ready", "lvl": "l", "h": "<p class=\"pp\">Shutter Priority is the easiest place to start, but Manual mode can give more consistent results when the light on the aircraft stays steady. A useful approach is Manual mode with Auto ISO: you choose the shutter speed and aperture, while the camera changes ISO as the brightness changes.</p><div class=\"set\"><b>Fast jet starting point</b><p><strong>1/1250 second, f/7.1 or f/8, Auto ISO.</strong> This provides a reliable balance of speed and depth of field in reasonable light.</p></div><div class=\"set\"><b>Propeller starting point</b><p><strong>1/320 second, f/7.1 or f/8, Auto ISO.</strong> This shows some propeller movement while the camera handles changing brightness through ISO.</p></div><div class=\"set\"><b>Static aircraft starting point</b><p><strong>1/250 second or faster, f/8, Auto ISO.</strong> This helps keep the full aircraft sharp while maintaining a hand holdable shutter speed.</p></div><p class=\"pp\">These are starting points, not rules. If the lens cannot open to the selected aperture at the chosen focal length, or the ISO becomes too high, change one part of the setup and check again.</p><p class=\"pp\">Only start to use Manual mode once you are comfortable and know what settings you need. Until then, it puts you at risk of missing the shots you are after. Trust me, when I started exploring Manual mode, I missed some of those shots.</p>"}, {"id": "checklist", "n": 20, "t": "A simple airshow settings checklist", "lvl": "b", "h": "<p class=\"pp\">If you want one quick list to check before the display begins, start here:</p><ul class=\"check\"><li><b>RAW or RAW + JPEG</b></li><li><b>Shutter Priority (S or Tv)</b></li><li><b>AF-C, AI Servo or Continuous AF</b></li><li><b>Continuous high speed burst</b></li><li><b>Matrix or Evaluative metering</b></li><li><b>Auto white balance</b></li><li><b>Auto ISO with a sensible maximum for your camera</b></li><li><b>Small group, zone or aircraft tracking focus area</b></li><li><b>Image stabilisation on, using panning mode if suitable for your lens</b></li><li><b>Start at 1/1000 second for jets</b></li><li><b>Start at 1/320 second for propeller aircraft</b></li><li><b>Start at 1/250 to 1/320 second for helicopters</b></li><li><b>Use Aperture Priority around f/7.1 to f/11 for static aircraft</b></li></ul>"}, {"id": "problems", "n": 21, "t": "Common problems and quick fixes", "lvl": "b", "h": "<div class=\"set\"><b>The whole aircraft is blurred</b><p><strong>increase the shutter speed.</strong> Also steady your stance and make sure image stabilisation is set correctly.</p></div><div class=\"set\"><b>The background is sharp, but the aircraft is soft</b><p><strong>use a smaller focus area and keep it on the aircraft.</strong> Track for a moment before beginning the burst.</p></div><div class=\"set\"><b>The aircraft keeps leaving the frame</b><p><strong>zoom out.</strong> Find it again at a wider focal length before zooming in.</p></div><div class=\"set\"><b>The aircraft is too dark</b><p><strong>add a little positive exposure compensation.</strong> Check the bright sky after each small change.</p></div><div class=\"set\"><b>White paint has no detail</b><p><strong>reduce exposure compensation.</strong> Use the histogram and highlight warning.</p></div><div class=\"set\"><b>The photograph looks noisy</b><p><strong>lower the ISO if the light allows.</strong> Do not sacrifice the necessary shutter speed simply to keep ISO low.</p></div><div class=\"set\"><b>The propeller looks frozen</b><p><strong>use a slower shutter speed.</strong> Move down gradually from 1/320 towards 1/250, 1/200 or 1/160.</p></div><div class=\"set\"><b>Every panning photograph is blurred</b><p><strong>return to 1/250 or 1/320 second.</strong> Practise the movement, then try a slower speed again. Do not rush into lowering the shutter speed.</p></div><div class=\"set\"><b>The camera stops shooting quickly</b><p><strong>use shorter bursts.</strong> The buffer may be full, especially with large RAW files. This comes down to your camera’s buffer and your memory card’s write speed.</p></div>"}, {"id": "final", "n": 22, "t": "Final advice before your airshow", "lvl": "b", "h": "<p class=\"pp\">Airshow photography takes practice, and you will miss photographs. Everyone does. The important part is understanding why an image did not work and changing one thing for the next pass. Do not assume that buying a longer lens or a newer camera will solve every problem. Learning how your own equipment behaves will make a far bigger difference.</p><p class=\"pp\">Start with the safe settings in this guide, get a sharp photograph and then experiment. Watch the aircraft, listen to the commentary and keep looking around, because the next photograph may arrive from behind you while everyone is watching the aircraft that has just passed.</p><p class=\"pp\">Most importantly, remember to enjoy it. Lower the camera now and then, watch the display with your own eyes and take in the sound and atmosphere. The photographs should help you remember the day, not stop you from experiencing it.</p><div class=\"tip\"><b>Jack’s quick tip</b><p>Keep practising, compare your results and develop a style that feels like your own. Your next airshow is another chance to improve.</p></div>"}];
var EQ={"cameras": {"facts": "<div class=\"facts\"><div><b>Burst speed</b>Six frames per second or more</div><div><b>Autofocus</b>Fast, reliable tracking with a good lens</div><div><b>Buffer</b>How long it keeps shooting before slowing</div><div><b>Budget tip</b>A used body leaves more for the lens</div><div class=\"hot\"><b>Most important</b>It feels comfortable in your hands</div></div>", "boxTitle": "At a glance", "h": "<p class=\"pp\">What is the right camera for aviation photography? The truth is, almost any camera can produce great results. It comes down to learning how to use it, practising different techniques and understanding its limits.</p><p class=\"pp\">I used to photograph aircraft with a Nikon D40X and still achieved some stunning shots. Learn your camera, keep practising and you will be surprised by the results you can achieve.</p><h4 class=\"bh\">DSLR or mirrorless?</h4><p class=\"pp\">Cameras have improved a lot over the past ten years, and mirrorless cameras have now become more popular than DSLRs. They are also becoming much more affordable on the second hand market. I purchased a used Nikon Z6 for around £400, which shows that you no longer have to spend thousands of pounds or automatically look at an entry level DSLR when buying on a budget.</p><p class=\"pp\">Mirrorless cameras can offer faster burst speeds, wider autofocus coverage, subject detection, electronic viewfinders and better video performance. Some also include in body image stabilisation and silent shooting. The electronic viewfinder is particularly helpful because it lets you see how your exposure may look before taking the photograph.</p><p class=\"pp\">That does not mean a mirrorless camera is always the better choice. A good DSLR is still equally capable of producing excellent aviation photographs. Older professional and enthusiast DSLRs can offer strong autofocus, excellent battery life, comfortable handling and a tough body for a much lower price, and there is a large selection of affordable second hand DSLR lenses.</p><div class=\"tip\"><b>On a limited budget</b><p>Something like a used Nikon D7100 or D7200, Canon EOS 80D or Sony a6300 may give you more for your money than a cheaper entry level mirrorless camera. I would suggest putting the money you save towards a better lens, which can make an even bigger difference.</p></div><h4 class=\"bh\">What should I look for?</h4><p class=\"pp\">For aviation photography, I would recommend a camera that can shoot at least six frames per second. You do not need to hold the shutter button down for the whole display, but a faster burst helps when capturing a fast pass, a take off, a crossover or any moment that happens very quickly.</p><p class=\"pp\">Autofocus is also important. You need a camera that can find and track an aircraft as it moves across the sky, and a lens with a fast, reliable autofocus motor makes a big difference too. It is worth checking the camera's buffer as well. A high frame rate sounds impressive, but it is less useful if the camera can only keep it up for a few seconds.</p><p class=\"pp\">You should also think about:</p><ul class=\"check\"><li><b>The selection and price of compatible lenses</b></li><li><b>Battery life and the cost of spare batteries</b></li><li><b>The position of the buttons and controls</b></li><li><b>The weight, especially with a large lens attached</b></li><li><b>Weather sealing for changeable airshow conditions</b></li><li><b>Whether you want strong video features as well as photography</b></li><li><b>The cost and speed of the memory cards it needs</b></li></ul><h4 class=\"bh\">How it feels in your hands</h4><p class=\"pp\">Most importantly, find a camera that feels comfortable. You could be holding it for most of the day, often with a fairly heavy lens attached, so the grip and button layout really matter. Personally, I prefer larger, chunkier bodies such as the Nikon D500 and D850. They feel balanced with bigger aviation lenses and give me a solid grip. The Canon EOS 7D Mark II offers a similar sports focused option and can now be found for a reasonable price second hand.</p><p class=\"pp\">Do not choose a camera simply because someone else uses it or because it has the highest number of megapixels. Think about your budget, the lenses you want to use and how it feels in your hands. Both DSLR and mirrorless cameras remain excellent options. It is about finding the one that works best for you.</p>"}, "lenses": {"facts": "<div class=\"facts\"><div><b>Telephoto</b>Flying displays. Brings distant aircraft closer</div><div><b>Wide angle</b>Static park, crowds and the whole scene</div><div><b>Prime</b>Creative static shots. Makes you move and think</div><div class=\"hot\"><b>First lens</b>A 70 to 300mm is a great place to begin</div></div>", "boxTitle": "The three lens types"}, "lens-tele": {"h": "<p class=\"pp\">For most aviation photographers, the telephoto lens is the number one lens they take to an airshow. It helps you get closer to aircraft in flight when you cannot get closer yourself. But how much reach do you actually need?</p><p class=\"pp\">You will see plenty of photographers using a 150 to 600mm, a Nikon 200 to 500mm or a 100 to 400mm. The longest lens is not automatically the best one for you. If you want to photograph aircraft high up during a full display, 500mm or 600mm can be useful. If you prefer closer passes, take offs, landings and taxiing, you may be perfectly happy with 300mm or 400mm, and a shorter zoom makes it easier to keep a fast aircraft in the frame.</p><p class=\"pp\">If you are just starting out, a 70 to 300mm is a great place to begin. You might find it does most of what you want, especially at a smaller show where the aircraft are closer to you.</p><div class=\"tip\"><b>Let your photos decide</b><p>I would give yourself time before deciding you need more reach. It took me a few years to work out the style of images I wanted. Look back at your photos. Are you cropping heavily because the aircraft is too small, or zooming out to fit it in? Your own photos will tell you more than somebody else's kit list.</p></div><h4 class=\"bh\">What to look for</h4><ul class=\"check\"><li><b>Zoom range</b><span>A 70 to 300mm gives you flexibility, while a 150 to 600mm gives you more reach for distant displays.</span></li><li><b>Autofocus</b><span>Aircraft move quickly, so you want a lens that focuses reliably with your camera. Check reviews and try the combination before buying if you can.</span></li><li><b>Stabilisation</b><span>Helps with camera shake on a long lens, particularly while panning. It will not freeze a moving aircraft on its own. Your shutter speed still matters.</span></li><li><b>Aperture</b><span>Check the maximum aperture at the long end. A lens that reaches f/8 at 400mm may need a higher ISO on a cloudy day than one that reaches f/5.6.</span></li><li><b>Weight and fit</b><span>Think about carrying it all day, and check the exact mount and autofocus compatibility, particularly when buying second hand or using an adapter.</span></li></ul><p class=\"pp\">There are sensible options before looking at lenses costing thousands. For Nikon DSLR users, a used AF-P DX 70 to 300mm VR or the Nikon 200 to 500mm f/5.6 VR may be worth a look. Canon EOS R users could consider the RF 100 to 400mm f/5.6 to 8 IS USM, while the Sony E 70 to 350mm G OSS suits Sony APS-C cameras. The Sigma 150 to 600mm Contemporary and Tamron 150 to 600mm G2 are lenses you may come across second hand. Make sure you get the version that fits your camera.</p>"}, "lens-wide": {"h": "<p class=\"pp\">A wide angle lens is useful in more ways than you might think. For me, the first place I reach for one is the static showground. If you have ever tried to photograph a large aircraft with people walking around it, you will know how hard it is to fit everything in.</p><p class=\"pp\">I use a Nikon 14 to 24mm, and it has given me some great views of the static displays at the Royal International Air Tattoo. By getting closer and thinking about my angle, I can often fill the frame without including so much of the busy flightline. It works just as well at RAF Cosford and Duxford.</p><p class=\"pp\">Not every shot has to show the whole aircraft. Try getting close to the nose, photographing along a wing, or placing part of the aircraft in the foreground. Check the edges of your frame before taking the shot, because a small step can remove people, barriers and signs.</p><p class=\"pp\">A wide lens is also a lovely way to photograph the airshow itself. Include the crowd watching a display with an aircraft or smoke trail behind them. The aircraft might look small, but that is the point: you are showing what it felt like to be there. These are often the shots other photographers miss.</p><p class=\"pp\">Other examples include the Nikon Z 14 to 30mm f/4 S, Canon RF 14 to 35mm F4L IS USM and Sony FE PZ 16 to 35mm F4 G. Remember the view also depends on whether your camera is full frame or crop sensor.</p>"}, "lens-prime": {"h": "<p class=\"pp\">For creative static photography, the most sensible options are a 35mm or 50mm prime. With no zoom to rely on, you have to move around, change position and think about how the aircraft fills the frame. You find yourself shooting through gaps, getting lower to the ground and noticing details you might normally walk past.</p><p class=\"pp\">They are also much lighter than a 24 to 70mm zoom, which you will notice after a day walking the static park. The 35mm gives a little more space to work with and a fairly natural view, while the 50mm gives a tighter view that helps remove distracting backgrounds. An 85mm or 100mm suits cockpit details, badges and smaller parts of the aircraft, but you may need to stand further back.</p><h4 class=\"bh\">What about long prime lenses?</h4><p class=\"pp\">You can also get long primes at 300mm, 500mm, 600mm and even 800mm. With a 500mm prime, you cannot zoom out when an aircraft comes closer, so you may have the perfect view of it approaching and then find it no longer fits as it flies past.</p><div class=\"tip\"><b>My advice</b><p>Photograph a few airshows with a zoom and see which focal lengths you actually use. If most of your favourite images are at around 500mm, you will have a better idea of whether a 500mm prime would suit you.</p></div>"}, "bags": {"facts": "<div class=\"facts\"><div><b>Small bag or sling</b>One camera and one lens, museums, family days</div><div><b>Rucksack</b>A full airshow day with a long lens</div><div><b>Roller case</b>Lots of kit, short walks, camping trips</div><div class=\"hot\"><b>Check first</b>The show's bag rules and search policy</div></div>", "boxTitle": "Which bag suits you?", "h": "<p class=\"pp\">Choosing a camera bag is a personal choice, but there are a few things to think about first. How much gear do you carry? How far will you walk? Do you need room for food, water and a jacket too?</p><p class=\"pp\">The perfect camera bag is the one that works for the gear you carry and the way you take photos. I have a few bags for different days out. For a one day airshow, I usually take a medium sized backpack. If I am filming as well, I might need a few bags to carry everything.</p><h4 class=\"bh\">Small bags and slings</h4><p class=\"pp\">I have a 6L camera sling for visits to places like museums, when I only want a camera and one lens. That sort of setup works well if you are just starting out, or for a family day where the photos are memories rather than the main event. A 6L bag may be tight with a larger zoom lens, so check the length of your lens before buying.</p><h4 class=\"bh\">Rucksacks</h4><p class=\"pp\">A camera rucksack is what I would suggest for most airshow days. It spreads the weight across both shoulders, which matters when the walk from the car park is long, and leaves room for a jacket, water and lunch. Look for padded dividers you can move around your own kit, a side or back opening so you can reach the camera quickly, and a rain cover tucked in the base.</p><h4 class=\"bh\">Roller cases</h4><p class=\"pp\">A roller case can carry a lot of kit and takes the weight off your back, which can work well if you are camping or have a short walk on hard ground. Showgrounds are often grass, though, and wheels can be hard work on a wet field or in a busy crowd, so think about the show before you choose one.</p><div class=\"tip\"><b>I would suggest</b><p>Choose the bag around the day, your budget, your camera setup and your photography style. Pack it with everything you plan to take before you go, then walk around with it for twenty minutes. If it is uncomfortable at home, it will be worse by mid afternoon.</p></div>"}, "tripods": {"facts": "<div class=\"facts\"><div><b>Flying displays</b>Only with a gimbal head and a heavy lens</div><div><b>Slow shutter</b>Extra support for propeller and rotor blur</div><div><b>Static park</b>Long exposures, low ISO, ND filters</div><div><b>Monopod</b>Support with far more freedom to move</div><div class=\"hot\"><b>My view</b>Handheld still suits most aviation photography</div></div>", "boxTitle": "Do you need one?", "h": "<p class=\"pp\">A tripod probably is not the first thing you think about taking to an airshow. Surely it will slow you down when the aircraft are in the air? And you would be quite right. For a lot of my aviation photography I still prefer shooting handheld, especially with fast jets that can suddenly climb, turn or come almost directly above you. You do not need a tripod, but there are situations where one works really well.</p><h4 class=\"bh\">Using a tripod for flying aircraft</h4><p class=\"pp\">If you are going to use a tripod for the flying display, I would look at a gimbal head rather than a normal tripod head. Once the lens is balanced, you can pan left and right and follow the aircraft up and down without fighting the weight. A balanced gimbal can make a large telephoto lens feel considerably lighter, because the tripod takes the weight rather than your arms. It works particularly well with a 200 to 500mm, 150 to 600mm or 200 to 600mm, or the larger long primes.</p><h4 class=\"bh\">Where I would use one</h4><p class=\"pp\">For me, the main reason is slower shutter speeds. If I am photographing a propeller aircraft or helicopter at around 1/250 or 1/160 and start pushing down towards 1/125, 1/80 or slower, extra support helps. You still have to pan, so the tripod is not doing the work for you. It simply takes the weight and gives you a more stable starting point.</p><h4 class=\"bh\">It is not for every display</h4><p class=\"pp\">Aircraft do not always fly neatly from left to right. A fast jet can pull into the vertical, fly above the crowd or arrive from a completely different direction, and a tripod can get in the way. Handheld gives you complete freedom to turn and react.</p><h4 class=\"bh\">Heavy lenses</h4><p class=\"pp\">This is probably where a tripod or monopod makes the biggest difference. Holding a large camera and lens from early morning to late afternoon gets tiring, even if you can manage it comfortably at first. A tripod lets you rest the camera between displays. It can also make aviation photography much easier for anyone who struggles to hold a heavy setup for long. You should not feel you have to shoot handheld simply because other photographers do.</p><div class=\"tip\"><b>Balance it properly</b><p>Take time to balance a gimbal. Once you loosen it, the lens should not fall forwards or backwards. Slide the lens along the plate like finding the centre of a seesaw. Use the tripod foot on your lens rather than the camera body, and look for Arca Swiss compatible plates so you can move the lens between heads easily.</p></div><h4 class=\"bh\">Tripods for static aircraft</h4><p class=\"pp\">Static aircraft are where a tripod opens up the most creative options. Early morning, evening, night shoots or simply a different style: you can use longer exposures, lower ISO and smaller apertures without camera shake. Add an ND filter, which cuts the light reaching the camera, and you can try long exposures in daylight. Keep the aircraft sharp while the people walking around it blur, or let the clouds stretch behind it.</p><h4 class=\"bh\">What to look for when buying</h4><ul class=\"check\"><li><b>Weight</b><span>You have to carry it. Add the head or gimbal to the weight of the legs. A heavy tripod matters less if you park at the crowd line all day, and much more if you walk all day at somewhere like RIAT.</span></li><li><b>Carbon or aluminium</b><span>Aluminium is cheaper and strong but heavier. Carbon fibre saves weight, with options from around £150 rising to several hundred pounds. I would rather buy a decent aluminium tripod from a good maker than a very cheap carbon one.</span></li><li><b>Load capacity</b><span>Add up the body, lens, grip, teleconverter and plate, and make sure both legs and head handle it with room to spare.</span></li><li><b>Height</b><span>You should not have to bend over for hours. Get most of your height from the legs, as raising the centre column adds movement with a big lens.</span></li><li><b>Leg sections</b><span>More sections fold smaller, but the thinner lower legs feel less solid under a big telephoto.</span></li><li><b>Locks</b><span>Twist or flip locks is personal preference. You want something quick to set up and pack away when you move along the crowd line.</span></li></ul><h4 class=\"bh\">Choosing the head</h4><p class=\"pp\">A gimbal head is my first choice for flying aircraft and large lenses. A ball head works well for general photography and static aircraft, but it is not designed for tracking a jet around the sky. If you mainly film for YouTube or TikTok, a fluid head gives smoother pans and tilts.</p><h4 class=\"bh\">Do not forget the monopod</h4><p class=\"pp\">For some photographers, a monopod is the better option. It takes the weight of the lens but leaves you far more freedom, works well for take offs, landings and passes along the display line, and takes up much less room in a busy crowd. It gets awkward when an aircraft goes high overhead, which is when handheld becomes easier again.</p><div class=\"tip\"><b>So, do you actually need one?</b><p>No. I have photographed aviation handheld for years and still prefer it most of the time. But if you have a heavy lens, struggle to hold your setup for hours, want slower shutter speeds or long exposures in the static park, a tripod or monopod is really useful. Think about the way you shoot first. For one photographer it changes everything. For another it spends the whole day strapped to the side of the bag, and I have definitely been that second person.</p></div>"}, "acc": {"facts": "<div class=\"facts\"><div><b>Power</b>Spare camera battery and a power bank</div><div><b>Storage</b>Spare memory card in a card case</div><div><b>Cleaning</b>Lens cloth and a basic cleaning kit</div><div><b>Weather</b>A rain cover, even when it looks dry</div><div class=\"hot\"><b>Don't forget</b>Ear protection and the right cable</div></div>", "boxTitle": "Start with the basics", "h": "<p class=\"pp\">It is easy to think about the camera and lens first, but some of the smaller things in my bag are just as useful. You do not need to buy everything here. Most of it you add slowly, normally after an airshow where you thought, I really could have done with that today.</p><p class=\"pp\">Your setup also depends on the show. A few hours at a seaside airshow is very different to a full day at RAF Cosford or several days at the Royal International Air Tattoo. Filter the list by the day you have planned.</p><div class=\"ffilter\" role=\"group\" aria-label=\"Filter accessories\"><button class=\"fbtn on\" data-af=\"all\">Everything</button><button class=\"fbtn\" data-af=\"start\">Start with these</button><button class=\"fbtn\" data-af=\"weather\">Bad weather</button><button class=\"fbtn\" data-af=\"long\">Long days and camping</button><button class=\"fbtn\" data-af=\"film\">Filming</button></div><div class=\"acc\" id=\"acclist\"><details class=\"accd\" data-tags=\"start long\"><summary><span class=\"acc-n\">Tech bags and organiser pouches</span><span class=\"acc-s\">Start with these</span></summary><div class=\"acc-b\"><p>A small organiser stops cables, batteries, memory cards, card readers, lens caps, cloths, adapters and power banks getting lost at the bottom of the bag. Nothing fancy is needed. The point is never emptying half your bag to find a cable.</p></div></details><details class=\"accd\" data-tags=\"start\"><summary><span class=\"acc-n\">Spare lens caps</span><span class=\"acc-s\">Start with these</span></summary><div class=\"acc-b\"><p>You take a cap off quickly because something is coming in to display, put it in your pocket, and later have no idea where it went. Use the same pocket every time, and carry a spare if several lenses share a size.</p></div></details><details class=\"accd\" data-tags=\"start weather\"><summary><span class=\"acc-n\">Lens cloths and cleaning kit</span><span class=\"acc-s\">Start with these</span></summary><div class=\"acc-b\"><p>Airshows can be dusty, wet and windy, and seaside shows add sand and sea spray. Take more than one microfibre cloth, a lens pen, a small air blower, lens wipes and a little cleaning fluid. Blow grit off first so you never wipe it across the glass.</p></div></details><details class=\"accd\" data-tags=\"start long\"><summary><span class=\"acc-n\">Spare camera batteries</span><span class=\"acc-s\">Start with these</span></summary><div class=\"acc-b\"><p>Nothing is worse than the battery warning halfway through the flying. Take at least one spare, and a few for a full day. Mirrorless cameras can use more because the screen and viewfinder are on all day. I number my batteries so I know which are used.</p></div></details><details class=\"accd\" data-tags=\"start long\"><summary><span class=\"acc-n\">Memory cards and a card case</span><span class=\"acc-s\">Start with these</span></summary><div class=\"acc-b\"><p>Burst shooting fills cards quickly. Carry more than you think, in a case. Store full cards one way round and empty ones the other, or use two cases, so you never wonder whether a card has been used.</p></div></details><details class=\"accd\" data-tags=\"start long film\"><summary><span class=\"acc-n\">Portable power bank</span><span class=\"acc-s\">Start with these</span></summary><div class=\"acc-b\"><p>Your phone checks the schedule, weather, aircraft updates, maps and wind, and I use mine for filming. A decent power bank keeps it going, and a larger one helps at RIAT or when camping. Remember the cable. I have definitely forgotten it before.</p></div></details><details class=\"accd\" data-tags=\"start weather\"><summary><span class=\"acc-n\">Camera rain cover</span><span class=\"acc-s\">Start with these</span></summary><div class=\"acc-b\"><p>This is the UK, so carry some sort of cover even if the forecast looks good. Proper covers for long lenses are worth it in bad weather, but even a basic emergency cover lets you keep shooting rather than packing away.</p></div></details><details class=\"accd\" data-tags=\"weather\"><summary><span class=\"acc-n\">Small microfibre towel</span><span class=\"acc-s\">Bad weather</span></summary><div class=\"acc-b\"><p>Different from your lens cloth. Use the towel to dry the camera body and lens barrel after rain, and keep the cloth for the glass.</p></div></details><details class=\"accd\" data-tags=\"weather\"><summary><span class=\"acc-n\">Waterproof bags</span><span class=\"acc-s\">Bad weather</span></summary><div class=\"acc-b\"><p>A few zip lock or small dry bags keep batteries, cards, cables and electronics dry, and separate wet cloths from dry kit. Very handy at seaside shows.</p></div></details><details class=\"accd\" data-tags=\"long\"><summary><span class=\"acc-n\">Small folding stool</span><span class=\"acc-s\">Long days</span></summary><div class=\"acc-b\"><p>Something to sit on between displays makes a long day on the crowd line far easier, and it can help you get a lower angle on static aircraft. Never block a walkway with it.</p></div></details><details class=\"accd\" data-tags=\"start long\"><summary><span class=\"acc-n\">Ear protection</span><span class=\"acc-s\">Start with these</span></summary><div class=\"acc-b\"><p>Fast jets are loud. A small pair of reusable earplugs takes up no room, and over a full season your ears will thank you.</p></div></details><details class=\"accd\" data-tags=\"\"><summary><span class=\"acc-n\">Lens hood</span></summary><div class=\"acc-b\"><p>It helps with flare and bright light, and protects the front of the lens from knocks in a crowd of people, bags and chairs.</p></div></details><details class=\"accd\" data-tags=\"film\"><summary><span class=\"acc-n\">Phone lanyard or wrist strap</span><span class=\"acc-s\">Filming</span></summary><div class=\"acc-b\"><p>With a camera, bag and spare lens in your hands, a phone is easy to drop, especially when checking the schedule or filming clips.</p></div></details><details class=\"accd\" data-tags=\"long\"><summary><span class=\"acc-n\">Bluetooth tracker</span><span class=\"acc-s\">Long days</span></summary><div class=\"acc-b\"><p>A tracker inside a bag full of expensive kit will not stop someone taking it, but it gives you another way to find it if it goes missing or gets left behind.</p></div></details><details class=\"accd\" data-tags=\"\"><summary><span class=\"acc-n\">Gaffer tape and reusable cable ties</span></summary><div class=\"acc-b\"><p>Wrap a little tape around an old card for loose cables, broken straps, rain covers and temporary repairs. Cable ties stop your organiser turning into one big knot.</p></div></details><details class=\"accd\" data-tags=\"long\"><summary><span class=\"acc-n\">Small torch or head torch</span><span class=\"acc-s\">Long days</span></summary><div class=\"acc-b\"><p>Useful when camping or arriving very early and packing up late. A head torch keeps both hands free. Try not to blind everyone around you.</p></div></details><details class=\"accd\" data-tags=\"long\"><summary><span class=\"acc-n\">Strap, sling or harness</span><span class=\"acc-s\">Long days</span></summary><div class=\"acc-b\"><p>The standard strap may be fine, but eight hours with a big lens around your neck might change your mind. Sling straps suit one setup, and a dual harness works well with two bodies.</p></div></details><details class=\"accd\" data-tags=\"long\"><summary><span class=\"acc-n\">Card reader and portable SSD</span><span class=\"acc-s\">Long days</span></summary><div class=\"acc-b\"><p>Not essential for a day trip, but at a multi day show you can back up photos each evening. I would leave the SSD at the hotel or campsite rather than carry it around the showground.</p></div></details><details class=\"accd\" data-tags=\"weather long\"><summary><span class=\"acc-n\">Silica gel packs</span><span class=\"acc-s\">Bad weather</span></summary><div class=\"acc-b\"><p>They absorb a little moisture inside the bag after damp days. They will not dry soaked kit, so still dry everything properly at home.</p></div></details><details class=\"accd\" data-tags=\"start\"><summary><span class=\"acc-n\">Notebook or notes app</span><span class=\"acc-s\">Start with these</span></summary><div class=\"acc-b\"><p>Write down settings that worked, positions you liked, kit you forgot and shots to try again. By the time you get home and go through your photos, you will have forgotten half of it.</p></div></details></div><div class=\"tip\"><b>Do not carry things just because someone else does</b><p>That photographer with a huge bag might be filming, using two cameras, working or staying for several days. Your setup might be one camera, one lens, two batteries and a couple of cards, and there is nothing wrong with that. If something sat at the bottom of your bag for a whole season, you probably do not need it.</p></div>"}, "gimbals": {"facts": "<div class=\"facts\"><div><b>DJI RS 2 Pro</b>Larger camera rigs, 4.5kg tested payload</div><div><b>Hohem MT3 Pro</b>Z6 with a 24 to 70mm or 50mm, up to 2.5kg</div><div><b>Hohem M7</b>Phone filming, up to 500g</div><div class=\"hot\"><b>Remember</b>No gimbal will follow a fast jet for you</div></div>", "boxTitle": "My gimbals", "h": "<p class=\"pp\">If you film airshows for YouTube, TikTok or your own cinematic videos, a gimbal keeps your footage smooth. I find them most useful for the parts of the day around the flying: walking into the showground, moving past static aircraft, filming the crowds and following an aircraft as it taxis.</p><p class=\"pp\">You do not need the biggest gimbal you can find. The right choice depends on whether you film on a camera or a phone, how much you want to carry and the sort of video you make.</p><div class=\"cols\"><div class=\"col\"><span class=\"badge alt\">Large camera rigs</span><b>DJI RS 2 Pro Combo</b><p>The one I choose for a larger rig. DJI tested it with a 4.5kg payload, giving room for a heavier camera and lens. I use it when I have particular shots in mind for a longer film, but once everything is mounted it is more to carry around a big showground.</p></div><div class=\"col\"><span class=\"badge alt\">Smaller camera rigs</span><b>Hohem iSteady MT3 Pro</b><p>My choice for the Nikon Z6 with a 24 to 70mm or 50mm prime. It supports up to 2.5kg and weighs about 1.07kg without its tripod. Great for the static park, details and taxiing aircraft. It has subject tracking, but I would still practise controlling the movement myself.</p></div><div class=\"col\"><span class=\"badge alt\">Phone gimbal</span><b>Hohem iSteady M7</b><p>For phone filming. It supports up to 500g and has a detachable touchscreen remote and tracking module, handy when talking to camera. For TikTok or quick updates, a phone is much easier than setting up a camera.</p></div><div class=\"col\"><span class=\"badge alt\">All in one</span><b>DJI Osmo Pocket 4P</b><p>The camera and gimbal are built together. At 230g with 20mm and 60mm equivalent views and 4K at 60fps, it is great for telling the story of the day. It will not replace a long telephoto when the aircraft are distant.</p></div></div><h4 class=\"bh\">Other options to consider</h4><p class=\"pp\">If you like the RS 2 but do not need its payload, look at the DJI RS 3 or RS 4, both tested to 3kg. The RS 4 makes switching to vertical filming easier for both YouTube and TikTok. The RS 3 Mini and RS 4 Mini support up to 2kg. Hohem's iSteady MT2 supports 1.2kg and the MT3 supports 1.4kg. Weigh your complete setup first, including any microphone or cage.</p><p class=\"pp\">For phones, the Hohem iSteady X3 SE is a small foldable starter option for phones up to 300g, with the V3, V3 Ultra and M6 in between. From DJI, the Osmo Mobile 7 is a straightforward start, the 7P adds an extension rod and tripod, and the 8 and 8P add more rotation and framing controls. Check your phone fits with its case and microphone.</p><div class=\"tip\"><b>Price and second hand</b><p>As a rough guide when I checked, the Hohem X3 SE was about £75, the M6 about £121, the MT2 kit about £223, the M7 around £254 to £269 and the MT3 Pro kit around £280 to £330. DJI listed the Osmo Mobile 7P from £81, the 8P from £135 and the Osmo Pocket 4P Standard Combo at £529. These are guide prices and will change. Used RS 2, RS 3 Mini and RS 4 gimbals come up second hand, so check each listing includes the plates, grips and cables you need and that the battery holds charge.</p></div><p class=\"pp\">For me, the choice comes down to the video I want to make. A phone gimbal is an easy start, a smaller camera gimbal gives more control over the look, and the RS 2 makes sense for a larger rig. You can make a good airshow video with any of them if the setup suits the way you like to film.</p>"}};

 blur:{tag:'The most common problem',t:'Fixing a <em>blurry</em> aircraft',p:'Usually the shutter speed was too slow for the aircraft, or the pan stopped at the moment you pressed the button. Sometimes the autofocus locked on a fraction late.',fix:['<b>Speed up for jets.</b> In shutter priority, start at 1/1000 to 1/1600 second for fast passes.','<b>Keep panning</b> smoothly before, during and after the burst, turning from your hips rather than your arms.','<b>Use continuous autofocus</b> (AF-C or AI Servo) with a single point or small group on the aircraft.','<b>Switch stabilisation on</b>, ideally in its panning mode, often called Mode 2.'],read:[['depth-fast-jets-and-high-speed-passes','Fast jets and high speed passes'],['depth-panning-for-movement','Panning for movement'],['depth-autofocus-settings-and-how-to-keep-the-aircraft-in-focus','Autofocus settings']],tip:'I would advise getting the safe, sharp shot first at a faster speed, then slowing down once you have it in the bag.'},
 prop:{tag:'Propeller aircraft',t:'Bringing the <em>propeller</em> back to life',p:'A fast shutter speed freezes the blades, so the aircraft looks as if its engine has stopped. Propellers and rotors need a slower speed to show movement.',fix:['<b>Drop to about 1/320 second</b>, then 1/250 once you are getting sharp frames.','<b>Helicopters</b> look good from 1/250 to 1/320 second, and slower again for a full rotor disc.','<b>Pan with your whole upper body</b> and follow through after you release the shutter.','<b>Shoot short bursts.</b> At slow speeds only some frames will be sharp, and that is completely normal.'],read:[['depth-propeller-aircraft-keep-movement-in-the-blades','Propeller aircraft'],['depth-helicopters-and-rotor-blur','Helicopters and rotor blur'],['propTester','The propeller blur tester']],tip:'I would suggest practising at a warbird show such as Duxford, where you get plenty of propeller passes in one day.'},
 dark:{tag:'Exposure',t:'When the aircraft comes out <em>too dark</em>',p:'A bright sky fools the camera meter into darkening the whole picture, and an aircraft with the sun behind it is lit from the wrong side.',fix:['<b>Add exposure compensation</b>, around plus 0.7 to plus 1, when the aircraft is against a bright sky.','<b>Try spot or centre weighted metering</b> so the camera reads the aircraft, not the sky.','<b>Check where the sun is.</b> The sun guide on each show page shows the best lit side through the day.','<b>Shoot RAW</b> so you can lift the shadows a little afterwards.'],read:[['depth-dark-aircraft-backlighting-and-silhouettes','Dark aircraft and backlighting'],['depth-overcast-skies-and-changing-cloud','Overcast skies'],['shows','Shows for photographers']],tip:'Silhouettes can be beautiful on purpose. If the light is behind the aircraft, try one against the brightest part of the sky.'},

var P={};
P.start=function(){return [
 {id:'welcome',t:'Welcome to the photography hub',lvl:['b','Beginner'],h:'<p class="pp">Aviation photography isn’t about owning the most expensive camera or the biggest lens. It’s about understanding your equipment, watching the light and learning to follow aircraft smoothly.</p><p class="pp">These guides bring together my New to aviation photography guide and the full equipment guide, plus tools I wish I had when I started: a lens reach simulator, a photo fixer, a shot list challenge and a guide to which shows suit which photos.</p><p class="pp">I would suggest thinking about how into aviation you are before you spend anything. If you mainly want family memories with a few good flying shots, the kit you own may already be enough.</p><div class="facts"><div><b>Camera mode</b>Shutter priority is a good place to begin</div><div><b>Flying displays</b>A telephoto lens helps you frame aircraft at a distance</div><div><b>Static aircraft</b>A standard or wide lens for angles and composition</div><div class="hot"><b>Best advice</b>Practise, and learn from what works and what doesn’t</div></div><div class="tip"><b>Before you buy</b><p>Use what you already own first. Shoot a show or two with your current camera, then upgrade the thing that held you back. Always check event rules on tripods, stepladders and bags.</p></div>'},
 {id:'begin',t:'Where would you like to begin?',lvl:['b','Beginner'],h:'<p class="pp">Pick the option that sounds most like you, and I’ll point you to the four parts of these guides worth reading first.</p>'+picker('pk',PICKS,'Where you are now')},
 {id:'steps',t:'Six steps to your first big show',lvl:['b','Beginner'],h:'<p class="pp">Most people go straight to the biggest show of the year and come home with a card full of blurry jets. I would suggest building up to it instead. Each step teaches you something the next one relies on.</p>'+steps([['Learn your camera at home','Find out how to change shutter speed, switch to continuous autofocus and burst mode, and move your focus point, all without looking. At a show, the aircraft won’t wait while you search the menus.'],['Practise on anything that moves','Cars on a road, trains, cyclists, gulls over the beach. Following a moving subject smoothly is a skill you can train anywhere. Birds are the toughest test of all, because they don’t fly a predictable display line.'],['Start with statics','Aviation museums and static displays let you learn composition, light and detail shots with no time pressure. Try the whole aircraft, then the nose art, the engines, the undercarriage and the crew.'],['Pick a smaller show','Quieter airfields and smaller shows give you space at the crowd line, slower aircraft and more relaxed crowds. It’s the best place to practise panning and propeller blur before a big event.'],['Go with a plan','Check the flying programme, where the sun will be through the day and where the display line runs. If you want a front row spot, head there first and save your pitch, then explore the static park.'],['Review, edit, repeat','Back at home, look at your keepers and your rejects. Was the blur from camera shake or a missed focus? Edit your best ten, not your best hundred. Then revisit older folders now and then, as you’ll find gems you skipped first time.']])+photo('typhoon-static')},
 {id:'next',t:'Where to go next',lvl:null,h:'<p class="pp">Once you have your first show in the diary, these are the guides I would read next.</p><div class="chips"><button class="chip dk" data-go="settings">Camera settings</button><button class="chip dk" data-go="kit">Camera and equipment</button><button class="chip dk" data-go="pack">Pack and prepare</button><button class="chip lt" data-go="shows">Shows for photographers</button></div>'}
]};

 {id:'quick',t:'Your first settings',lvl:['b','Beginner'],h:'<p class="pp">These are starting points, not rules. Light, distance and the aircraft itself all change what works. Pick the type of aircraft to see where to begin.</p>'+quickUI()},
 {id:'calc',t:'Settings calculator',lvl:['c','Improver'],h:'<p class="pp">Pick what’s flying, the weather, where the sun is and your lens. It never goes faster than 1/1600 or above ISO 1200, so your files stay clean and the shutter speed stays realistic for the subject.</p>'+calcUI()},
 {id:'prop',t:'Why propellers need a slower shutter',lvl:['c','Improver'],h:'<p class="pp">Freeze a propeller and a Spitfire looks like a model hanging from the ceiling. Slow the shutter and the blades turn into a blur that says the engine is running. The catch is that the slower you go, the more any wobble in your panning shows up.</p><p class="pp">Drag the slider to see how much of the propeller disc blurs at each speed.</p>'+propUI()},

P.tips=function(){return [
 {id:'watch',t:'What to look out for',lvl:['b','Beginner'],h:'<p class="pp">Good airshow photos are usually decided before you press the shutter. These are the things experienced photographers check without thinking about it.</p>'+steps([['Where the sun is','Shooting into the sun turns aircraft into dark silhouettes. Work out where it will be during the flying and, if you can, choose a spot with it behind or beside you. Light often changes completely between the morning and the afternoon.'],['The display line','Aircraft fly set lines in front of the crowd. Standing near the centre of the display usually gives you the closest passes and the best topside views as aircraft turn.'],['Clouds are a gift','A plain blue sky is fine, but some texture behind the aircraft adds drama. Grey overcast days are harder, so dial in a little positive exposure compensation so the aircraft isn’t underexposed.'],['Room to fly into','Leave space in the frame in the direction the aircraft is travelling, and don’t zoom so tight that wingtips get clipped. You can always crop later, but you can’t add back a missing wing.'],['Smoke, vapour and turns','The best moments are often just after the obvious one: the break from formation, the vapour in a hard turn, the smoke trail curling behind. Keep following the aircraft rather than lowering the camera as it passes.']])+photo('typhoon-gear')},
 {id:'more',t:'Five more things to watch',lvl:['c','Improver'],h:steps([['Clutter on the ground','Fences, heads, cones and parked vehicles creep into low passes and static shots. A step to the side or a slightly different angle often cleans the whole frame up.'],['Heat haze','On hot days, shooting along a long stretch of runway makes aircraft look soft no matter how good your focus is. Shots with the aircraft against the sky are usually sharper.'],['Avoid the machine gun','Holding the shutter down for an entire pass fills your card and gives you hours of sorting. Fire short, deliberate bursts at the moments that matter: the turn, the closest point, the smoke.'],['Your level horizon','A tilted horizon is one of the most common beginner giveaways. It’s easy to fix when editing, but even easier to keep straight while you pan.'],['The people around you','Don’t block someone else’s view, keep stepladders and bags tidy, and share the crowd line. Photographers who are patient and friendly tend to pick up the best tips from the regulars beside them.']])},
 {id:'arrive',t:'Getting your spot',lvl:['b','Beginner'],h:'<p class="pp">If you want a front row seat, head there first and save your pitch. Then look around the static show, speak to the pilots, visit the trade stalls and check the food options. Visit the toilet before the flying display starts, and if you aren’t waiting to see a particular display, use it as a toilet break.</p>'+photo('f16-taxi')},
 {id:'mistakes',t:'Twelve first season mistakes',lvl:['b','Beginner'],h:'<p class="pp">Everyone makes these. Knowing them in advance saves you a season of trial and error.</p><div class="facts"><div><b>Propellers</b>Frozen blades from a shutter speed that’s too fast</div><div><b>Autofocus</b>Using single shot autofocus on moving aircraft</div><div><b>Panning</b>Stopping the pan the moment you press the shutter</div><div><b>Exposure</b>Dark aircraft against a bright sky with no compensation</div><div class="hot"><b>Arrival</b>Arriving after the best spots on the crowd line have gone</div><div><b>Batteries</b>Only one battery, flat by the afternoon</div><div><b>Sun</b>Never checking where the sun will be</div><div><b>Framing</b>Zooming so tight the wingtips get cut off</div><div><b>Editing</b>Shooting thousands of frames and editing none</div><div><b>Buying</b>Buying a new camera before a better lens</div><div><b>Comfort</b>Packing for the shoot but forgetting sun cream and water</div><div><b>Tickets</b>Leaving the ticket and parking pass at home</div></div>'+seeAlso('lab','When something has already gone wrong, try the photo fixer in','fix')}
]};
P.kit=function(){return [
 {id:'glance',t:'The gear you actually need',lvl:['b','Beginner'],h:'<p class="pp">Aviation photography rewards reach and speed more than megapixels. I would advise spending your money on the lens before the camera, and you don’t need to buy everything at once.</p>'+gearUI()},
 {id:'ways',t:'Three ways to build your kit',lvl:['b','Beginner'],h:'<p class="pp">Pick the one that sounds most like you. You can always move up a step once you know what is holding you back.</p><div class="cols"><div class="col"><span class="badge">Step 1</span><b>Start with what you own</b><p><strong>Body:</strong> the camera you already have.<br><strong>Lens:</strong> a 70 to 300mm zoom.<br><strong>Best for:</strong> first shows, smaller and seaside events.</p><p>A 70 to 300mm lets you try flying shots without spending a fortune, and it is still useful for taxi shots and details in the static park.</p></div><div class="col"><span class="badge alt">Step 2</span><b>Smart second hand</b><p><strong>Body:</strong> a used Nikon D7100 or D7200, Canon EOS 80D or Sony a6300.<br><strong>Lens:</strong> a used 70 to 300mm, or a Sigma or Tamron 150 to 600mm.<br><strong>Best for:</strong> more reach for your money.</p><p>A good used body can give you more than a cheaper new one, and the money you save goes on the lens.</p></div><div class="col"><span class="badge dim">Step 3</span><b>The step up</b><p><strong>Body:</strong> a used mirrorless body, or a sports DSLR like the Nikon D500.<br><strong>Lens:</strong> a 200 to 500mm or 150 to 600mm class zoom.<br><strong>Best for:</strong> big shows and distant displays.</p><p>I bought a used Nikon Z6 for around £400, which shows you no longer have to spend thousands to get a capable mirrorless camera.</p></div></div>'},
 {id:'cameras',t:'Choosing a camera',lvl:['b','Beginner'],h:EQ.cameras.facts+EQ.cameras.h},
 {id:'tele',t:'Telephoto, the main airshow lens',lvl:['b','Beginner'],h:EQ.lenses.facts+EQ['lens-tele'].h+'<div class="chips"><button class="chip pu" data-go="lab" data-to="reach">Try the lens reach simulator</button></div>'},
 {id:'wide',t:'Wide angle and prime lenses',lvl:['c','Improver'],h:EQ['lens-wide'].h+'<h4 class="bh">Prime lenses at an airshow</h4>'+EQ['lens-prime'].h},

 {id:'acc',t:'Accessories worth packing',lvl:['b','Beginner'],h:EQ.acc.facts+EQ.acc.h+'<div class="chips"><button class="chip pu" data-go="pack" data-to="packing">Open the packing list</button></div>'},
 {id:'gimbals',t:'Gimbals for filming',lvl:['l','Enthusiast'],h:EQ.gimbals.facts+EQ.gimbals.h},
 {id:'prices',t:'Kit prices by brand',lvl:['b','Beginner'],h:'<p class="pp">Here is what the main cameras, lenses and accessories cost new, brand by brand. Pick your brand, then tick anything you are thinking of buying to add up a rough total across every tab. Each Check price button opens a search on Wex, so you can see today’s price.</p>'+priceUI()+'<div class="tip"><b>You do not need everything here</b><p>One body and one long lens will get you great shots at your first show. I would advise buying the Good first buy pair for your brand, going to a show, then adding a second lens once you know what you like to shoot. Used kit from a dealer with a warranty can save you a lot.</p></div>'},

 {id:'packing',t:'Packing list',lvl:['b','Beginner'],h:'<p class="pp">Tick things off as you pack. Your ticks are saved on this device, so you can come back to it, and you can print the list or save it to your phone further down.</p><div class="tbar" id="packBar"></div><div class="pgrid" id="packList"></div>'},
