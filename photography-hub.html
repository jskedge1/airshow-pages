P.learn=function(){return [
 {id:'coap',t:'Organised shoots with COAP Wings',lvl:['c','Improver'],h:'<p class="pp">COAP, the Centre of Aviation Photography, is a UK organisation founded in 2015 by professional aviation photographer and journalist Rich Cooper. It runs organised shoots for photographers of all levels.</p><p class="pp">The big value isn’t just the access to aircraft. It’s being in a small group with experienced photographers who share settings, positioning and editing tips as you go. Their heritage and night shoots are a great next step once you’re comfortable at airshows.</p><div class="facts"><div><b>Heritage Wings</b>Themed shoots and night shoots with classic aircraft</div><div><b>Air to Air</b>Photography flights alongside aircraft in the air</div><div><b>Exotic Wings</b>Organised trips to military aviation abroad</div><div><b>The Debrief</b>Write ups from past shoots, great for ideas</div></div><div class="chips"><a class="chip pu" target="_blank" rel="noopener" href="https://www.coapwings.com/">Visit COAP Wings</a></div>'},
 {id:'read',t:'Articles worth reading',lvl:['b','Beginner'],h:'<div class="show"><div><b>Rich Cooper’s articles</b><small>Fighter Pilot Podcast</small></div><div><p>Practical, experience led pieces from COAP’s founder: practise your panning on birds, re edit old folders, check and clean your kit before the season and be courteous on the crowd line.</p></div><div class="slinks"><a class="chip dk" target="_blank" rel="noopener" href="https://www.fighterpilotpodcast.com/musings/categories/photography-1">Read the articles</a></div></div><div class="show"><div><b>Airshow tips and tricks</b><small>Park Cameras</small></div><div><p>A clear UK guide to shutter speeds for jets and propellers, panning technique and continuous shooting.</p></div><div class="slinks"><a class="chip dk" target="_blank" rel="noopener" href="https://www.parkcameras.com/blog/tips-and-inspiration/tips-and-tricks-for-fantastic-airshow-photos_tutorial-25-07-2018-1">Read the guide</a></div></div><div class="show"><div><b>Seven tips to get started</b><small>Digital Photography School</small></div><div><p>Where to practise, detail shots, finding your own style and moving on to night photography.</p></div><div class="slinks"><a class="chip dk" target="_blank" rel="noopener" href="https://digital-photography-school.com/seven-tips-aviation-photography/">Read the guide</a></div></div><div class="show"><div><b>A guide for beginners</b><small>Digital Photography School</small></div><div><p>Good on the balance between shutter speed and camera shake, and why propeller aircraft need different settings to jets.</p></div><div class="slinks"><a class="chip dk" target="_blank" rel="noopener" href="https://digital-photography-school.com/air-show-photography-a-guide-for-beginners/">Read the guide</a></div></div>'},
 {id:'forum',t:'Get honest feedback',lvl:['c','Improver'],h:'<div class="show alt"><div><b>Talk Photography forums</b><small>UK community</small></div><div><p>A long running UK forum with an active aviation section. Post your shots and ask for honest feedback from people who shoot the same shows.</p></div><div class="slinks"><a class="chip dk" target="_blank" rel="noopener" href="https://www.talkphotography.co.uk/">Visit the forum</a></div></div>'},
 {id:'view',t:'Patience beats pricey kit',lvl:null,h:'<p class="pp">The photographers whose work you admire didn’t get there by buying the most expensive lens. They got there by turning up, getting it wrong, and working out why. Your first season will have plenty of blurred Spitfires and clipped wingtips. That’s normal, and it’s how everyone learns.</p><p class="pp">Start with the gear you have, learn shutter priority inside out, pick a smaller show to practise at and edit your favourites when you get home. By the end of the summer you’ll be amazed at the difference.</p><p class="nc-sign">Jack Skedge</p>'},
 {id:'src',t:'Independent',lvl:null,h:'<p class="src">The Big Guide to UK Airshows is an independent visitor guide and is not affiliated with COAP, the Fighter Pilot Podcast, Park Cameras, Digital Photography School or Talk Photography.</p>'}
]};
