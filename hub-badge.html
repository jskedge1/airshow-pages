<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Hub Badge</title>
<!-- seo: matches the Wix page on ukairshowguide.co.uk -->
<meta name="robots" content="noindex, nofollow">
<!-- /seo -->
</head>
<body>
<script>
/* Hidden helper for the site header (21 Oct 2026). My Airshow Hub saves a small summary (next show and new updates)
   in this site's storage; the header loads this page out of sight and gets the summary for its Airshow Hub tab.
   The Command Centre and Admin Board save ukagAdmin here when the admin account opens them, so the header shows the admin links (6 Nov 2026). */
(function () {
  function send() {
    var sum = null;
    var admin = false;
    try { sum = JSON.parse(localStorage.getItem("ukagHubSummary")); admin = !!localStorage.getItem("ukagAdmin"); } catch (e) {}
    sum = sum || { in: false };
    sum.admin = admin;
    window.parent.postMessage({ ukagBadge: sum }, "*");
  }
  window.addEventListener("storage", function (e) { if (e.key === "ukagHubSummary" || e.key === "ukagAdmin") send(); });
  window.addEventListener("message", function (e) { if (e.data === "ukagBadge?") send(); });
  send();
})();
</script>
</body>
</html>
