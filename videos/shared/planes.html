<!doctype html><meta charset="utf-8"><body style="margin:0;background:#CFE4EE;font:700 34px sans-serif;color:#22344A">
<div style="padding:30px">The site's own aircraft drawings (from the forum)</div>
<div id="g" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 30px"></div>
<script src="../../forum-planes.js"></script>
<script>
const P=window.ForumPlanes; const kinds=P.list;
console.log(Object.keys(P).join(','), JSON.stringify(kinds).slice(0,300));
kinds.forEach(k=>{const d=document.createElement('div');d.innerHTML='<div style="width:400px">'+P.svg(k)+'</div>'+'<div style="text-align:center;font-size:26px">'+P.name(k)+'</div>';g.appendChild(d)});
</script>
