<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Two Days, Same Airshow</title>
<style>
  @font-face { font-family: Barlow; src: url(../shared/fonts/barlow-latin-500-normal.woff2) format('woff2'); font-weight: 500; }
  @font-face { font-family: Barlow; src: url(../shared/fonts/barlow-latin-600-normal.woff2) format('woff2'); font-weight: 600; }
  @font-face { font-family: Barlow; src: url(../shared/fonts/barlow-latin-700-normal.woff2) format('woff2'); font-weight: 700; }
  @font-face { font-family: Barlow; src: url(../shared/fonts/barlow-latin-800-normal.woff2) format('woff2'); font-weight: 800; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · arrows: step · click: scrub</div>
<script type="module" src="film.js"></script>
</body>
</html>
