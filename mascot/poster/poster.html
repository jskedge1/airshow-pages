<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pip poster: it must be airshow season</title>
<style>
@font-face{font-family:Barlow;src:url(../film/fonts/display.ttf);font-weight:800}
@font-face{font-family:Barlow;src:url(../film/fonts/ui.ttf);font-weight:600}
@page{size:297mm 420mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Barlow,sans-serif;font-weight:600;color:#13293C}
svg.pip{display:block;width:100%;height:auto}
.poster{width:297mm;height:420mm;background:#F8F4EA;position:relative;overflow:hidden;display:flex;flex-direction:column}
.top{padding:13mm 16mm 0;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2}
.top img{width:78mm}
.hero{position:relative;flex:1;min-height:0;padding:6mm 16mm 0;display:flex;flex-direction:column}
.streak{position:absolute;height:5mm;transform:rotate(-12deg);transform-origin:0 50%}
h1{font-weight:800;font-size:62mm;line-height:.88;margin:0;position:relative;z-index:2}
.line2{font-weight:800;font-size:20.5mm;line-height:1;color:#23908C;margin:3mm 0 0;position:relative;z-index:2}
.stage{position:relative;flex:1;min-height:0;padding:8mm 0 11mm;display:flex;align-items:center;justify-content:center}
.frame{position:relative;width:136mm;height:136mm;background:#fff;transform:rotate(-3deg);box-shadow:6mm 6mm 0 #23908C;display:flex;align-items:center}
.frame>div{width:100%;transform:rotate(3deg) scale(1.08)}
.meet{position:absolute;left:0;bottom:11mm;max-width:58mm;font-size:7.4mm;line-height:1.2;z-index:2}
.meet b{display:block;font-weight:800;font-size:13mm;line-height:1}
.strapv{position:absolute;right:0;bottom:9mm;text-align:right;font-weight:800;font-size:13mm;line-height:1.08;z-index:2}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.three div{color:#fff;padding:8mm 7mm 9mm}
.three b{display:block;font-weight:800;font-size:8.7mm;white-space:nowrap;line-height:1;margin-bottom:4mm}
.three ul{list-style:none;margin:0;padding:0}
.three li{display:flex;gap:3mm;align-items:flex-start;font-size:5.9mm;line-height:1.15;margin-bottom:2.6mm}
.three svg{width:6.4mm;height:6.4mm;flex:none}
.foot{background:#13293C;color:#fff;display:flex;align-items:center;gap:9mm;padding:8mm 16mm}
.foot img{width:33mm;display:block}
.foot b{display:block;font-weight:800;font-size:12.5mm;line-height:1.05}
.foot span{font-size:6.4mm;opacity:.92;display:block;margin-top:1.4mm}
.foot .url{color:#FFC23A;font-weight:800;font-size:10mm;opacity:1;margin-top:2mm}
</style>
</head>
<body>
<div class="poster">
  <div class="top"><img src="../../brand/UK-Airshow-Guide-logo-transparent.png" alt="UK Airshow Guide"></div>
  <div class="hero">
    <i class="streak" style="left:-10mm;top:168mm;width:330mm;background:#32B4AF;opacity:.45"></i>
    <i class="streak" style="left:-10mm;top:179mm;width:330mm;background:#D74949;opacity:.4"></i>
    <i class="streak" style="left:150mm;top:40mm;width:200mm;background:#13293C;opacity:.1"></i>
    <h1>See Pip?</h1>
    <p class="line2">It must be airshow season.</p>
    <div class="stage">
      <div class="frame"><div id="hero"></div></div>
      <div class="meet"><b>Meet Pip</b>The mascot of The Big Guide to UK Airshows.</div>
      <div class="strapv"><span style="color:#23908C">Plan.</span><br><span style="color:#1F4E8C">Inform.</span><br><span style="color:#D74949">Prepare.</span></div>
    </div>
  </div>
  <div class="three" id="three"></div>
  <div class="foot">
    <img src="qr.svg" alt="QR code for ukairshowguide.co.uk">
    <div><b>Every UK airshow, one easy guide</b><span>Find Pip on Instagram, Facebook and YouTube.</span><span class="url">ukairshowguide.co.uk</span></div>
  </div>
</div>
<script src="../mascot.js"></script>
<script>
document.getElementById('hero').innerHTML = UKAGMascot.svg({ pose: 'hello', title: 'Pip, waving hello' });
var TICK = '<svg viewBox="0 0 70 70"><rect x="4" y="4" width="62" height="62" fill="#fff"/><path d="M16 36l13 13 26-30" fill="none" stroke="#13293C" stroke-width="9" stroke-linecap="square"/></svg>';
var COLS = [['#23908C', 'Pip helps you plan', ['Pick the right show for you', 'Sort your tickets and parking', 'Work out your day']],
  ['#1F4E8C', 'Pip keeps you informed', ['The dates and the line-up', 'How to get there', 'The rules on site']],
  ['#D74949', 'Pip gets you ready', ['What to pack', 'Little ears protected', 'The weather and getting home']]];
document.getElementById('three').innerHTML = COLS.map(function (c) {
  return '<div style="background:' + c[0] + '"><b>' + c[1] + '</b><ul>' + c[2].map(function (x) { return '<li>' + TICK + '<span>' + x + '</span></li>'; }).join('') + '</ul></div>';
}).join('');
</script>
</body>
</html>
