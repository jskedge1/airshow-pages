<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Big Guide to UK Airshows</title>
<style>
  /* Two faces only, the site's own pair: Barlow Condensed (display) and Barlow (UI). */
  @font-face { font-family: Display; src: url(fonts/BarlowCondensed-SemiBold.ttf) format('truetype'); font-weight: 600; }
  @font-face { font-family: Display; src: url(fonts/BarlowCondensed-Bold.ttf) format('truetype'); font-weight: 700; }
  @font-face { font-family: Display; src: url(fonts/BarlowCondensed-ExtraBold.ttf) format('truetype'); font-weight: 800; }
  @font-face { font-family: UI; src: url(fonts/Barlow-Regular.ttf) format('truetype'); font-weight: 400; }
  @font-face { font-family: UI; src: url(fonts/Barlow-Medium.ttf) format('truetype'); font-weight: 500; }
  @font-face { font-family: UI; src: url(fonts/Barlow-SemiBold.ttf) format('truetype'); font-weight: 600; }
  @font-face { font-family: UI; src: url(fonts/Barlow-Bold.ttf) format('truetype'); font-weight: 700; }
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1 ui-monospace, monospace; color: #888; }
  .render #hud { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div id="hud">space: play/pause · ←/→: step · click: scrub · ?format=9x16 to preview other formats</div>
<script type="module" src="film.js"></script>
</body>
</html>
